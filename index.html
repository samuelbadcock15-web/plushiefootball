<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Plushie Foosball & Rugby Arena</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #05020a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: manipulation;
    }
    #canvas3d { width: 100%; height: 100%; display: block; cursor: pointer; }

    #hud {
      position: absolute; top: 15px; left: 15px; background: rgba(22, 9, 44, 0.9);
      border: 2px solid #ff79b0; border-radius: 12px; padding: 12px 18px; color: #fff;
      font-family: monospace; font-size: 0.85rem; pointer-events: none; z-index: 20;
      box-shadow: 0 0 20px rgba(255, 121, 176, 0.25);
    }
    #room-code-pill { margin-top: 5px; font-weight: bold; color: #39ff14; font-size: 0.95rem; }
    #countdown-pill { margin-top: 6px; font-weight: bold; color: #ffda66; font-size: 0.95rem; }
    #match-clock-hud { margin-top: 4px; font-weight: bold; color: #00f0ff; font-size: 0.95rem; }
    #audience-pill { margin-top: 4px; font-weight: bold; color: #39ff14; }

    #mode-banner {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(22, 9, 44, 0.92); border: 2px solid #00f0ff; border-radius: 10px;
      padding: 10px 20px; color: #ffda66; font-family: monospace; font-size: 0.9rem;
      z-index: 25; text-align: center; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      pointer-events: none;
    }

    #mobile-dpad {
      position: absolute;
      bottom: 30px;
      left: 30px;
      display: none;
      grid-template-areas:
        ". up ."
        "left down right";
      gap: 12px;
      z-index: 30;
      pointer-events: auto;
      touch-action: none;
    }

    @media (pointer: coarse), (max-width: 900px) {
      #mobile-dpad { display: grid; }
    }

    .dpad-btn {
      width: 60px;
      height: 60px;
      background: rgba(22, 9, 44, 0.85);
      border: 2px solid #00f0ff;
      border-radius: 14px;
      color: #00f0ff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
      transition: background 0.1s, box-shadow 0.1s, border-color 0.1s;
    }

    .dpad-btn.active, .dpad-btn:active {
      background: rgba(0, 240, 255, 0.45);
      border-color: #39ff14;
      color: #39ff14;
      box-shadow: 0 0 22px #39ff14;
    }
  </style>
</head>

    // --- ESSENTIAL HELPER FUNCTIONS (Declared early) ---
    let audioCtx = null;
    let goodyUtterance = null;
    
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function playTone(freq, type, duration, gainVal = 0.05) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function updatePlushieNameBadge(pawnGroup, displayName, tagColorHex = '#00d2d3') {
      if (!pawnGroup || !pawnGroup.userData || !pawnGroup.userData.badgeCanvas) return;
      const canvas = pawnGroup.userData.badgeCanvas;
      const ctx = canvas.getContext('2d');
      const w = canvas.width; const h = canvas.height;

      ctx.clearRect(0, 0, w, h);
      const r = 24;
      ctx.fillStyle = '#0a0314'; ctx.strokeStyle = tagColorHex; ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(r, 4); ctx.lineTo(w - r, 4); ctx.quadraticCurveTo(w - 4, 4, w - 4, r);
      ctx.lineTo(w - 4, h - r); ctx.quadraticCurveTo(w - 4, h - 4, w - r, h - 4);
      ctx.lineTo(r, h - 4); ctx.quadraticCurveTo(4, h - 4, 4, h - r);
      ctx.lineTo(4, r); ctx.quadraticCurveTo(4, 4, r, 4);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const cleanName = (displayName || "PLAYER").toUpperCase().trim();
      let fontSize = 48;
      if (cleanName.length > 8) fontSize = 36;
      if (cleanName.length > 12) fontSize = 28;
     
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.fillText(cleanName, w / 2, h / 2 + 2);

      if (pawnGroup.userData.badgeTexture) {
        pawnGroup.userData.badgeTexture.needsUpdate = true;
      }
    }

    function updatePawnNameBadge(pawnGroup, displayName) {
      updatePlushieNameBadge(pawnGroup, displayName, '#00d2d3');
    }

    function createCutePlushie(color, initialName = "") {
      const pGroup = new THREE.Group();
      const pMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.95 });
      const pBody = new THREE.Mesh(new THREE.SphereGeometry(0.28, 14, 14), pMat); pBody.position.y = 0.28; pGroup.add(pBody);
      const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), pMat); pHead.position.y = 0.58; pGroup.add(pHead);
      const ear1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), pMat); ear1.position.set(-0.14, 0.74, 0);
      const ear2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), pMat); ear2.position.set(0.14, 0.74, 0); pGroup.add(ear1, ear2);
      const blushMat = new THREE.MeshBasicMaterial({ color: 0xff69b4 });
      const blush1 = new THREE.Mesh(new THREE.SphereGeometry(0.038, 8, 8), blushMat); blush1.position.set(-0.11, 0.54, 0.17);
      const blush2 = new THREE.Mesh(new THREE.SphereGeometry(0.038, 8, 8), blushMat); blush2.position.set(0.11, 0.54, 0.17); pGroup.add(blush1, blush2);
      const eyeBlackMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), eyeBlackMat); eyeL.position.set(-0.07, 0.60, 0.19);
      const shineL = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeWhiteMat); shineL.position.set(-0.08, 0.612, 0.21); pGroup.add(eyeL, shineL);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), eyeBlackMat); eyeR.position.set(0.07, 0.60, 0.19);
      const shineR = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeWhiteMat); shineR.position.set(0.06, 0.612, 0.21); pGroup.add(eyeR, shineR);
      const snout = new THREE.Mesh(new THREE.SphereGeometry(0.042, 8, 8), new THREE.MeshStandardMaterial({ color: 0xff8fab, roughness: 0.6 }));
      snout.scale.set(1.2, 0.8, 1); snout.position.set(0, 0.56, 0.21); pGroup.add(snout);
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.007, 4, 8, Math.PI), new THREE.MeshBasicMaterial({ color: 0x222222 }));
      mouth.position.set(0, 0.525, 0.21); mouth.rotation.x = Math.PI * 0.1; pGroup.add(mouth);

      let badgeMesh = null;
      let bCanvas = null;
      let bTex = null;

      if (initialName) {
        bCanvas = document.createElement('canvas');
        bCanvas.width = 256; bCanvas.height = 96;
        bTex = new THREE.CanvasTexture(bCanvas);
        const badgeMat = new THREE.MeshBasicMaterial({
          map: bTex, transparent: true, side: THREE.DoubleSide, depthWrite: false
        });
        badgeMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.185), badgeMat);
        badgeMesh.position.set(0, 0.95, 0);
        updatePlushieNameBadge(pGroup, initialName);
      }
     
      pGroup.userData = {
        badgeCanvas: bCanvas, badgeTexture: bTex, badgeMesh: badgeMesh
      };
      return pGroup;
    }

    // --- THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040208);
    scene.fog = new THREE.FogExp2(0x040208, 0.015);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 5.8, -5.0);

    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const miniDiorama = new THREE.Group(); miniDiorama.position.set(0, 3.95, -9);

    // Canvas & Screen Textures initialized early
    const studioScreenCanvas = document.createElement('canvas'); studioScreenCanvas.width = 512; studioScreenCanvas.height = 256;
    const sScreenCtx = studioScreenCanvas.getContext('2d');
    const studioScreenTex = new THREE.CanvasTexture(studioScreenCanvas);
    const studioBackScreenMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.8), new THREE.MeshBasicMaterial({ map: studioScreenTex }));
    studioBackScreenMesh.position.set(0, 3.4, -4.5); miniDiorama.add(studioBackScreenMesh);

    const qBoardCanvas = document.createElement('canvas');
    qBoardCanvas.width = 512; qBoardCanvas.height = 384;
    const qBoardCtx = qBoardCanvas.getContext('2d');
    const qBoardTex = new THREE.CanvasTexture(qBoardCanvas);
    const qBoardMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(3.6, 2.7),
      new THREE.MeshBasicMaterial({ map: qBoardTex })
    );
    qBoardMesh.position.set(-4.8, 3.4, -3.2);
    qBoardMesh.rotation.y = 0.8;
    miniDiorama.add(qBoardMesh);

    const screenClickMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(3.6, 2.7),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 })
    );
    screenClickMesh.position.copy(qBoardMesh.position);
    screenClickMesh.rotation.copy(qBoardMesh.rotation);
    screenClickMesh.userData = { clickableType: 'QUESTION_BOARD' };
    miniDiorama.add(screenClickMesh);

    scene.add(miniDiorama);

    // --- GAME ENGINE & SOCKET FUNCTIONS ---
    function initSocketConnection() {
      try {
        socket = io();

        socket.on('ball_host_assignment', (data) => {
          isBallPhysicsHost = data.isHost;
        });

        socket.on('assign_team', (data) => {
          assignedTeam = data.team;
          teamColorHex = data.teamColor;
          plushieColorHex = assignedTeam === 'RED' ? 0xff3838 : 0x00f0ff;
          if (data.name) {
            localMyGuestName = data.name;
          }

          if (localPlushie) {
            localPlushie.userData.team = assignedTeam;
            localPlushie.traverse(child => {
              if (child.isMesh && child.material && child !== localPlushie.userData.badgeMesh) {
                child.material.color.setHex(plushieColorHex);
              }
            });
            updatePlushieNameBadge(localPlushie, localMyGuestName, teamColorHex);
          }
        });

        socket.on('update_player', (data) => {
          let pMesh = remotePlayers.get(data.id);
          const remoteTeam = data.team || 'BLUE';
          const remoteTeamColor = data.teamColor || (remoteTeam === 'RED' ? '#ff3838' : '#00f0ff');
          const remotePlushieHex = remoteTeam === 'RED' ? 0xff3838 : 0x00f0ff;
          const playerName = data.name || "Guest";

          if (!pMesh) {
            pMesh = createCutePlushie(remotePlushieHex, playerName);
            pMesh.userData.team = remoteTeam;
            updatePlushieNameBadge(pMesh, playerName, remoteTeamColor);
            miniDiorama.add(pMesh);
            remotePlayers.set(data.id, pMesh);
          } else {
            pMesh.userData.team = remoteTeam;
            pMesh.traverse(child => {
              if (child.isMesh && child.material && child !== localPlushie.userData.badgeMesh) {
                child.material.color.setHex(remotePlushieHex);
              }
            });
          }
         
          pMesh.position.set(data.x, data.y, data.z);
          pMesh.rotation.y = data.yaw + Math.PI;
         
          if (data.name) {
            updatePlushieNameBadge(pMesh, data.name, remoteTeamColor);
          }
         
          setPlushieVisualMode(pMesh, data.isSolid ? 'opaque' : 'transparent');
        });

        socket.on('remove_player', (id) => {
          const pMesh = remotePlayers.get(id);
          if (pMesh) {
            if (pMesh.userData && pMesh.userData.badgeMesh) {
              miniDiorama.remove(pMesh.userData.badgeMesh);
            }
            miniDiorama.remove(pMesh);
            remotePlayers.delete(id);
          }
        });

        socket.on('ball_sync', (bData) => {
          if (ballMesh) {
            remoteBallTarget.set(bData.x, bData.y, bData.z);
            if (bData.vx !== undefined) {
              ballVelocity.set(bData.vx, bData.vy, bData.vz);
            }
            hasRemoteBallUpdate = true;
          }
        });

        socket.on('score_sync', (sData) => {
          blueScore = sData.blue;
          redScore = sData.red;
          renderPitchScoreboard(blueScore, redScore);
        });
      } catch (e) {
        console.warn("Socket.io offline or unavailable:", e);
      }
    }

    function triggerImmediateModePrompt() {
      if (studioPower) return;
      gameState = "MODE_PROMPT";
      countdownPill.innerHTML = `STATUS: <span style="color:#ffda66;">STEP ON PODIUM 1 TO START PRIORITY SEQUENCE</span>`;
      renderStageQuestionBoard();
    }

    function resetStudioToPrompt() {
      if (studioPower) return;
      if (podium1PriorityTimer) clearTimeout(podium1PriorityTimer);
      if (player2GraceTimer) clearTimeout(player2GraceTimer);
      podium1PriorityTimer = null;
      player2GraceTimer = null;
      isPodiumPriorityActive = false;
      isPlayer2GraceActive = false;
      p1OffCount = 0;
      p1LockoutUntil = 0;
      gameState = "MODE_PROMPT";
      countdownPill.innerHTML = `STATUS: <span style="color:#ffda66;">RESET TO START. STEP ON PODIUM 1!</span>`;
      renderStageQuestionBoard();
    }

    function startPodium1PrioritySequence() {
      if (studioPower || isPodiumPriorityActive) return;
      
      const now = performance.now();
      if (now < p1LockoutUntil) {
        const secsLeft = Math.ceil((p1LockoutUntil - now) / 1000);
        countdownPill.innerHTML = `STATUS: <span style="color:#ff7675;">ANTI-SPAM LOCKOUT: WAIT ${secsLeft}S</span>`;
        speakGoody(`Please stop jumping on and off the podium repeatedly! You are locked out for another ${secsLeft} seconds.`);
        return;
      }

      isPodiumPriorityActive = true;
      countdownPill.innerHTML = `STATUS: <span style="color:#ffda66;">PODIUM 1 SECURED! 10S GRACE WINDOW FOR PLAYER 2...</span>`;
      
      speakGoody("Player 1 has stepped onto Podium 1! Opening a 10-second priority window for Player 2 to join Podium 2!", () => {
        if (!isLocalOnPodium1 && !studioPower) {
          isPodiumPriorityActive = false;
          return;
        }
      });

      if (player2GraceTimer) clearTimeout(player2GraceTimer);
      isPlayer2GraceActive = true;

      player2GraceTimer = setTimeout(() => {
        isPlayer2GraceActive = false;
        if (isLocalOnPodium1 && !isLocalOnPodium2 && !studioPower) {
          countdownPill.innerHTML = `STATUS: <span style="color:#00f0ff;">NO PLAYER 2. CHOOSE MODE ON SCREEN!</span>`;
          speakGoody("No Player 2 joined in time. Player 1, please select your game mode on the main studio screen!");
          renderStageQuestionBoard();
        }
      }, 10000);
    }

    function chooseHostGameMode(modeType) {
      if (studioPower) return;
      if (modeType === "SOLO") {
        isSoloMode = true;
        isVsGoodyMode = false;
        soloPlayerId = "goody-contestant-1";
        const soloName = contestantNames[soloPlayerId];
        activePlayer = soloPlayerId;
        p2RollVal = null;
        isDiceRollingP2 = false;
       
        pawn2.visible = false;
        pawn1.visible = true;
        if (window.p2PodiumGroup) window.p2PodiumGroup.visible = false;

        bootStudio();
        const speech = `Welcome to The Goody Tonight Show! We are starting in 1-Player Solo mode with ${soloName}! Let's begin our 20-minute race to tile 32!`;
        speakGoody(speech, () => {
          startTurnCleanly(soloPlayerId);
        });
      } else if (modeType === "GOODY") {
        isSoloMode = false;
        isVsGoodyMode = true;
        goodyPlayerSlot = "goody-contestant-2";
        contestantNames["goody-contestant-2"] = "Goody";
        pawn1.visible = true;
        pawn2.visible = true;
        if (window.p2PodiumGroup) window.p2PodiumGroup.visible = true;
        updatePawnNameBadge(pawn2, "Goody");

        bootStudio();
        const speech = `Welcome to The Goody Tonight Show! We are starting in 1-Player versus Goody mode! I am taking control of Podium 2. Let's roll our dice and start the show!`;
        speakGoody(speech, () => {
          beginTenSecondDiceDuel();
        });
      } else if (modeType === "TWOPLAYER") {
        isSoloMode = false;
        isVsGoodyMode = false;
        pawn1.visible = true;
        pawn2.visible = true;
        if (window.p2PodiumGroup) window.p2PodiumGroup.visible = true;
        bootStudio();
        const speech = `Welcome to The Goody Tonight Show! We are running full 2-Player mode with ${contestantNames["goody-contestant-1"]} and ${contestantNames["goody-contestant-2"]}! Let's determine who goes first with our opening dice roll!`;
        speakGoody(speech, () => {
          beginTenSecondDiceDuel();
        });
      }
    }

    function broadcastBoardState() {
      connectedDataConns.forEach(c => {
        if (c.open) {
          c.send({
            type: "SYNC_BOARD_STATE",
            studioPower: studioPower,
            p1Name: contestantNames["goody-contestant-1"] || "Player 1",
            p2Name: contestantNames["goody-contestant-2"] || "Player 2",
            p1Index: p1Index,
            p2Index: p2Index
          });
        }
      });
    }

    function handleMidGameDropout(contestantId) {
      if (gameState === "GAME_OVER" || gameState === "INTERMISSION") return;

      if (goodyUtterance) {

    function triggerOfferChoiceMode() {
      if (gameState !== "INTERMISSION") return;

      gameState = "CONTESTANT_CHOOSING";

      const remainingId = isP1Connected ? "goody-contestant-1" : "goody-contestant-2";

      renderStageQuestionBoard();

    function speakGoody(text, onComplete) {
      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "HOST_SPEAK", text: text });
      });

      if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
      }
     
      window.speechSynthesis.cancel();
      goodyUtterance = new SpeechSynthesisUtterance(text);
      goodyUtterance.rate = 0.95;
      goodyUtterance.pitch = 1.25;

      goodyUtterance.onstart = () => { isGoodySpeaking = true; };
      goodyUtterance.onboundary = (e) => {
        isGoodySpeaking = true;
        const chunk = text.substring(e.charIndex, e.charIndex + 65);
        playTone(460 + Math.random() * 200, 'triangle', 0.05, 0.02);
      };

      goodyUtterance.onend = () => {
        isGoodySpeaking = false;
        if (onComplete) onComplete();
      };

      goodyUtterance.onerror = () => {
        isGoodySpeaking = false;
        if (onComplete) onComplete();
      };

      window.speechSynthesis.speak(goodyUtterance);
    }

    function beginTenSecondDiceDuel() {
      gameState = "OPENING_DUEL";

      isDiceRollingP1 = true;
      isDiceRollingP2 = true;
      isPawnMoving = false;

      broadcastMicState("goody-contestant-1", false);
      broadcastMicState("goody-contestant-2", false);

      startDiceCountdown(() => {
        if (gameState === "OPENING_DUEL") {
          if (p1RollVal === null) p1RollVal = Math.floor(Math.random() * 6) + 1;

    function handlePlayerRoll(contestant, name, roll) {
      if (gameState === "OPENING_DUEL") {
        if (contestant === "goody-contestant-2") {
          if (p2RollVal !== null) return;
          p2RollVal = roll; isDiceRollingP2 = false;
        } else {
          if (p1RollVal !== null) return;
          p1RollVal = roll; isDiceRollingP1 = false;
        }
        playTone(587, 'sine', 0.15, 0.08);
        renderStageQuestionBoard();
        renderBackstageScreens();

        if ((isSoloMode && p1RollVal !== null) || (p1RollVal !== null && p2RollVal !== null)) {
          stopDiceCountdown();
          setTimeout(finalizeDiceDuel, 1200);
        }
      } else if (gameState === "IN_PLAY") {
        if (contestant !== activePlayer || hasPlayerRolledThisTurn || isPawnMoving) return;
        stopDiceCountdown();
        hasPlayerRolledThisTurn = true;
        isPawnMoving = true;
       
        if (contestant === "goody-contestant-2") {
          p2RollVal = roll; isDiceRollingP2 = false;
        } else {
          p1RollVal = roll; isDiceRollingP1 = false;
        }
        playTone(587, 'sine', 0.15, 0.08);
        renderStageQuestionBoard();
        renderBackstageScreens();

        setTimeout(() => {
          const speech = contestant === goodyPlayerSlot
            ? `I rolled a ${roll}! Moving forwards ${roll} spaces!`
            : `${name} rolled a ${roll}! Moving ${roll} spaces.`;

          speakGoody(speech, () => {
            advanceTurnPlayer(contestant, roll);
          });
        }, 1200);
      }
    }

    function startTwentyMinuteMatchTimer() {
      if (matchTimerInterval) clearInterval(matchTimerInterval);
      matchTimerInterval = setInterval(() => {
        if (gameState !== "IN_PLAY") return;
        matchTimerSeconds--;

        const mins = Math.max(0, Math.floor(matchTimerSeconds / 60)).toString().padStart(2, '0');
        const secs = Math.max(0, (matchTimerSeconds % 60)).toString().padStart(2, '0');
        const timeStr = `${mins}:${secs}`;
       
        gameClockValEl.textContent = timeStr;
        renderWallClockTexture(timeStr);

        if (matchTimerSeconds <= 0) {

    function finalizeDiceDuel() {
      if (p1RollVal === null) p1RollVal = Math.floor(Math.random() * 6) + 1;
      if (!isSoloMode && p2RollVal === null) p2RollVal = Math.floor(Math.random() * 6) + 1;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;

      if (!isSoloMode && p1RollVal === p2RollVal) {
        const tieVal = p1RollVal;
        const speech = `Both contestants rolled a ${tieVal}! It's a dead heat tie! We must re-roll to decide who goes first! You have 10 seconds to roll your dice!`;
        speakGoody(speech, () => {
          p1RollVal = null;
          p2RollVal = null;

        return;

      const winnerNum = isSoloMode ? 1 : (p1RollVal > p2RollVal ? 1 : 2);
      activePlayer = winnerNum === 1 ? "goody-contestant-1" : "goody-contestant-2";

      gameState = "IN_PLAY";

      speakGoody(`${pName} wins the opening roll with a ${finalWinningRoll}! The 20-minute show clock has begun! Moving ${finalWinningRoll} spaces.`, () => {
        advanceTurnPlayer(activePlayer, finalWinningRoll);

    function animatePawnHop(pawn, fromIdx, toIdx, offsetX, onComplete, hopDurationMs = 280) {
      if (fromIdx === toIdx) {
        if (onComplete) onComplete();
        return;
      }

      const stepDirection = toIdx > fromIdx ? 1 : -1;
      let currentHopIdx = fromIdx;

      function hopNextStep() {
        if (gameState === "INTERMISSION") {
          isPawnMoving = false;
          return;
        }

        if (currentHopIdx === toIdx) {
          if (onComplete) onComplete();
          return;
        }

        const nextHopIdx = currentHopIdx + stepDirection;
        const startPos = {
          x: boardTileCoords[currentHopIdx].x + offsetX,
          y: 0.52,
          z: boardTileCoords[currentHopIdx].z
        };
        const endPos = {
          x: boardTileCoords[nextHopIdx].x + offsetX,
          y: 0.52,
          z: boardTileCoords[nextHopIdx].z
        };

        const hopStartTime = performance.now();
        playTone(320 + Math.random() * 80, 'sine', 0.06, 0.04);

        function stepFrame(now) {
          if (gameState === "INTERMISSION") {
            isPawnMoving = false;
            return;
          }

          const elapsed = now - hopStartTime;
          const progress = Math.min(1.0, elapsed / hopDurationMs);
          const jumpArc = 4.0 * 0.35 * progress * (1.0 - progress);

          pawn.position.x = startPos.x + (endPos.x - startPos.x) * progress;
          pawn.position.y = 0.52 + jumpArc;
          pawn.position.z = startPos.z + (endPos.z - startPos.z) * progress;

          if (progress < 1.0) {
            requestAnimationFrame(stepFrame);
          } else {
            pawn.position.set(endPos.x, 0.52, endPos.z);
            playTone(220, 'triangle', 0.05, 0.03);
            currentHopIdx = nextHopIdx;
            setTimeout(hopNextStep, 50);
          }
        }
        requestAnimationFrame(stepFrame);
      }
      hopNextStep();
    }

    function advanceTurnPlayer(playerSlot, roll) {
      const isP1 = playerSlot === "goody-contestant-1";
      const oldIdx = isP1 ? p1Index : p2Index;
      const targetIdx = Math.min(boardTileCoords.length - 1, oldIdx + roll);
      const targetPawn = isP1 ? pawn1 : pawn2;
      const xOffset = isP1 ? -0.08 : 0.08;

      if (isP1) p1Index = targetIdx;
      else p2Index = targetIdx;

      animatePawnHop(targetPawn, oldIdx, targetIdx, xOffset, () => {
        isPawnMoving = false;
        broadcastBoardState();

        if (p1Index >= boardTileCoords.length - 1 || p2Index >= boardTileCoords.length - 1) {
          const winName = isP1 ? contestantNames["goody-contestant-1"] : contestantNames["goody-contestant-2"];
          const loseName = isP1 ? contestantNames["goody-contestant-2"] : contestantNames["goody-contestant-1"];
          triggerFinishLineVictory(winName, loseName);
          return;
        }

        const currentTileIdx = isP1 ? p1Index : p2Index;
        const landedCountry = boardTileCoords[currentTileIdx].country;
        const qPool = COUNTRY_QUESTIONS[landedCountry] || COUNTRY_QUESTIONS["UK"];
        const rawQ = qPool[Math.floor(Math.random() * qPool.length)];
       
        activeQuestion = {
          country: landedCountry,
          text: rawQ.q,
          q: rawQ.q,
          options: rawQ.options,
          ans: rawQ.ans,
          recap: rawQ.recap
        };
        activeRecap = null;
        stageSelectedOption = null;
        stageOptionStatus = null;

        stopDiceCountdown();
        if (questionInterval) clearInterval(questionInterval);
        isQuestionTimerActive = false;
        questionTimer = 0;

        const activeName = contestantNames[activePlayer];
        renderStageQuestionBoard();

        const speech = activePlayer === goodyPlayerSlot
          ? `I landed on ${landedCountry}! Here is my question: ${activeQuestion.q}... Let me process this in my circuits!`
          : `${activeName} landed on ${landedCountry}! Here is your question: ${activeQuestion.q}... You have 30 seconds to lock in!`;

        speakGoody(speech, () => {
          if (gameState === "INTERMISSION") return;

          if (activePlayer === goodyPlayerSlot) {
            executeGoodyAnswer();
          } else {
            broadcastMicState(activePlayer, true, "🎙️ Thinking out loud? Your mic is LIVE!");
            startQuestionCountdown();
          }
        });
      });
    }

    function startQuestionCountdown() {
      questionTimer = 30;
      isQuestionTimerActive = true;
      renderStageQuestionBoard();

      if (questionInterval) clearInterval(questionInterval);
      questionInterval = setInterval(() => {
        if (gameState === "INTERMISSION") {
          clearInterval(questionInterval);
          isQuestionTimerActive = false;
          return;
        }
        questionTimer--;
        renderStageQuestionBoard();
        if (questionTimer <= 0) {
          clearInterval(questionInterval);
          isQuestionTimerActive = false;
          broadcastMicState(activePlayer, false);
          handleQuestionTimeout(activePlayer);
        }
      }, 1000);
    }

    function evaluateAnswer(contestant, chosen) {
      stopDiceCountdown();
      if (questionInterval) clearInterval(questionInterval);
      isQuestionTimerActive = false;
      questionTimer = 0;
      broadcastMicState(contestant, false);
      const isCorrect = chosen === activeQuestion.ans;

      if (contestant !== goodyPlayerSlot) {
        playerStats.asked++;
        if (isCorrect) playerStats.correct++;
      }

      stageOptionStatus = isCorrect ? 'correct' : 'wrong';
      renderStageQuestionBoard();

      activeRecap = { country: activeQuestion.country, text: activeQuestion.recap, isCorrect };
      activeQuestion = null;
      renderStageQuestionBoard();

      const isGoody = contestant === goodyPlayerSlot;
      if (isCorrect) {
        const speech = isGoody
          ? `My circuits calculated correctly! That is correct! Here is what we learned: ${activeRecap.text}`
          : `Well done, that's correct! Here is what we learned: ${activeRecap.text}`;

        speakGoody(speech, () => {
          transitionToRulesAndNextTurn();
        });
      } else {
        const speech = isGoody
          ? `Oh no! A system malfunction in my memory bank! I got it wrong! I must go back to the start! Here is what we learned: ${activeRecap.text}`
          : `Unlucky, that's incorrect. You must go back to the start! Here is what we learned: ${activeRecap.text}`;

        speakGoody(speech, () => {
          resetPlayerToStart(contestant, () => {
            transitionToRulesAndNextTurn();
          });
        });
      }
    }

    function handleQuestionTimeout(contestant) {
      stopDiceCountdown();
      if (questionInterval) clearInterval(questionInterval);
      isQuestionTimerActive = false;
      questionTimer = 0;
      broadcastMicState(contestant, false);

      if (contestant !== goodyPlayerSlot) {
        playerStats.asked++;
      }

      stageOptionStatus = 'wrong';
      renderStageQuestionBoard();

      activeRecap = { country: activeQuestion.country, text: activeQuestion.recap, isCorrect: false };
      activeQuestion = null;
      renderStageQuestionBoard();

      speakGoody(`I'm sorry, you ran out of time! You must go back to the start! Here is what we learned: ${activeRecap.text}`, () => {
        resetPlayerToStart(contestant, () => {
          transitionToRulesAndNextTurn();
        });
      });
    }

    function transitionToRulesAndNextTurn() {
      stopDiceCountdown();
      activeRecap = null;
      activeQuestion = null;
      isQuestionTimerActive = false;
      questionTimer = 0;
      renderStageQuestionBoard();

      if (isTimeExpired) {
        setTimeout(() => evaluateFinalShowdown(), 2000);
        return;
      }

      setTimeout(() => {
        nextTurn();
      }, 1000);
    }

    function resetPlayerToStart(contestant, onComplete) {
      const isP1 = contestant === "goody-contestant-1";
      const startFromIdx = isP1 ? p1Index : p2Index;
      const pawnToMove = isP1 ? pawn1 : pawn2;
      const xOffset = isP1 ? -0.08 : 0.08;

      if (isP1) p1Index = 0;
      else p2Index = 0;

      animatePawnHop(pawnToMove, startFromIdx, 0, xOffset, () => {
        broadcastBoardState();
        if (onComplete) onComplete();
      }, 110);
    }

    function nextTurn() {
      if (gameState !== "IN_PLAY") return;
      stopDiceCountdown();

      if (isSoloMode) {
        activePlayer = soloPlayerId;
      } else {
        activePlayer = activePlayer === "goody-contestant-1" ? "goody-contestant-2" : "goody-contestant-1";

      activeQuestion = null;
      activeRecap = null;
      stageSelectedOption = null;
      stageOptionStatus = null;
      p1RollVal = null;
      p2RollVal = null;
      hasPlayerRolledThisTurn = false;
      isPawnMoving = false;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;

      if (questionInterval) clearInterval(questionInterval);
      isQuestionTimerActive = false;

    function evaluateFinalShowdown() {

    function createDownFacingSpotlight(colorHex, x, y, z) {
      const fixGroup = new THREE.Group(); fixGroup.position.set(x, y, z);
      const headPivot = new THREE.Group();
      const can = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.55, 16), new THREE.MeshStandardMaterial({ color: 0x15151e }));
      can.rotation.x = Math.PI / 2; headPivot.add(can);
      const lens = new THREE.Mesh(new THREE.CircleGeometry(0.19, 16), new THREE.MeshBasicMaterial({ color: 0x050505 }));
      lens.position.set(0, 0, 0.28); headPivot.add(lens);
      const spot = new THREE.SpotLight(colorHex, 0, 18, Math.PI / 3.4, 0.35);
      spot.position.set(0, 0, 0.28); headPivot.add(spot);
      const targetObj = new THREE.Object3D(); targetObj.position.set(x * 0.4, -4.5, -0.8);
      scene.add(targetObj); spot.target = targetObj;
      headPivot.rotation.x = Math.PI * 0.35;
      fixGroup.add(headPivot); trussGroup.add(fixGroup);
      return { spot, lens, color: colorHex, target: targetObj };
    }

    const studioWallMat = new THREE.MeshStandardMaterial({ color: 0x1f113a, roughness: 0.3, metalness: 0.4, side: THREE.DoubleSide });

    const westWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 5.0, 14.0), studioWallMat);
    westWall.position.set(-7.0, 2.5, 0.0);
    enclosingWallsGroup.add(westWall);

    const northWall = new THREE.Mesh(new THREE.BoxGeometry(17.0, 5.0, 0.6), studioWallMat);
    northWall.position.set(1.5, 2.5, -7.0);
    enclosingWallsGroup.add(northWall);

    const southWall = new THREE.Mesh(new THREE.BoxGeometry(17.0, 5.0, 0.6), studioWallMat);
    southWall.position.set(1.5, 2.5, 7.0);
    enclosingWallsGroup.add(southWall);
    miniDiorama.add(enclosingWallsGroup);

    // Rugby / Foosball Pitch setup
    const foosballGroup = new THREE.Group();
    foosballGroup.position.set(34.0, 0.44, 0.0);
    const arenaLength = 36.0;
    const arenaWidth = 24.0;

    const turfMesh = new THREE.Mesh(
      new THREE.BoxGeometry(arenaLength, 0.06, arenaWidth),
      new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.8 })
    );
    turfMesh.position.y = 0.03;
    foosballGroup.add(turfMesh);

    const pitchLinesMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.08, arenaWidth - 0.2), pitchLinesMat);
    centerLine.rotation.x = -Math.PI / 2;
    centerLine.position.y = 0.065;
    foosballGroup.add(centerLine);

    const centerCircle = new THREE.Mesh(new THREE.RingGeometry(2.0, 2.1, 32), pitchLinesMat);
    centerCircle.rotation.x = -Math.PI / 2;
    centerCircle.position.y = 0.066;
    foosballGroup.add(centerCircle);

    const arenaWallMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x004466, metalness: 0.8, roughness: 0.2 });
    const halfLen = arenaLength / 2;
    const halfWid = arenaWidth / 2;

    const wallNorth = new THREE.Mesh(new THREE.BoxGeometry(arenaLength + 0.4, 0.6, 0.3), arenaWallMat);
    wallNorth.position.set(0, 0.3, halfWid + 0.15);
    foosballGroup.add(wallNorth);

    const wallSouth = new THREE.Mesh(new THREE.BoxGeometry(arenaLength + 0.4, 0.6, 0.3), arenaWallMat);
    wallSouth.position.set(0, 0.3, -(halfWid + 0.15));
    foosballGroup.add(wallSouth);

    function createVibrantGoal(isLeft) {
      const goalGroup = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: isLeft ? 0x00f0ff : 0xff3838, metalness: 0.8, roughness: 0.2 });
      const goalSpan = 5.0;
      
      const post1 = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 3.0, 16), postMat);
      post1.position.set(0, 1.5, goalSpan / 2);
      goalGroup.add(post1);

      const post2 = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 3.0, 16), postMat);
      post2.position.set(0, 1.5, -goalSpan / 2);
      goalGroup.add(post2);

      const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, goalSpan, 16), postMat);
      crossbar.rotation.z = Math.PI / 2;
      crossbar.position.set(0, 3.0, 0);
      goalGroup.add(crossbar);

      const netMat = new THREE.MeshBasicMaterial({ color: isLeft ? 0x00ffff : 0xff79b0, wireframe: true, transparent: true, opacity: 0.7 });
      const netBox = new THREE.Mesh(new THREE.BoxGeometry(1.6, 3.0, goalSpan), netMat);
      netBox.position.set(-0.8, 1.5, 0);
      goalGroup.add(netBox);

      goalGroup.position.set(isLeft ? -halfLen : halfLen, 0, 0);
      if (!isLeft) goalGroup.rotation.y = Math.PI;
      return goalGroup;
    }

    foosballGroup.add(createVibrantGoal(true));
    foosballGroup.add(createVibrantGoal(false));
    miniDiorama.add(foosballGroup);

    const ballMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.38, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xffda66, emissive: 0x443300, roughness: 0.3, metalness: 0.5 })
    );
    ballMesh.position.set(34.0, 0.82, 0.0);
    miniDiorama.add(ballMesh);

    let ballVelocity = new THREE.Vector3(0, 0, 0);
    const remoteBallTarget = new THREE.Vector3(34.0, 0.82, 0.0);
    let hasRemoteBallUpdate = false;

    // Podiums for P1 & P2
    const p1PodiumGroup = new THREE.Group();
    const p1PodiumBase = new THREE.Mesh(
      new THREE.CylinderGeometry(0.40, 0.48, 0.55, 20),
      new THREE.MeshStandardMaterial({ color: 0x1b0c30, metalness: 0.5, roughness: 0.3 })
    );
    p1PodiumBase.position.y = 0.275;
    p1PodiumGroup.add(p1PodiumBase);

    const p1PodiumRim = new THREE.Mesh(
      new THREE.CylinderGeometry(0.42, 0.42, 0.04, 20),
      new THREE.MeshStandardMaterial({ color: 0x00d2d3, metalness: 0.9, roughness: 0.2 })
    );
    p1PodiumRim.position.y = 0.56;
    p1PodiumGroup.add(p1PodiumRim);
    p1PodiumGroup.position.set(-1.6, 0.44, -2.2);
    miniDiorama.add(p1PodiumGroup);
    window.p1PodiumGroup = p1PodiumGroup;

    const p2PodiumGroup = new THREE.Group();
    const p2PodiumBase = new THREE.Mesh(
      new THREE.CylinderGeometry(0.40, 0.48, 0.55, 20),
      new THREE.MeshStandardMaterial({ color: 0x1b0c30, metalness: 0.5, roughness: 0.3 })
    );
    p2PodiumBase.position.y = 0.275;
    p2PodiumGroup.add(p2PodiumBase);

    const p2PodiumRim = new THREE.Mesh(
      new THREE.CylinderGeometry(0.42, 0.42, 0.04, 20),
      new THREE.MeshStandardMaterial({ color: 0xff3838, metalness: 0.9, roughness: 0.2 })
    );
    p2PodiumRim.position.y = 0.56;
    p2PodiumGroup.add(p2PodiumRim);
    p2PodiumGroup.position.set(1.6, 0.44, -2.2);
    miniDiorama.add(p2PodiumGroup);
    window.p2PodiumGroup = p2PodiumGroup;

    // Board tiles & Country Questions setup
    const COUNTRIES = [
      "France", "Netherlands", "Canada", "Sweden", "Italy", "Denmark",
      "Brazil", "Australia", "Spain", "Germany", "UK", "Nigeria",
      "United States", "Belgium"
    ];

    function createCountryFlagTexture(countryName) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d'); const w = 256; const h = 256;
      ctx.fillStyle = '#1e1035'; ctx.fillRect(0, 0, w, h);
      ctx.save(); ctx.beginPath(); ctx.arc(128, 128, 124, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = '#22143b'; ctx.fillRect(0, 0, w, h);
      ctx.restore();
      const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true; return tex;
    }

    const flagTextures = COUNTRIES.map(cName => createCountryFlagTexture(cName));
    const boardTileCoords = [];
    const spiralCenterZ = 1.8;
    const totalTiles = 32;

    for (let i = 0; i < totalTiles; i++) {
      const angle = i * 0.48;
      const radius = 0.7 + (i * 0.135);
      const x = Math.cos(angle) * radius;
      const z = spiralCenterZ + (Math.sin(angle) * (radius * 0.88));
      const countryName = COUNTRIES[i % COUNTRIES.length];

      boardTileCoords.push({ x, z, country: countryName });

      const sideMat = new THREE.MeshStandardMaterial({ color: 0x241e33, metalness: 0.6, roughness: 0.3 });
      const topMat = new THREE.MeshBasicMaterial({ map: flagTextures[i % flagTextures.length] });
      const botMat = new THREE.MeshBasicMaterial({ color: 0x110d1c });

      const tile = new THREE.Mesh(
        new THREE.CylinderGeometry(0.28, 0.30, 0.08, 24),
        [sideMat, topMat, botMat]
      );
      tile.position.set(x, 0.48, z);
      miniDiorama.add(tile);
    }

    const COUNTRY_QUESTIONS = {
      "UK": [
        { q: "In the UK, before the 2019 stake reduction, what was the maximum stake per spin on a Fixed-Odds-Betting-Terminal?", options: ["£2", "£50", "£100", "£500"], ans: "£100", recap: "In April 2019, the UK reduced the maximum FOBT stake per spin from £100 down to £2 to combat severe harms." }
      ],
      "Canada": [
        { q: "In Ontario, what is the name of the land-based self-exclusion scheme that covers Casinos?", options: ["SENSE", "MyPlay Break", "Bacta", "BetGuard"], ans: "MyPlay Break", recap: "MyPlay Break is Ontario's official casino self-exclusion initiative managed by OLG." }
      ]
    };

    function createPlayerPawn(colorHex, initialName) {
      const pawn = new THREE.Group();
      const baseMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.6, roughness: 0.25 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.10, 0.04, 16), baseMat);
      base.position.y = 0.02; pawn.add(base);
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.16, 16), baseMat);
      body.position.y = 0.12; pawn.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), baseMat);
      head.position.y = 0.22; pawn.add(head);

      const bCanvas = document.createElement('canvas');
      bCanvas.width = 256; bCanvas.height = 96;
      const bTex = new THREE.CanvasTexture(bCanvas);

      const badgeMat = new THREE.MeshBasicMaterial({
        map: bTex, transparent: true, side: THREE.DoubleSide, depthWrite: false
      });
      const badgeMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.13), badgeMat);
      badgeMesh.position.set(0, 0.35, 0);
      pawn.add(badgeMesh);

      const hexStr = '#' + colorHex.toString(16).padStart(6, '0');
      pawn.userData = {
        badgeCanvas: bCanvas, badgeTexture: bTex, badgeMesh: badgeMesh, tagColor: hexStr
      };
      updatePawnNameBadge(pawn, initialName);
      return pawn;
    }

    let p1Index = 0;
    let p2Index = 0;
    const pawn1 = createPlayerPawn(0x00d2d3, contestantNames["goody-contestant-1"] || "Player 1");
    pawn1.position.set(boardTileCoords[0].x - 0.08, 0.52, boardTileCoords[0].z);
    pawn1.visible = false;
    miniDiorama.add(pawn1);

    const pawn2 = createPlayerPawn(0xff3838, contestantNames["goody-contestant-2"] || "Player 2");
    pawn2.position.set(boardTileCoords[0].x + 0.08, 0.52, boardTileCoords[0].z);
    pawn2.visible = false;
    miniDiorama.add(pawn2);

    let isLocalOnPodium1 = false;
    let isLocalOnPodium2 = false;

    function setPlushieVisualMode(group, mode) {
      if (!group) return;
      if (mode === 'invisible') {
        group.visible = false;
        return;
      }
      group.visible = true;
      const isOpaque = (mode === 'opaque');
      group.traverse(child => {
        if (child.isMesh && child.material && child !== group.userData.badgeMesh) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach(m => {
            if (isOpaque) {
              m.transparent = false;
              m.opacity = 1.0;
              m.depthWrite = true;
            } else {
              m.transparent = true;
              m.opacity = 0.45;
              m.depthWrite = false;
            }
            m.needsUpdate = true;
          });
        }
      });
    }

    let assignedTeam = 'BLUE';
    let teamColorHex = '#00f0ff';
    let plushieColorHex = 0x00f0ff;
    let localPlushie = createCutePlushie(plushieColorHex, localMyGuestName);
    localPlushie.userData.team = assignedTeam;
    updatePlushieNameBadge(localPlushie, localMyGuestName, teamColorHex);
   
    const plushiePosition = new THREE.Vector3(32.0, 0.44, 2.5);
    const plushieRotation = { yaw: 0 };
    const plushieVelocity = new THREE.Vector3(0, 0, 0);

    localPlushie.position.copy(plushiePosition);
    miniDiorama.add(localPlushie);
    setPlushieVisualMode(localPlushie, 'opaque');

    // Rendering boards and screens
    function renderStageQuestionBoard() {
      qBoardCtx.fillStyle = '#120726';
      qBoardCtx.fillRect(0, 0, 512, 384);
      qBoardCtx.strokeStyle = '#00f0ff';
      qBoardCtx.lineWidth = 6;
      qBoardCtx.strokeRect(3, 3, 506, 378);

      if (gameState === "MODE_PROMPT") {
        qBoardCtx.fillStyle = '#ffda66';
        qBoardCtx.font = 'bold 24px sans-serif';
        qBoardCtx.textAlign = 'center';
        qBoardCtx.fillText("CHOOSE GAME MODE", 256, 50);

        if (!isPodiumPriorityActive) {
          qBoardCtx.fillStyle = '#ff7675';
          qBoardCtx.font = 'bold 16px sans-serif';
          qBoardCtx.fillText("STEP ON PODIUM 1 WITH YOUR PLUSHIE TO START!", 256, 180);
        } else {
          qBoardCtx.fillStyle = '#ffffff';
          qBoardCtx.font = '15px sans-serif';
          qBoardCtx.fillText("SELECT START MODE (TAP OR PRESS 1-3):", 256, 105);
        }
      }
      qBoardTex.needsUpdate = true;
    }
    renderStageQuestionBoard();

    function renderBackstageScreens() {
      sScreenCtx.fillStyle = '#060210'; sScreenCtx.fillRect(0, 0, 512, 256);
      studioScreenTex.needsUpdate = true;
    }

    function renderWallClockTexture(str) {
      // Clock renderer helper
    }

    // Input Handlers & Animation loop
    const moveState = { forward: false, backward: false, turnLeft: false, turnRight: false };

    document.addEventListener('keydown', (e) => {
      if (!isHostAuthorized) return;
      if (e.code === 'KeyW') moveState.forward = true;
      if (e.code === 'KeyS') moveState.backward = true;
      if (e.code === 'KeyA') moveState.turnLeft = true;
      if (e.code === 'KeyD') moveState.turnRight = true;
    });

    document.addEventListener('keyup', (e) => {
      if (!isHostAuthorized) return;
      if (e.code === 'KeyW') moveState.forward = false;
      if (e.code === 'KeyS') moveState.backward = false;
      if (e.code === 'KeyA') moveState.turnLeft = false;
      if (e.code === 'KeyD') moveState.turnRight = false;
    });

    function broadcastMicState() {}
    function stopDiceCountdown() {}

    let prevTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.1);

      renderBackstageScreens();

      if (moveState.turnLeft) plushieRotation.yaw += 2.2 * delta;
      if (moveState.turnRight) plushieRotation.yaw -= 2.2 * delta;

      const moveSpeed = 4.2 * delta;
      if (moveState.forward) {
        plushieVelocity.x += -Math.sin(plushieRotation.yaw) * moveSpeed * 5.0;
        plushieVelocity.z += -Math.cos(plushieRotation.yaw) * moveSpeed * 5.0;
      }
      if (moveState.backward) {
        plushieVelocity.x -= -Math.sin(plushieRotation.yaw) * moveSpeed * 5.0;
        plushieVelocity.z -= -Math.cos(plushieRotation.yaw) * moveSpeed * 5.0;
      }

      plushieVelocity.multiplyScalar(0.90);
      plushiePosition.addScaledVector(plushieVelocity, delta);

      localPlushie.position.copy(plushiePosition);
      localPlushie.rotation.y = plushieRotation.yaw + Math.PI;

      const p1Pos = new THREE.Vector3(-1.6, 0.44, -2.2);
      const p2Pos = new THREE.Vector3(1.6, 0.44, -2.2);
      const distP1 = plushiePosition.distanceTo(p1Pos);
      const distP2 = plushiePosition.distanceTo(p2Pos);

      isLocalOnPodium1 = distP1 < 0.65;
      isLocalOnPodium2 = distP2 < 0.65;

      if (!studioPower && gameState === "MODE_PROMPT") {
        if (isLocalOnPodium1 && !isPodiumPriorityActive) {
          startPodium1PrioritySequence();
        }
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
