<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Plushie Foosball & Rugby Arena</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #05020a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: manipulation;
    }
    #canvas3d { width: 100%; height: 100%; display: block; cursor: pointer; }

    #hud {
      position: absolute; top: 15px; left: 15px; background: rgba(22, 9, 44, 0.9);
      border: 2px solid #ff79b0; border-radius: 12px; padding: 12px 18px; color: #fff;
      font-family: monospace; font-size: 0.85rem; pointer-events: none; z-index: 20;

    }
    #room-code-pill { margin-top: 5px; font-weight: bold; color: #39ff14; font-size: 0.95rem; }
    #countdown-pill { margin-top: 6px; font-weight: bold; color: #ffda66; font-size: 0.95rem; }
    #match-clock-hud { margin-top: 4px; font-weight: bold; color: #00f0ff; font-size: 0.95rem; }
    #audience-pill { margin-top: 4px; font-weight: bold; color: #39ff14; }

    #mode-banner {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(22, 9, 44, 0.92); border: 2px solid #00f0ff; border-radius: 10px;
      padding: 10px 20px; color: #ffda66; font-family: monospace; font-size: 0.9rem;
      z-index: 25; text-align: center; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">

    <div class="hud-sub" id="mode-sub">Bump into the ball with your belly & bash into friends!</div>
    <div id="room-code-pill">CODE: <span id="hud-code-val">----</span></div>
    <div id="countdown-pill">STATUS: <span id="timer-val" style="color:#ffda66;">WALK WAY OUT EAST TO THE GIANT FOOTBALL PITCH!</span></div>
    <div id="match-clock-hud">SHOW CLOCK: <span id="game-clock-val" style="color:#ffda66;">20:00</span></div>
    <div id="audience-pill">AUDIENCE WATCHING: <span id="audience-count" style="color:#39ff14;">1</span></div>
  </div>

  <div id="mode-banner">
    Move with <span style="color:#39ff14;">W, A, S, D</span> • Walk far out East to the expanded <span style="color:#00f0ff;">Plushie Bumper Arena</span>!
  </div>

  <canvas id="canvas3d"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    // --- 1. SETUP GLOBALS & SCENE FIRST ---
    let isHostAuthorized = true;
    let socket = null;
    const remotePlayers = new Map();
    let localMyGuestName = "Guest 1";
    let isBallPhysicsHost = false;

    const studioRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
    
    let currentMode = 'BEDROOM';
    let studioPower = false;
    let isGoodySpeaking = false;

    let showPlayer1 = false;
    let showPlayer2 = false;

    const videoPlayer1 = document.createElement('video');
    videoPlayer1.autoplay = true; videoPlayer1.playsInline = true; videoPlayer1.muted = false;
    const videoPlayer2 = document.createElement('video');
    videoPlayer2.autoplay = true; videoPlayer2.playsInline = true; videoPlayer2.muted = false;

    let hasLivePlayer1Stream = false;
    let hasLivePlayer2Stream = false;
    let rawPlayer1Stream = null;
    let rawPlayer2Stream = null;

    let gameState = "MODE_PROMPT";
    let isSoloMode = false;
    let isVsGoodyMode = false;
    let goodyPlayerSlot = null;
    let soloPlayerId = null;

    let diceCountdown = 10;
    let diceCountdownInterval = null;
    let isDiceTimerActive = false;

    let p1RollVal = null;
    let p2RollVal = null;
    let isDiceRollingP1 = false;
    let isDiceRollingP2 = false;

    let isPawnMoving = false;
    let hasPlayerRolledThisTurn = false;

    let matchTimerSeconds = 20 * 60;
    let matchTimerInterval = null;
    let isTimeExpired = false;

    let activePlayer = "goody-contestant-1";
    let activeQuestion = null;
    let activeRecap = null;
    let isTieBreakerActive = false;
    let tieBreakerAnswered = false;

    let questionTimer = 0;
    let isQuestionTimerActive = false;
    let questionInterval = null;
    let stageSelectedOption = null;
    let stageOptionStatus = null;

    let audienceCount = 1;
    let blueScore = 0;
    let redScore = 0;

    const contestantRotations = {
      "goody-contestant-1": { yaw: 0, pitch: -0.15 },
      "goody-contestant-2": { yaw: 0, pitch: -0.15 }
    };

    const contestantNames = {
      "goody-contestant-1": "Player 1",
      "goody-contestant-2": "Player 2"
    };

    const contestantCities = {
      "goody-contestant-1": "London",
      "goody-contestant-2": "Nottingham"
    };

    const contestantTokens = {
      "goody-contestant-1": null,
      "goody-contestant-2": null
    };

    const playerStats = { asked: 0, correct: 0 };

    let isP1Connected = false;
    let isP2Connected = false;
    let p1PeerId = null;
    let p2PeerId = null;

    let droppedOutContestant = null;
    let droppedOutName = "";
    let droppedOutCity = "";
    let droppedOutSessionToken = null;

    let intermissionTimeout = null;
    let savedActiveCountry = null;
    let savedGameState = null;

    const spectatorPlushies = new Map();

    // --- THREE.JS SCENE CREATION ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040208);
    scene.fog = new THREE.FogExp2(0x040208, 0.015);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 5.8, -5.0);

    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const canvasPlayer1 = document.createElement('canvas'); canvasPlayer1.width = 640; canvasPlayer1.height = 360;
    const canvasPlayer2 = document.createElement('canvas'); canvasPlayer2.width = 640; canvasPlayer2.height = 360;
    const streamPlayer1 = canvasPlayer1.captureStream(30);
    const streamPlayer2 = canvasPlayer2.captureStream(30);

    let studioPeer = null;
    let connectedDataConns = [];
    const connectedAudiencePeers = new Set();

    // --- 2. CORE HELPER FUNCTIONS ---
    let audioCtx = null;
    let goodyUtterance = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (videoPlayer1.srcObject) videoPlayer1.play().catch(() => {});
      if (videoPlayer2.srcObject) videoPlayer2.play().catch(() => {});
    }

    function playTone(freq, type, duration, gainVal = 0.05) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function updatePlushieNameBadge(pGroup, displayName) {
      if (!pGroup || !pGroup.userData || !pGroup.userData.badgeCanvas) return;
      const canvas = pGroup.userData.badgeCanvas;
      const ctx = canvas.getContext('2d');
      const w = canvas.width; const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(22, 9, 44, 0.9)';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 8;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(4, 4, w - 8, h - 8, 20);
      } else {
        ctx.rect(4, 4, w - 8, h - 8);
      }
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 38px sans-serif';
      ctx.fillText((displayName || "GUEST 1").toUpperCase(), w / 2, h / 2 + 2);

      if (pGroup.userData.badgeTexture) {
        pGroup.userData.badgeTexture.needsUpdate = true;
      }
    }

    function setPlushieVisualMode(group, mode) {
      if (!group) return;
      if (mode === 'invisible') {
        group.visible = false;
        return;
      }
      group.visible = true;
      const isOpaque = (mode === 'opaque');
      group.traverse(child => {
        if (child.isMesh && child.material && child !== group.userData.badgeMesh) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach(m => {
            if (isOpaque) {
              m.transparent = false;
              m.opacity = 1.0;
              m.depthWrite = true;
            } else {
              m.transparent = true;
              m.opacity = 0.45;
              m.depthWrite = false;
            }
            m.needsUpdate = true;
          });
        }
      });
    }

    function createCutePlushie(color, initialName = "Guest 1") {
      const pGroup = new THREE.Group();
      const pMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.95 });
      const pBody = new THREE.Mesh(new THREE.SphereGeometry(0.28, 14, 14), pMat); pBody.position.y = 0.28; pGroup.add(pBody);
      const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), pMat); pHead.position.y = 0.58; pGroup.add(pHead);
      const ear1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), pMat); ear1.position.set(-0.14, 0.74, 0);
      const ear2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), pMat); ear2.position.set(0.14, 0.74, 0); pGroup.add(ear1, ear2);
      const blushMat = new THREE.MeshBasicMaterial({ color: 0xff69b4 });
      const blush1 = new THREE.Mesh(new THREE.SphereGeometry(0.038, 8, 8), blushMat); blush1.position.set(-0.11, 0.54, 0.17);
      const blush2 = new THREE.Mesh(new THREE.SphereGeometry(0.038, 8, 8), blushMat); blush2.position.set(0.11, 0.54, 0.17); pGroup.add(blush1, blush2);
      const eyeBlackMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), eyeBlackMat); eyeL.position.set(-0.07, 0.60, 0.19);
      const shineL = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeWhiteMat); shineL.position.set(-0.08, 0.612, 0.21); pGroup.add(eyeL, shineL);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), eyeBlackMat); eyeR.position.set(0.07, 0.60, 0.19);
      const shineR = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), eyeWhiteMat); shineR.position.set(0.06, 0.612, 0.21); pGroup.add(eyeR, shineR);
      const snout = new THREE.Mesh(new THREE.SphereGeometry(0.042, 8, 8), new THREE.MeshStandardMaterial({ color: 0xff8fab, roughness: 0.6 }));
      snout.scale.set(1.2, 0.8, 1); snout.position.set(0, 0.56, 0.21); pGroup.add(snout);
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.007, 4, 8, Math.PI), new THREE.MeshBasicMaterial({ color: 0x222222 }));
      mouth.position.set(0, 0.525, 0.21); mouth.rotation.x = Math.PI * 0.1; pGroup.add(mouth);

      const bCanvas = document.createElement('canvas');
      bCanvas.width = 256; bCanvas.height = 96;
      const bTex = new THREE.CanvasTexture(bCanvas);
      const badgeMat = new THREE.MeshBasicMaterial({
        map: bTex, transparent: true, side: THREE.DoubleSide, depthWrite: false
      });
      const badgeMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.185), badgeMat);
      badgeMesh.position.set(0, 0.95, 0);
      badgeMesh.matrixAutoUpdate = true;
      pGroup.add(badgeMesh);

      pGroup.userData = {
        badgeCanvas: bCanvas, badgeTexture: bTex, badgeMesh: badgeMesh
      };
      updatePlushieNameBadge(pGroup, initialName);
      return pGroup;
    }

    // --- 3. WEBRTC & SOCKET CONNECTION ---
    function initStudioWebRTC() {
      if (!isHostAuthorized || studioPeer) return;
      try {
        studioPeer = new Peer("goody-main-studio");
        studioPeer.on('open', (id) => console.log("Master Host Registered:", id));
        studioPeer.on('call', (call) => {
          const isAudience = call.metadata && call.metadata.role === 'AUDIENCE';
          if (isAudience) { call.answer(); return; }
          const passcode = call.metadata ? call.metadata.passcode : "";
          if (passcode !== studioRoomCode) { call.close(); return; }
          
          const cId = call.metadata ? call.metadata.contestant : null;
          const isPlayer2 = cId === "goody-contestant-2";
          call.answer(isPlayer2 ? streamPlayer2 : streamPlayer1);

          call.on('stream', (remoteStream) => {
            if (isPlayer2) {
              rawPlayer2Stream = remoteStream;
              videoPlayer2.srcObject = remoteStream;
              videoPlayer2.play().catch(() => {});
              hasLivePlayer2Stream = true;
              showPlayer2 = true;
            } else {
              rawPlayer1Stream = remoteStream;
              videoPlayer1.srcObject = remoteStream;
              videoPlayer1.play().catch(() => {});
              hasLivePlayer1Stream = true;
              showPlayer1 = true;
            }
            broadcastBoardState();
          });
        });

        studioPeer.on('connection', (conn) => {
          connectedDataConns.push(conn);
          conn.on('open', () => {
            conn.send({ type: "AUTH_SUCCESS" });
            broadcastBoardState();
          });
          conn.on('close', () => {
            connectedDataConns = connectedDataConns.filter(c => c.peer !== conn.peer);
          });
        });
      } catch(e) { console.error(e); }
    }

    function initSocketConnection() {
      try {
        socket = io();

        socket.on('ball_host_assignment', (data) => {
          isBallPhysicsHost = data.isHost;
        });

        socket.on('current_players', (playersList) => {
          playersList.forEach(data => {
            if (data.id === socket.id) {
              localMyGuestName = data.name;
              updatePlushieNameBadge(localPlushie, localMyGuestName);
              if (data.x !== undefined && data.z !== undefined) {
                plushiePosition.set(data.x, data.y || 0.44, data.z);
              }
            } else {
              let pMesh = remotePlayers.get(data.id);
              if (!pMesh) {
                pMesh = createCutePlushie(data.color || 0x00f0ff, data.name || "Guest");
                pMesh.position.set(data.x, data.y || 0.44, data.z);
                miniDiorama.add(pMesh);
                remotePlayers.set(data.id, pMesh);
              }
            }
          });
        });

        socket.on('update_player', (data) => {
          let pMesh = remotePlayers.get(data.id);
          if (!pMesh) {
            pMesh = createCutePlushie(data.color || 0x00f0ff, data.name || "Guest");
            miniDiorama.add(pMesh);
            remotePlayers.set(data.id, pMesh);
          }
          pMesh.position.set(data.x, data.y, data.z);
          pMesh.rotation.y = data.yaw + Math.PI;
          if (data.name) {
            updatePlushieNameBadge(pMesh, data.name);
          }
          setPlushieVisualMode(pMesh, data.isSolid ? 'opaque' : 'transparent');
        });

        socket.on('remove_player', (id) => {
          const pMesh = remotePlayers.get(id);
          if (pMesh) {
            miniDiorama.remove(pMesh);
            remotePlayers.delete(id);
          }
        });

        socket.on('ball_sync', (bData) => {
          if (ballMesh) {
            remoteBallTarget.set(bData.x, bData.y, bData.z);
            if (bData.vx !== undefined) {
              ballVelocity.set(bData.vx, bData.vy, bData.vz);
            }
            hasRemoteBallUpdate = true;
          }
        });

        socket.on('score_sync', (sData) => {
          blueScore = sData.blue;
          redScore = sData.red;
          renderPitchScoreboard(blueScore, redScore);
        });
      } catch (e) {
        console.warn("Socket.io offline or unavailable:", e);
      }
    }

    function unlockHostEnvironment() {
      isHostAuthorized = true;
      initAudio();
      initStudioWebRTC();
      initSocketConnection();
      triggerImmediateModePrompt();
    }

    window.addEventListener('DOMContentLoaded', () => {
      unlockHostEnvironment();
    });

    document.getElementById('hud-code-val').textContent = studioRoomCode;

    // --- 4. GAME FLOW & CONTROLS ---
    function triggerImmediateModePrompt() {
      if (studioPower) return;
      gameState = "MODE_PROMPT";
      document.getElementById('countdown-pill').innerHTML = `STATUS: <span style="color:#ffda66;">SELECT GAME MODE (STEP ON PODIUM 1)</span>`;
      renderStageQuestionBoard();
    }

    function chooseHostGameMode(modeType) {
      if (studioPower) return;
      studioPower = true;
      gameState = "IN_PLAY";
      pawn1.visible = true;
      pawn2.visible = true;
      bootStudio();
    }

    function bootStudio() {
      studioPower = true;
      updateStudioLighting(true);
      renderStageQuestionBoard();
      broadcastBoardState();
    }

    function broadcastBoardState() {
      connectedDataConns.forEach(c => {
        if (c.open) {
          c.send({
            type: "SYNC_BOARD_STATE",
            studioPower: studioPower,
            p1Name: contestantNames["goody-contestant-1"] || "Player 1",
            p2Name: contestantNames["goody-contestant-2"] || "Player 2",
            p1Index: p1Index,
            p2Index: p2Index
          });
        }
      });
    }

    function speakGoody(text, onComplete) {
      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "HOST_SPEAK", text: text });
      });
      if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
      }
      window.speechSynthesis.cancel();
      goodyUtterance = new SpeechSynthesisUtterance(text);
      goodyUtterance.onend = () => { if (onComplete) onComplete(); };
      window.speechSynthesis.speak(goodyUtterance);
    }

    // --- 5. SCENE ELEMENTS & DIORAMA ---
    const miniDiorama = new THREE.Group(); miniDiorama.position.set(0, 3.95, -9);
    const feltCarpet = new THREE.Mesh(new THREE.CylinderGeometry(7.0, 7.0, 0.08, 48), new THREE.MeshStandardMaterial({ color: 0x271147 }));
    feltCarpet.position.y = 0.44;
    miniDiorama.add(feltCarpet);

    const miniWall = new THREE.Mesh(
      new THREE.CylinderGeometry(7.0, 7.0, 4.5, 32, 1, true, 0, Math.PI * 2), 
      new THREE.MeshStandardMaterial({ color: 0x15092a, side: THREE.BackSide })
    );
    miniWall.position.y = 2.65; 
    miniDiorama.add(miniWall);

    const enclosingWallsGroup = new THREE.Group();
    enclosingWallsGroup.position.set(0, 0.44, 0.0);
    const studioWallMat = new THREE.MeshStandardMaterial({ color: 0x1f113a, roughness: 0.3, metalness: 0.4, side: THREE.DoubleSide });
    
    enclosingWallsGroup.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.6, 5.0, 14.0), studioWallMat), { position: new THREE.Vector3(-7.0, 2.5, 0.0) }));
    enclosingWallsGroup.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(17.0, 5.0, 0.6), studioWallMat), { position: new THREE.Vector3(1.5, 2.5, -7.0) }));
    enclosingWallsGroup.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(17.0, 5.0, 0.6), studioWallMat), { position: new THREE.Vector3(1.5, 2.5, 7.0) }));
    miniDiorama.add(enclosingWallsGroup);

    // Scoreboard & Arena
    const pitchSbCanvas = document.createElement('canvas'); pitchSbCanvas.width = 1024; pitchSbCanvas.height = 512;
    const pitchSbCtx = pitchSbCanvas.getContext('2d');
    const pitchSbTexture = new THREE.CanvasTexture(pitchSbCanvas);
    pitchSbTexture.minFilter = THREE.LinearFilter;

    const pitchScoreboardMesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), new THREE.MeshBasicMaterial({ map: pitchSbTexture, side: THREE.DoubleSide }));
    pitchScoreboardMesh.position.set(34.0, 3.5, 14.0);
    pitchScoreboardMesh.rotation.y = Math.PI;
    miniDiorama.add(pitchScoreboardMesh);

    function renderPitchScoreboard(blue, red) {
      pitchSbCtx.fillStyle = '#05020a'; pitchSbCtx.fillRect(0, 0, 1024, 512);
      pitchSbCtx.strokeStyle = '#00f0ff'; pitchSbCtx.lineWidth = 10; pitchSbCtx.strokeRect(10, 10, 1004, 492);
      pitchSbCtx.fillStyle = '#ffda66'; pitchSbCtx.font = 'bold 44px monospace'; pitchSbCtx.textAlign = 'center';
      pitchSbCtx.fillText('★ PLUSHIE RUGBY-FOOTIE ARENA ★', 512, 85);
      
      pitchSbCtx.fillStyle = '#00f0ff'; pitchSbCtx.font = 'bold 36px monospace'; pitchSbCtx.fillText('BLUE TEAM', 280, 195);
      pitchSbCtx.fillStyle = '#ffffff'; pitchSbCtx.font = 'bold 96px monospace'; pitchSbCtx.fillText(blue, 280, 330);

      pitchSbCtx.fillStyle = '#ff3838'; pitchSbCtx.font = 'bold 36px monospace'; pitchSbCtx.fillText('RED TEAM', 744, 195);
      pitchSbCtx.fillStyle = '#ffffff'; pitchSbCtx.font = 'bold 96px monospace'; pitchSbCtx.fillText(red, 744, 330);
      pitchSbTexture.needsUpdate = true;
    }
    renderPitchScoreboard(0, 0);

    const foosballGroup = new THREE.Group(); foosballGroup.position.set(34.0, 0.44, 0.0);
    const turfMesh = new THREE.Mesh(new THREE.BoxGeometry(36.0, 0.06, 24.0), new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.8 }));
    turfMesh.position.y = 0.03; foosballGroup.add(turfMesh);
    miniDiorama.add(foosballGroup);

    const ballMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.38, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xffda66, emissive: 0x443300, roughness: 0.3, metalness: 0.5 })
    );
    ballMesh.position.set(34.0, 0.82, 0.0);
    miniDiorama.add(ballMesh);

    let ballVelocity = new THREE.Vector3(0, 0, 0);
    const remoteBallTarget = new THREE.Vector3(34.0, 0.82, 0.0);
    let hasRemoteBallUpdate = false;

    // Pawns & Podiums
    const p1PodiumGroup = new THREE.Group();
    p1PodiumGroup.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.48, 0.55, 20), new THREE.MeshStandardMaterial({ color: 0x1b0c30 })), { position: new THREE.Vector3(0, 0.275, 0) }));
    p1PodiumGroup.position.set(-1.6, 0.44, -2.2); miniDiorama.add(p1PodiumGroup);

    const p2PodiumGroup = new THREE.Group();
    p2PodiumGroup.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.48, 0.55, 20), new THREE.MeshStandardMaterial({ color: 0x1b0c30 })), { position: new THREE.Vector3(0, 0.275, 0) }));
    p2PodiumGroup.position.set(1.6, 0.44, -2.2); miniDiorama.add(p2PodiumGroup);

    function createPlayerPawn(colorHex, initialName) {
      const pawn = new THREE.Group();
      const baseMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.6, roughness: 0.25 });
      pawn.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.10, 0.04, 16), baseMat), { position: new THREE.Vector3(0, 0.02, 0) }));
      pawn.add(Object.assign(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.16, 16), baseMat), { position: new THREE.Vector3(0, 0.12, 0) }));
      pawn.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), baseMat), { position: new THREE.Vector3(0, 0.22, 0) }));

      const bCanvas = document.createElement('canvas'); bCanvas.width = 256; bCanvas.height = 96;
      const bTex = new THREE.CanvasTexture(bCanvas);
      const badgeMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.13), new THREE.MeshBasicMaterial({ map: bTex, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
      badgeMesh.position.set(0, 0.35, 0); pawn.add(badgeMesh);

      pawn.userData = { badgeCanvas: bCanvas, badgeTexture: bTex, badgeMesh: badgeMesh };
      updatePlushieNameBadge(pawn, initialName);
      return pawn;
    }

    let p1Index = 0; let p2Index = 0;
    const pawn1 = createPlayerPawn(0x00d2d3, "Player 1"); pawn1.visible = false; miniDiorama.add(pawn1);
    const pawn2 = createPlayerPawn(0xff3838, "Player 2"); pawn2.visible = false; miniDiorama.add(pawn2);

    // Question Board Canvas
    const qBoardCanvas = document.createElement('canvas'); qBoardCanvas.width = 512; qBoardCanvas.height = 384;
    const qBoardCtx = qBoardCanvas.getContext('2d');
    const qBoardTex = new THREE.CanvasTexture(qBoardCanvas);

    function renderStageQuestionBoard() {
      qBoardCtx.fillStyle = '#120726'; qBoardCtx.fillRect(0, 0, 512, 384);
      qBoardCtx.strokeStyle = '#00f0ff'; qBoardCtx.lineWidth = 6; qBoardCtx.strokeRect(3, 3, 506, 378);
      qBoardCtx.fillStyle = '#ffda66'; qBoardCtx.font = 'bold 26px sans-serif'; qBoardCtx.textAlign = 'center';
      qBoardCtx.fillText("THE GOODY TONIGHT SHOW", 256, 192);
      qBoardTex.needsUpdate = true;
    }
    renderStageQuestionBoard();

    const qBoardMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.7), new THREE.MeshBasicMaterial({ map: qBoardTex }));
    qBoardMesh.position.set(-4.8, 3.4, -3.2); qBoardMesh.rotation.y = 0.8; miniDiorama.add(qBoardMesh);

    // --- 6. LOCAL PLAYER & CONTROLS ---
    const moveState = { forward: false, backward: false, turnLeft: false, turnRight: false };
    const plushiePosition = new THREE.Vector3(32.0, 0.44, 2.5);
    const plushieRotation = { yaw: 0 };
    const plushieVelocity = new THREE.Vector3(0, 0, 0);

    const localPlushie = createCutePlushie(0x00f0ff, "Guest 1");
    localPlushie.position.copy(plushiePosition);
    miniDiorama.add(localPlushie);
    setPlushieVisualMode(localPlushie, 'opaque');

    document.addEventListener('keydown', (e) => {
      if (!isHostAuthorized) return;
      if (e.code === 'KeyW') moveState.forward = true;
      if (e.code === 'KeyS') moveState.backward = true;
      if (e.code === 'KeyA') moveState.turnLeft = true;
      if (e.code === 'KeyD') moveState.turnRight = true;
    });

    document.addEventListener('keyup', (e) => {
      if (!isHostAuthorized) return;
      if (e.code === 'KeyW') moveState.forward = false;
      if (e.code === 'KeyS') moveState.backward = false;
      if (e.code === 'KeyA') moveState.turnLeft = false;
      if (e.code === 'KeyD') moveState.turnRight = false;
    });

    // --- 7. ANIMATION LOOP ---
    let prevTime = performance.now();
    let lastBallSyncTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.1);

      if (moveState.turnLeft) plushieRotation.yaw += 2.2 * delta;
      if (moveState.turnRight) plushieRotation.yaw -= 2.2 * delta;

      const moveSpeed = 4.2 * delta;
      if (moveState.forward) {
        plushieVelocity.x += -Math.sin(plushieRotation.yaw) * moveSpeed * 5.0;
        plushieVelocity.z += -Math.cos(plushieRotation.yaw) * moveSpeed * 5.0;
      }
      if (moveState.backward) {
        plushieVelocity.x -= -Math.sin(plushieRotation.yaw) * moveSpeed * 5.0;
        plushieVelocity.z -= -Math.cos(plushieRotation.yaw) * moveSpeed * 5.0;
      }

      plushieVelocity.multiplyScalar(0.90);
      plushiePosition.addScaledVector(plushieVelocity, delta);
      plushiePosition.x = Math.max(-6.5, Math.min(54.0, plushiePosition.x));
      plushiePosition.z = Math.max(-13.5, Math.min(13.5, plushiePosition.z));

      // Ball Physics & Single-Authority Check
      const inPitchArena = plushiePosition.x > 10.0;
      if (inPitchArena) {
        const ballPos = ballMesh.position;
        const plushXZ = new THREE.Vector3(plushiePosition.x, 0, plushiePosition.z);
        const ballXZ = new THREE.Vector3(ballPos.x, 0, ballPos.z);
        const distToBall = plushXZ.distanceTo(ballXZ);

        if (isBallPhysicsHost) {
          if (distToBall < 0.78) {
            const pushDir = new THREE.Vector3().subVectors(ballXZ, plushXZ).normalize();
            ballVelocity.addScaledVector(pushDir, 13.0);
            playTone(600, 'triangle', 0.08, 0.1);
          }

          ballPos.addScaledVector(ballVelocity, delta);
          ballVelocity.multiplyScalar(0.96);

          if (socket && socket.connected && (time - lastBallSyncTime > 30)) {
            lastBallSyncTime = time;
            socket.emit('ball_move', { x: ballPos.x, y: ballPos.y, z: ballPos.z, vx: ballVelocity.x, vy: ballVelocity.y, vz: ballVelocity.vz });
          }
        } else if (hasRemoteBallUpdate) {
          ballPos.lerp(remoteBallTarget, 0.25);
        }
      } else {
        ballMesh.position.set(34.0, 0.82, 0.0);
        ballVelocity.set(0, 0, 0);
        hasRemoteBallUpdate = false;
      }

      if (socket && socket.connected) {
        socket.emit('player_move', {
          name: localMyGuestName,
          x: plushiePosition.x,
          y: plushiePosition.y,
          z: plushiePosition.z,
          yaw: plushieRotation.yaw
        });
      }

      localPlushie.position.copy(plushiePosition);
      localPlushie.rotation.y = plushieRotation.yaw + Math.PI;

      const dioramaWorldPos = new THREE.Vector3(0, 3.95, -9);
      const plushieWorldPos = plushiePosition.clone().add(dioramaWorldPos);
      camera.position.set(plushieWorldPos.x + Math.sin(plushieRotation.yaw) * 3.2, plushieWorldPos.y + 1.6, plushieWorldPos.z + Math.cos(plushieRotation.yaw) * 3.2);
      camera.lookAt(plushieWorldPos.x, plushieWorldPos.y + 0.6, plushieWorldPos.z);

      // BILLBOARD NAME TAGS TO ALWAYS FACE THE CAMERA
      const billboardMatrix = new THREE.Matrix4().extractRotation(camera.matrixWorld);
      if (localPlushie?.userData?.badgeMesh) {
        localPlushie.userData.badgeMesh.quaternion.setFromRotationMatrix(billboardMatrix);
      }
      remotePlayers.forEach(pMesh => {
        if (pMesh?.userData?.badgeMesh) {
          pMesh.userData.badgeMesh.quaternion.setFromRotationMatrix(billboardMatrix);
        }
      });

      prevTime = time;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
