<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Plushie Foosball & Rugby Arena</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #05020a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #canvas3d { width: 100%; height: 100%; display: block; cursor: pointer; }

    #hud {
      position: absolute; top: 15px; left: 15px; background: rgba(22, 9, 44, 0.9);
      border: 2px solid #ff79b0; border-radius: 12px; padding: 12px 18px; color: #fff;
      font-family: monospace; font-size: 0.85rem; pointer-events: none; z-index: 20;
      box-shadow: 0 0 20px rgba(255, 121, 176, 0.25);
    }
    #room-code-pill { margin-top: 5px; font-weight: bold; color: #39ff14; font-size: 0.95rem; }
    #countdown-pill { margin-top: 6px; font-weight: bold; color: #ffda66; font-size: 0.95rem; }
    #match-clock-hud { margin-top: 4px; font-weight: bold; color: #00f0ff; font-size: 0.95rem; }
    #audience-pill { margin-top: 4px; font-weight: bold; color: #39ff14; }

    #mode-banner {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(22, 9, 44, 0.92); border: 2px solid #00f0ff; border-radius: 10px;
      padding: 10px 20px; color: #ffda66; font-family: monospace; font-size: 0.9rem;
      z-index: 25; text-align: center; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      pointer-events: none;
    }

    /* Mobile Virtual D-Pad & Look Zone */
    #mobile-dpad {
      position: absolute;
      bottom: 25px;
      left: 25px;
      display: none;
      grid-template-areas:
        ". up ."
        "left down right";
      gap: 16px;
      z-index: 30;
      pointer-events: auto;
      touch-action: none;
    }

    #mobile-look-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      display: none;
      z-index: 28;
      touch-action: none;
    }

    @media (pointer: coarse), (max-width: 900px) {
      #mobile-dpad { display: grid; }
      #mobile-look-zone { display: block; }
    }

    .dpad-btn {
      width: 76px;
      height: 76px;
      background: rgba(22, 9, 44, 0.88);
      border: 3px solid #00f0ff;
      border-radius: 18px;
      color: #00f0ff;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
      transition: background 0.05s, box-shadow 0.05s, border-color 0.05s;
    }

    .dpad-btn.active, .dpad-btn:active {
      background: rgba(0, 240, 255, 0.5);
      border-color: #39ff14;
      color: #39ff14;
      box-shadow: 0 0 26px #39ff14;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-title" id="mode-title" style="color: #ffda66;">STUDIO FLOOR & WIDE PLUSHIE RUGBY-FOOTIE ARENA</div>
    <div class="hud-sub" id="mode-sub">Bump into the ball with your belly & bash into friends!</div>
    <div id="room-code-pill">CODE: <span id="hud-code-val">----</span></div>
    <div id="countdown-pill">STATUS: <span id="timer-val" style="color:#ffda66;">STEP ON PODIUM 1 TO START LAUNCH SEQUENCE!</span></div>
    <div id="match-clock-hud">SHOW CLOCK: <span id="game-clock-val" style="color:#ffda66;">20:00</span></div>
    <div id="audience-pill">AUDIENCE WATCHING: <span id="audience-count" style="color:#39ff14;">1</span></div>
  </div>

  <div id="mode-banner">
    Move with <span style="color:#39ff14;">W, A, S, D</span> • Step on <span style="color:#00d2d3;">Podium 1</span> or <span style="color:#ff3838;">Podium 2</span> to Launch!
  </div>

  <canvas id="canvas3d"></canvas>

  <div id="mobile-look-zone"></div>

  <div id="mobile-dpad">
    <div class="dpad-btn" id="btn-up" style="grid-area: up;">▲</div>
    <div class="dpad-btn" id="btn-left" style="grid-area: left;">◄</div>
    <div class="dpad-btn" id="btn-down" style="grid-area: down;">▼</div>
    <div class="dpad-btn" id="btn-right" style="grid-area: right;">►</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    let isHostAuthorized = true;
    let socket = null;
    const remotePlayers = new Map();
    let localMyGuestName = "Guest 1";
    let isBallPhysicsHost = false;

    function unlockHostEnvironment() {
      isHostAuthorized = true;
      initAudio();
      initStudioWebRTC();
      initSocketConnection();
    }

    window.addEventListener('DOMContentLoaded', () => {
      unlockHostEnvironment();
    });

    const studioRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('hud-code-val').textContent = studioRoomCode;

    let currentMode = 'BEDROOM';
    let studioPower = false;
    let isGoodySpeaking = false;

    let showPlayer1 = false;
    let showPlayer2 = false;

    const videoPlayer1 = document.createElement('video');
    videoPlayer1.autoplay = true; videoPlayer1.playsInline = true; videoPlayer1.muted = false;
    const videoPlayer2 = document.createElement('video');
    videoPlayer2.autoplay = true; videoPlayer2.playsInline = true; videoPlayer2.muted = false;

    let hasLivePlayer1Stream = false;
    let hasLivePlayer2Stream = false;

    let rawPlayer1Stream = null;
    let rawPlayer2Stream = null;

    let gameState = "MODE_PROMPT"; 
    let isSoloMode = false;
    let isVsGoodyMode = false;
    let goodyPlayerSlot = null;
    let soloPlayerId = null;

    let priorityTimer = null;
    let prioritySecondsLeft = 10;
    let antiSpamLockout = false;
    let antiSpamTimer = null;
    let podiumOffCount = 0;
    let lastPodiumOffTime = 0;
    let hasTriggeredExtendedWindow = false;

    let diceCountdown = 10;
    let diceCountdownInterval = null;
    let isDiceTimerActive = false;

    let p1RollVal = null;
    let p2RollVal = null;
    let isDiceRollingP1 = false;
    let isDiceRollingP2 = false;

    let isPawnMoving = false;
    let hasPlayerRolledThisTurn = false;

    let matchTimerSeconds = 20 * 60;
    let matchTimerInterval = null;
    let isTimeExpired = false;
    let gameClockValEl = document.getElementById('game-clock-val');

    let activePlayer = "goody-contestant-1";
    let activeQuestion = null;
    let activeRecap = null;
    let isTieBreakerActive = false;
    let tieBreakerAnswered = false;

    let questionTimer = 0;
    let isQuestionTimerActive = false;
    let questionInterval = null;
    let stageSelectedOption = null;
    let stageOptionStatus = null;

    let audienceCount = 1;
    const audienceCountEl = document.getElementById('audience-count');
    const countdownPill = document.getElementById('countdown-pill');
    const timerValEl = document.getElementById('timer-val');

    let blueScore = 0;
    let redScore = 0;

    const contestantRotations = {
      "goody-contestant-1": { yaw: 0, pitch: -0.15 },
      "goody-contestant-2": { yaw: 0, pitch: -0.15 }
    };

    const contestantNames = {
      "goody-contestant-1": "Player 1",
      "goody-contestant-2": "Player 2"
    };

    const contestantCities = {
      "goody-contestant-1": "London",
      "goody-contestant-2": "Nottingham"
    };

    const contestantTokens = {
      "goody-contestant-1": null,
      "goody-contestant-2": null
    };

    const playerStats = { asked: 0, correct: 0 };

    let isP1Connected = false;
    let isP2Connected = false;
    let p1PeerId = null;
    let p2PeerId = null;

    let droppedOutContestant = null;
    let droppedOutName = "";
    let droppedOutCity = "";
    let droppedOutSessionToken = null;

    let savedTurnPlayer = null;
    let intermissionTimeout = null;
    let savedActiveCountry = null;
    let savedGameState = null;
    let replacementGraceTimeout = null;

    const spectatorPlushies = new Map();

    function initSocketConnection() {
      try {
        socket = io();

        socket.on('ball_host_assignment', (data) => {
          isBallPhysicsHost = data.isHost;
        });

        socket.on('assign_team', (data) => {
          assignedTeam = data.team;
          teamColorHex = data.teamColor;
          plushieColorHex = assignedTeam === 'RED' ? 0xff3838 : 0x00f0ff;
          if (data.name) {
            localMyGuestName = data.name;
          }

          if (localPlushie) {
            localPlushie.userData.team = assignedTeam;
            localPlushie.traverse(child => {
              if (child.isMesh && child.material && child !== localPlushie.userData.badgeMesh) {
                child.material.color.setHex(plushieColorHex);
              }
            });
            updatePlushieNameBadge(localPlushie, localMyGuestName, teamColorHex);
          }
        });

        socket.on('update_player', (data) => {
          let pMesh = remotePlayers.get(data.id);
          const remoteTeam = data.team || 'BLUE';
          const remoteTeamColor = data.teamColor || (remoteTeam === 'RED' ? '#ff3838' : '#00f0ff');
          const remotePlushieHex = remoteTeam === 'RED' ? 0xff3838 : 0x00f0ff;
          const playerName = data.name || "Guest";

          if (!pMesh) {
            pMesh = createCutePlushie(remotePlushieHex, playerName);
            pMesh.userData.team = remoteTeam;
            updatePlushieNameBadge(pMesh, playerName, remoteTeamColor);
            miniDiorama.add(pMesh);
            remotePlayers.set(data.id, pMesh);
          } else {
            pMesh.userData.team = remoteTeam;
            pMesh.traverse(child => {
              if (child.isMesh && child.material && child !== localPlushie.userData.badgeMesh) {
                child.material.color.setHex(remotePlushieHex);
              }
            });
          }
         
          pMesh.position.set(data.x, data.y, data.z);
          pMesh.rotation.y = data.yaw + Math.PI;
         
          if (data.name) {
            updatePlushieNameBadge(pMesh, data.name, remoteTeamColor);
          }
         
          setPlushieVisualMode(pMesh, data.isSolid ? 'opaque' : 'transparent');
        });

        socket.on('remove_player', (id) => {
          const pMesh = remotePlayers.get(id);
          if (pMesh) {
            if (pMesh.userData && pMesh.userData.badgeMesh) {
              miniDiorama.remove(pMesh.userData.badgeMesh);
            }
            miniDiorama.remove(pMesh);
            remotePlayers.delete(id);
          }
        });

        socket.on('ball_sync', (bData) => {
          if (ballMesh) {
            remoteBallTarget.set(bData.x, bData.y, bData.z);
            if (bData.vx !== undefined) {
              ballVelocity.set(bData.vx, bData.vy, bData.vz);
            }
            hasRemoteBallUpdate = true;
          }
        });

        socket.on('score_sync', (sData) => {
          blueScore = sData.blue;
          redScore = sData.red;
          renderPitchScoreboard(blueScore, redScore);
        });
      } catch (e) {
        console.warn("Socket.io offline or unavailable:", e);
      }
    }

    function triggerPodium1PriorityLaunch() {
      if (studioPower || gameState === "PODIUM_1_WAIT") return;

      if (antiSpamLockout) {
        countdownPill.innerHTML = `STATUS: <span style="color:#ff7675;">ANTI-SPAM LOCKOUT! WAIT 15s</span>`;
        return;
      }

      gameState = "PODIUM_1_WAIT";
      prioritySecondsLeft = 10;
      renderStageQuestionBoard();

      const speech = `Player 1 has stepped onto Podium 1! Launch sequence initiated! We are holding for 10 seconds to see if Player 2 joins Podium 2!`;
      speakGoody(speech);

      if (priorityTimer) clearInterval(priorityTimer);
      priorityTimer = setInterval(() => {
        prioritySecondsLeft--;
        renderStageQuestionBoard();

        if (isLocalOnPodium2 || isP2Connected) {
          clearInterval(priorityTimer);
          priorityTimer = null;
          chooseHostGameMode("TWOPLAYER");
          return;
        }

        if (prioritySecondsLeft <= 0) {
          clearInterval(priorityTimer);
          priorityTimer = null;
          gameState = "MODE_PROMPT";
          renderStageQuestionBoard();
          speakGoody(`Player 2 window closed! Select your game mode from the screen!`);
        }
      }, 1000);
    }

    function cancelPodium1PriorityLaunch() {
      if (gameState !== "PODIUM_1_WAIT") return;

      const now = Date.now();
      if (now - lastPodiumOffTime < 5000) {
        podiumOffCount++;
        if (podiumOffCount >= 3) {
          triggerAntiSpamLockout();
          return;
        }
      } else {
        podiumOffCount = 1;
      }
      lastPodiumOffTime = now;

      if (priorityTimer) {
        clearInterval(priorityTimer);
        priorityTimer = null;
      }
      gameState = "MODE_PROMPT";
      countdownPill.innerHTML = `STATUS: <span style="color:#ffda66;">STEP ON PODIUM 1 TO START LAUNCH SEQUENCE!</span>`;
      renderStageQuestionBoard();
      speakGoody(`Launch sequence aborted. Step back onto Podium 1 whenever you are ready!`);
    }

    function triggerAntiSpamLockout() {
      antiSpamLockout = true;
      gameState = "MODE_PROMPT";
      if (priorityTimer) {
        clearInterval(priorityTimer);
        priorityTimer = null;
      }
      countdownPill.innerHTML = `STATUS: <span style="color:#ff7675;">LOCKOUT ACTIVE (15s) - STOP SPAMMING PODIUM!</span>`;
      renderStageQuestionBoard();
      speakGoody(`Anti-spam lockout engaged! Please wait 15 seconds before trying to launch again.`);

      if (antiSpamTimer) clearTimeout(antiSpamTimer);
      antiSpamTimer = setTimeout(() => {
        antiSpamLockout = false;
        podiumOffCount = 0;
        countdownPill.innerHTML = `STATUS: <span style="color:#ffda66;">STEP ON PODIUM 1 TO START LAUNCH SEQUENCE!</span>`;
        renderStageQuestionBoard();
      }, 15000);
    }

    function triggerExtendedPodium2Window(onSuccess) {
      if (hasTriggeredExtendedWindow) {
        speakGoody(`You have already used your one-time extension! Please step onto Podium 2 or select Solo or vs Goody.`);
        return;
      }

      hasTriggeredExtendedWindow = true;
      gameState = "PODIUM_1_WAIT";
      prioritySecondsLeft = 10;
      renderStageQuestionBoard();

      speakGoody(`Extended 10-second window opened! Step onto Podium 2 right now to start 2-Player mode!`);

      if (priorityTimer) clearInterval(priorityTimer);
      priorityTimer = setInterval(() => {
        prioritySecondsLeft--;
        renderStageQuestionBoard();

        if (isLocalOnPodium2 || isP2Connected) {
          clearInterval(priorityTimer);
          priorityTimer = null;
          onSuccess();
          return;
        }

        if (prioritySecondsLeft <= 0) {
          clearInterval(priorityTimer);
          priorityTimer = null;
          gameState = "MODE_PROMPT";
          renderStageQuestionBoard();
          speakGoody(`Extended window expired! Please select Solo or vs Goody.`);
        }
      }, 1000);
    }

    function chooseHostGameMode(modeType) {
      if (studioPower) return;
      
      if (modeType === "TWOPLAYER" && !isLocalOnPodium2 && !isP2Connected) {
        if (!hasTriggeredExtendedWindow) {
          triggerExtendedPodium2Window(() => {
            chooseHostGameMode("TWOPLAYER");
          });
          return;
        } else {
          speakGoody(`Need Player 2 on Podium 2 to start 2-Player mode!`);
          return;
        }
      }

      if (priorityTimer) {
        clearInterval(priorityTimer);
        priorityTimer = null;
      }

      if (modeType === "SOLO") {
        isSoloMode = true;
        isVsGoodyMode = false;
        soloPlayerId = "goody-contestant-1";
        const soloName = contestantNames[soloPlayerId];
        activePlayer = soloPlayerId;
        p2RollVal = null;
        isDiceRollingP2 = false;
       
        p2MeshVisible(false);
        bootStudio();
        const speech = `Welcome to The Goody Tonight Show! Starting in 1-Player Solo mode with ${soloName}! Let's begin our 20-minute race to tile 32!`;
        speakGoody(speech, () => {
          startTurnCleanly(soloPlayerId);
        });
      } else if (modeType === "GOODY") {
        isSoloMode = false;
        isVsGoodyMode = true;
        goodyPlayerSlot = "goody-contestant-2";
        contestantNames["goody-contestant-2"] = "Goody";
        p2MeshVisible(true);
        updatePawnNameBadge(pawn2, "Goody");

        bootStudio();
        const speech = `Welcome to The Goody Tonight Show! Starting in 1-Player versus Goody mode! I am taking control of Podium 2. Let's roll our dice!`;
        speakGoody(speech, () => {
          beginTenSecondDiceDuel();
        });
      } else if (modeType === "TWOPLAYER") {
        isSoloMode = false;
        isVsGoodyMode = false;
        p2MeshVisible(true);
        bootStudio();
        const speech = `Welcome to The Goody Tonight Show! Running full 2-Player mode with ${contestantNames["goody-contestant-1"]} and ${contestantNames["goody-contestant-2"]}! Let's determine who goes first!`;
        speakGoody(speech, () => {
          beginTenSecondDiceDuel();
        });
      }
    }

    function p2MeshVisible(isVisible) {
      pawn2.visible = isVisible;
      if (window.p2PodiumGroup) window.p2PodiumGroup.visible = isVisible;
    }

    function broadcastBoardState() {
      connectedDataConns.forEach(c => {
        if (c.open) {
          c.send({
            type: "SYNC_BOARD_STATE",
            studioPower: studioPower,
            p1Name: contestantNames["goody-contestant-1"] || "Player 1",
            p2Name: contestantNames["goody-contestant-2"] || "Player 2",
            p1Index: p1Index,
            p2Index: p2Index
          });
        }
      });
    }

    function forwardContestantStreamsToAudience(audiencePeerId) {
      if (!studioPeer) return;
      if (rawPlayer1Stream) {
        try { studioPeer.call(audiencePeerId, rawPlayer1Stream, { metadata: { contestant: "goody-contestant-1" } }); } catch(e) {}
      }
      if (rawPlayer2Stream) {
        try { studioPeer.call(audiencePeerId, rawPlayer2Stream, { metadata: { contestant: "goody-contestant-2" } }); } catch(e) {}
      }
    }

    function broadcastNewStreamToAllAudience(stream, contestantSlot) {
      if (!studioPeer || !stream) return;
      connectedAudiencePeers.forEach(audPeerId => {
        try { studioPeer.call(audPeerId, stream, { metadata: { contestant: contestantSlot } }); } catch(e) {}
      });
    }

    function handleMidGameDropout(contestantId) {
      if (gameState === "GAME_OVER" || gameState === "INTERMISSION") return;

      if (goodyUtterance) {
        goodyUtterance.onend = null;
        goodyUtterance.onerror = null;
      }
      window.speechSynthesis.cancel();
      isGoodySpeaking = false;

      broadcastMicState("goody-contestant-1", false);
      broadcastMicState("goody-contestant-2", false);

      stopDiceCountdown();
      if (questionInterval) clearInterval(questionInterval);
      if (matchTimerInterval) clearInterval(matchTimerInterval);

      isPawnMoving = false;
      hasPlayerRolledThisTurn = false;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;
      isQuestionTimerActive = false;
      questionTimer = 0;

      savedGameState = gameState;
      savedTurnPlayer = activePlayer;
      savedActiveCountry = activeQuestion ? activeQuestion.country : null;

      activeQuestion = null;
      activeRecap = null;
      stageSelectedOption = null;
      stageOptionStatus = null;

      gameState = "INTERMISSION";
      droppedOutContestant = contestantId;
      droppedOutName = contestantNames[contestantId] || "";
      droppedOutCity = contestantCities[contestantId] || "";
      droppedOutSessionToken = contestantTokens[contestantId] || null;

      const droppedNum = contestantId === "goody-contestant-1" ? `Player 1 (${droppedOutName})` : `Player 2 (${droppedOutName})`;

      countdownPill.innerHTML = `STATUS: <span style="color:#ff7675;">INTERMISSION: WAITING FOR RECONNECT (10s)...</span>`;
      renderStageQuestionBoard();

      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "INTERMISSION_PAUSE", droppedContestant: contestantId });
      });

      const speech = `Hold on everyone! It appears ${droppedNum} has stepped off or lost connection! We have opened a 10-second replacement grace window to let someone take their spot!`;
      speakGoody(speech);

      if (replacementGraceTimeout) clearTimeout(replacementGraceTimeout);
      replacementGraceTimeout = setTimeout(() => {
        if (gameState === "INTERMISSION") {
          triggerOfferChoiceMode();
        }
      }, 10000);
    }

    function checkReplacementPodiumFill(slotId) {
      if (gameState !== "INTERMISSION") return;
      if (replacementGraceTimeout) clearTimeout(replacementGraceTimeout);

      gameState = savedGameState || "IN_PLAY";
      droppedOutContestant = null;
      countdownPill.innerHTML = `STATUS: <span style="color:#39ff14;">REPLACEMENT JOINED! RESUMING MATCH</span>`;
      renderStageQuestionBoard();

      const speech = `Fantastic! A replacement plushie has taken the podium! We are resuming the match right from where ${droppedOutName} left off!`;
      speakGoody(speech, () => {
        if (savedActiveCountry && savedTurnPlayer) {
          const countryToAsk = savedActiveCountry;
          savedActiveCountry = null;
          resumeWithFreshQuestion(savedTurnPlayer, countryToAsk);
        } else {
          savedActiveCountry = null;
          startTurnCleanly(savedTurnPlayer || activePlayer);
        }
      });
    }

    function triggerOnePlayerMode() {
      if (gameState !== "INTERMISSION" && gameState !== "CONTESTANT_CHOOSING" && gameState !== "MODE_PROMPT") return;

      if (intermissionTimeout) clearTimeout(intermissionTimeout);
      isSoloMode = true;
      isVsGoodyMode = false;

      soloPlayerId = "goody-contestant-1";
      const soloName = contestantNames[soloPlayerId];
      activePlayer = soloPlayerId;

      p2RollVal = null;
      isDiceRollingP2 = false;
      p2MeshVisible(false);

      countdownPill.innerHTML = `STATUS: <span style="color:#39ff14;">SOLO RACE ACTIVE!</span>`;
      gameState = "IN_PLAY";
      renderStageQuestionBoard();

      startTwentyMinuteMatchTimer();
      broadcastBoardState();

      const speech = `Welcome back to the show! ${soloName} will now race the board alone to see if they can reach the end before the 20-minute show clock expires! Let's play!`;
      speakGoody(speech, () => {
        if (savedActiveCountry && savedTurnPlayer === soloPlayerId) {
          const countryToAsk = savedActiveCountry;
          savedActiveCountry = null;
          resumeWithFreshQuestion(soloPlayerId, countryToAsk);
        } else {
          savedActiveCountry = null;
          startTurnCleanly(soloPlayerId);
        }
      });
    }

    function triggerOfferChoiceMode() {
      if (gameState !== "INTERMISSION") return;

      if (intermissionTimeout) clearTimeout(intermissionTimeout);
      gameState = "CONTESTANT_CHOOSING";

      const remainingId = isP1Connected ? "goody-contestant-1" : "goody-contestant-2";
      const remainingName = contestantNames[remainingId] || "Contestant";

      countdownPill.innerHTML = `STATUS: <span style="color:#ffda66;">WAITING FOR ${remainingName.toUpperCase()}'S CHOICE...</span>`;
      renderStageQuestionBoard();

      const speech = `The replacement grace window has closed! So ${remainingName}, you can choose to go solo against the 20-minute timer, or battle me, Goody, head-to-head! Make your choice now!`;
      speakGoody(speech, () => {
        connectedDataConns.forEach(c => {
          if (c.open) c.send({ type: "OFFER_CONTESTANT_CHOICE" });
        });
      });
    }

    function triggerVsGoodyMode() {
      isSoloMode = false;
      isVsGoodyMode = true;

      goodyPlayerSlot = droppedOutContestant || "goody-contestant-2";
      contestantNames[goodyPlayerSlot] = "Goody";

      p2MeshVisible(true);
      if (goodyPlayerSlot === "goody-contestant-1") {
        if (window.p1PodiumGroup) window.p1PodiumGroup.visible = true;
        updatePawnNameBadge(pawn1, "Goody");
      } else {
        if (window.p2PodiumGroup) window.p2PodiumGroup.visible = true;
        updatePawnNameBadge(pawn2, "Goody");
      }

    function calculateGoodyAccuracy() {
      let accuracy = 0.65;
      if (playerStats.asked > 0) {
        const humanRatio = playerStats.correct / playerStats.asked;
        if (humanRatio > 0.7) accuracy += 0.15;
        if (humanRatio < 0.4) accuracy -= 0.15;

      const humanIdx = goodyPlayerSlot === "goody-contestant-1" ? p2Index : p1Index;
      const goodyIdx = goodyPlayerSlot === "goody-contestant-1" ? p1Index : p2Index;
      const leadGap = goodyIdx - humanIdx;
      if (leadGap >= 4) accuracy -= 0.25;
      else if (leadGap <= -4) accuracy += 0.20;
      return Math.max(0.30, Math.min(0.90, accuracy));
    }

    function playTone(freq, type, duration, gainVal = 0.05) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function speakGoody(text, onComplete) {
      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "HOST_SPEAK", text: text });
      });

      if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
      }
     
      window.speechSynthesis.cancel();
      goodyUtterance = new SpeechSynthesisUtterance(text);
      goodyUtterance.rate = 0.95;
      goodyUtterance.pitch = 1.25;

      goodyUtterance.onstart = () => { isGoodySpeaking = true; };
      goodyUtterance.onboundary = (e) => {
        isGoodySpeaking = true;
        const chunk = text.substring(e.charIndex, e.charIndex + 65);
        currentSubtitle = chunk.length > 55 ? chunk.substring(0, 55) + "..." : chunk;
        playTone(460 + Math.random() * 200, 'triangle', 0.05, 0.02);
      };

      goodyUtterance.onend = () => {
        isGoodySpeaking = false;
        if (onComplete) onComplete();
      };

      goodyUtterance.onerror = () => {
        isGoodySpeaking = false;
        if (onComplete) onComplete();
      };

      window.speechSynthesis.speak(goodyUtterance);
    }

    function bootStudio() {
      studioPower = true;
      gameState = "INTRO_SPEECH";
      updateStudioLighting(true);
      updateCameraAlignment();
      renderStageQuestionBoard();
      broadcastBoardState();
    }

    function beginTenSecondDiceDuel() {
      gameState = "OPENING_DUEL";
      renderStageQuestionBoard();
      p1RollVal = null;
      p2RollVal = null;
      isDiceRollingP1 = true;
      isDiceRollingP2 = true;
      isPawnMoving = false;
      hasPlayerRolledThisTurn = false;

      broadcastMicState("goody-contestant-1", false);
      broadcastMicState("goody-contestant-2", false);

      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "START_DICE_COUNTDOWN" });
      });

      startDiceCountdown(() => {
        if (gameState === "OPENING_DUEL") {
          if (p1RollVal === null) p1RollVal = Math.floor(Math.random() * 6) + 1;
          if (!isSoloMode && p2RollVal === null) p2RollVal = Math.floor(Math.random() * 6) + 1;
          isDiceRollingP1 = false;
          isDiceRollingP2 = false;
          renderStageQuestionBoard();
          renderBackstageScreens();
          setTimeout(finalizeDiceDuel, 1200);
        }
      });
    }

    function handlePlayerRoll(contestant, name, roll) {
      if (gameState === "OPENING_DUEL") {
        if (contestant === "goody-contestant-2") {
          if (p2RollVal !== null) return;
          p2RollVal = roll; isDiceRollingP2 = false;
        } else {
          if (p1RollVal !== null) return;
          p1RollVal = roll; isDiceRollingP1 = false;
        }
        playTone(587, 'sine', 0.15, 0.08);
        renderStageQuestionBoard();
        renderBackstageScreens();

        if ((isSoloMode && p1RollVal !== null) || (p1RollVal !== null && p2RollVal !== null)) {
          stopDiceCountdown();
          setTimeout(finalizeDiceDuel, 1200);
        }
      } else if (gameState === "IN_PLAY") {
        if (contestant !== activePlayer || hasPlayerRolledThisTurn || isPawnMoving) {
          if (contestant === "goody-contestant-2") isDiceRollingP2 = false;
          else isDiceRollingP1 = false;
          return;
        }
        stopDiceCountdown();
        hasPlayerRolledThisTurn = true;
        isPawnMoving = true;
       
        if (contestant === "goody-contestant-2") {
          p2RollVal = roll; isDiceRollingP2 = false;
        } else {
          p1RollVal = roll; isDiceRollingP1 = false;
        }
        playTone(587, 'sine', 0.15, 0.08);
        renderStageQuestionBoard();
        renderBackstageScreens();

        setTimeout(() => {
          const speech = contestant === goodyPlayerSlot
            ? `I rolled a ${roll}! Moving forwards ${roll} spaces!`
            : `${name} rolled a ${roll}! Moving ${roll} spaces.`;

          speakGoody(speech, () => {
            advanceTurnPlayer(contestant, roll);
          });
        }, 1200);
      }
    }

    function startTwentyMinuteMatchTimer() {
      if (matchTimerInterval) clearInterval(matchTimerInterval);
      matchTimerInterval = setInterval(() => {
        if (gameState !== "IN_PLAY") return;
        matchTimerSeconds--;

        const mins = Math.max(0, Math.floor(matchTimerSeconds / 60)).toString().padStart(2, '0');
        const secs = Math.max(0, (matchTimerSeconds % 60)).toString().padStart(2, '0');
        const timeStr = `${mins}:${secs}`;
       
        gameClockValEl.textContent = timeStr;
        renderWallClockTexture(timeStr);

        connectedDataConns.forEach(c => {
          if (c.open) c.send({ type: "SYNC_MATCH_TIMER", timeStr: timeStr, secondsLeft: matchTimerSeconds });
        });

        if (matchTimerSeconds <= 0) {
          clearInterval(matchTimerInterval);
          isTimeExpired = true;
          if (!activeQuestion && !activeRecap && !isTieBreakerActive) {
            evaluateFinalShowdown();
          }
        }
      }, 1000);
    }

    function finalizeDiceDuel() {
      if (p1RollVal === null) p1RollVal = Math.floor(Math.random() * 6) + 1;
      if (!isSoloMode && p2RollVal === null) p2RollVal = Math.floor(Math.random() * 6) + 1;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;

      if (!isSoloMode && p1RollVal === p2RollVal) {
        const tieVal = p1RollVal;
        const speech = `Both contestants rolled a ${tieVal}! It's a dead heat tie! We must re-roll to decide who goes first! You have 10 seconds to roll your dice!`;
        speakGoody(speech, () => {
          p1RollVal = null;
          p2RollVal = null;
          beginTenSecondDiceDuel();
        });
        return;
      }

      const winnerNum = isSoloMode ? 1 : (p1RollVal > p2RollVal ? 1 : 2);
      activePlayer = winnerNum === 1 ? "goody-contestant-1" : "goody-contestant-2";
      const finalWinningRoll = winnerNum === 1 ? p1RollVal : p2RollVal;

      gameState = "IN_PLAY";
      hasPlayerRolledThisTurn = false;
      isPawnMoving = true;
      renderStageQuestionBoard();
      renderBackstageScreens();
      startTwentyMinuteMatchTimer();
      broadcastBoardState();

      const pName = contestantNames[activePlayer];
      speakGoody(`${pName} wins the opening roll with a ${finalWinningRoll}! The 20-minute show clock has begun! Moving ${finalWinningRoll} spaces.`, () => {
        advanceTurnPlayer(activePlayer, finalWinningRoll);
      });
    }

    function animatePawnHop(pawn, fromIdx, toIdx, offsetX, onComplete, hopDurationMs = 280) {
      if (fromIdx === toIdx) {
        if (onComplete) onComplete();
        return;
      }

      const stepDirection = toIdx > fromIdx ? 1 : -1;
      let currentHopIdx = fromIdx;

      function hopNextStep() {
        if (gameState === "INTERMISSION") {
          isPawnMoving = false;
          return;
        }

        if (currentHopIdx === toIdx) {
          if (onComplete) onComplete();
          return;
        }

        const nextHopIdx = currentHopIdx + stepDirection;
        const startPos = {
          x: boardTileCoords[currentHopIdx].x + offsetX,
          y: 0.52,
          z: boardTileCoords[currentHopIdx].z
        };
        const endPos = {
          x: boardTileCoords[nextHopIdx].x + offsetX,
          y: 0.52,
          z: boardTileCoords[nextHopIdx].z
        };

        const hopStartTime = performance.now();
        playTone(320 + Math.random() * 80, 'sine', 0.06, 0.04);

        function stepFrame(now) {
          if (gameState === "INTERMISSION") {
            isPawnMoving = false;
            return;
          }

          const elapsed = now - hopStartTime;
          const progress = Math.min(1.0, elapsed / hopDurationMs);

          const jumpArc = 4.0 * 0.35 * progress * (1.0 - progress);

          pawn.position.x = startPos.x + (endPos.x - startPos.x) * progress;
          pawn.position.y = 0.52 + jumpArc;
          pawn.position.z = startPos.z + (endPos.z - startPos.z) * progress;

          if (progress < 1.0) {
            requestAnimationFrame(stepFrame);
          } else {
            pawn.position.set(endPos.x, 0.52, endPos.z);
            playTone(220, 'triangle', 0.05, 0.03);
            currentHopIdx = nextHopIdx;
            setTimeout(hopNextStep, 50);
          }
        }

        requestAnimationFrame(stepFrame);
      }

      hopNextStep();
    }

    function advanceTurnPlayer(playerSlot, roll) {
      const isP1 = playerSlot === "goody-contestant-1";
      const oldIdx = isP1 ? p1Index : p2Index;
      const targetIdx = Math.min(boardTileCoords.length - 1, oldIdx + roll);
      const targetPawn = isP1 ? pawn1 : pawn2;
      const xOffset = isP1 ? -0.08 : 0.08;

      if (isP1) p1Index = targetIdx;
      else p2Index = targetIdx;

      animatePawnHop(targetPawn, oldIdx, targetIdx, xOffset, () => {
        isPawnMoving = false;
        broadcastBoardState();

        if (p1Index >= boardTileCoords.length - 1 || p2Index >= boardTileCoords.length - 1) {
          const winName = isP1 ? contestantNames["goody-contestant-1"] : contestantNames["goody-contestant-2"];
          const loseName = isP1 ? contestantNames["goody-contestant-2"] : contestantNames["goody-contestant-1"];
          triggerFinishLineVictory(winName, loseName);
          return;
        }

        const currentTileIdx = isP1 ? p1Index : p2Index;
        const landedCountry = boardTileCoords[currentTileIdx].country;
        const qPool = COUNTRY_QUESTIONS[landedCountry] || COUNTRY_QUESTIONS["UK"];
        const rawQ = qPool[Math.floor(Math.random() * qPool.length)];
       
        activeQuestion = {
          country: landedCountry,
          text: rawQ.q,
          q: rawQ.q,
          options: rawQ.options,
          ans: rawQ.ans,
          recap: rawQ.recap
        };
        activeRecap = null;
        stageSelectedOption = null;
        stageOptionStatus = null;

        stopDiceCountdown();
        if (questionInterval) clearInterval(questionInterval);
        isQuestionTimerActive = false;
        questionTimer = 0;

        const activeName = contestantNames[activePlayer];

        connectedDataConns.forEach(c => {
          if (c.open) c.send({
            type: "SHOW_QUESTION_LOCKED",
            question: activeQuestion,
            activeContestantId: activePlayer,
            activeContestantName: activeName
          });
        });
        renderStageQuestionBoard();

        const speech = activePlayer === goodyPlayerSlot
          ? `I landed on ${landedCountry}! Here is my question: ${activeQuestion.q}... Let me process this in my circuits!`
          : `${activeName} landed on ${landedCountry}! Here is your question: ${activeQuestion.q}... You have 30 seconds to lock in!`;

        speakGoody(speech, () => {
          if (gameState === "INTERMISSION") return;

          if (activePlayer === goodyPlayerSlot) {
            executeGoodyAnswer();
          } else {
            connectedDataConns.forEach(c => {
              if (c.open) c.send({
                type: "UNLOCK_QUESTION_INPUT",
                activeContestantId: activePlayer,
                activeContestantName: activeName
              });
            });
            broadcastMicState(activePlayer, true, "🎙️ Thinking out loud? Your mic is LIVE!");
            startQuestionCountdown();
          }
        });
      });
    }

    function startQuestionCountdown() {
      questionTimer = 30;
      isQuestionTimerActive = true;
      renderStageQuestionBoard();

      if (questionInterval) clearInterval(questionInterval);
      questionInterval = setInterval(() => {
        if (gameState === "INTERMISSION") {
          clearInterval(questionInterval);
          isQuestionTimerActive = false;
          return;
        }
        questionTimer--;
        renderStageQuestionBoard();
        if (questionTimer <= 0) {
          clearInterval(questionInterval);
          isQuestionTimerActive = false;
          broadcastMicState(activePlayer, false);
          handleQuestionTimeout(activePlayer);
        }
      }, 1000);
    }

    function evaluateAnswer(contestant, chosen) {
      stopDiceCountdown();
      if (questionInterval) clearInterval(questionInterval);
      isQuestionTimerActive = false;
      questionTimer = 0;
      broadcastMicState(contestant, false);
      const isCorrect = chosen === activeQuestion.ans;

      if (contestant !== goodyPlayerSlot) {
        playerStats.asked++;
        if (isCorrect) playerStats.correct++;
      }

      stageOptionStatus = isCorrect ? 'correct' : 'wrong';
      renderStageQuestionBoard();

      connectedDataConns.forEach(c => {
        if (c.open) c.send({
          type: "EVALUATION_RESULT",
          forContestant: contestant,
          chosenAnswer: chosen,
          isCorrect: isCorrect,
          recap: activeQuestion.recap,
          country: activeQuestion.country
        });
      });

      activeRecap = { country: activeQuestion.country, text: activeQuestion.recap, isCorrect };
      activeQuestion = null;
      renderStageQuestionBoard();

      const isGoody = contestant === goodyPlayerSlot;
      if (isCorrect) {
        const speech = isGoody
          ? `My circuits calculated correctly! That is correct! Here is what we learned: ${activeRecap.text}`
          : `Well done, that's correct! Here is what we learned: ${activeRecap.text}`;

        speakGoody(speech, () => {
          transitionToRulesAndNextTurn();
        });
      } else {
        const speech = isGoody
          ? `Oh no! A system malfunction in my memory bank! I got it wrong! I must go back to the start! Here is what we learned: ${activeRecap.text}`
          : `Unlucky, that's incorrect. You must go back to the start! Here is what we learned: ${activeRecap.text}`;

        speakGoody(speech, () => {
          resetPlayerToStart(contestant, () => {
            transitionToRulesAndNextTurn();
          });
        });
      }
    }

    function handleQuestionTimeout(contestant) {
      stopDiceCountdown();
      if (questionInterval) clearInterval(questionInterval);
      isQuestionTimerActive = false;
      questionTimer = 0;
      broadcastMicState(contestant, false);

      if (contestant !== goodyPlayerSlot) {
        playerStats.asked++;
      }

      stageOptionStatus = 'wrong';
      renderStageQuestionBoard();

      connectedDataConns.forEach(c => {
        if (c.open) c.send({
          type: "EVALUATION_RESULT",
          forContestant: contestant,
          chosenAnswer: null,
          isCorrect: false,
          recap: activeQuestion.recap,
          country: activeQuestion.country
        });
      });

      activeRecap = { country: activeQuestion.country, text: activeQuestion.recap, isCorrect: false };
      activeQuestion = null;
      renderStageQuestionBoard();

      speakGoody(`I'm sorry, you ran out of time! You must go back to the start! Here is what we learned: ${activeRecap.text}`, () => {
        resetPlayerToStart(contestant, () => {
          transitionToRulesAndNextTurn();
        });
      });
    }

    function transitionToRulesAndNextTurn() {
      stopDiceCountdown();
      activeRecap = null;
      activeQuestion = null;
      isQuestionTimerActive = false;
      questionTimer = 0;
      renderStageQuestionBoard();

      if (isTimeExpired) {
        setTimeout(() => evaluateFinalShowdown(), 2000);
        return;
      }

      setTimeout(() => {
        nextTurn();
      }, 1000);
    }

    function resetPlayerToStart(contestant, onComplete) {
      const isP1 = contestant === "goody-contestant-1";
      const startFromIdx = isP1 ? p1Index : p2Index;
      const pawnToMove = isP1 ? pawn1 : pawn2;
      const xOffset = isP1 ? -0.08 : 0.08;

      if (isP1) p1Index = 0;
      else p2Index = 0;

      animatePawnHop(pawnToMove, startFromIdx, 0, xOffset, () => {
        broadcastBoardState();
        if (onComplete) onComplete();
      }, 110);
    }

    function nextTurn() {
      if (gameState !== "IN_PLAY") return;

      stopDiceCountdown();

      if (isSoloMode) {
        activePlayer = soloPlayerId;
      } else {
        activePlayer = activePlayer === "goody-contestant-1" ? "goody-contestant-2" : "goody-contestant-1";
      }

      const pName = contestantNames[activePlayer];

      activeQuestion = null;
      activeRecap = null;
      stageSelectedOption = null;
      stageOptionStatus = null;
      p1RollVal = null;
      p2RollVal = null;
      hasPlayerRolledThisTurn = false;
      isPawnMoving = false;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;

      if (questionInterval) clearInterval(questionInterval);
      isQuestionTimerActive = false;
      questionTimer = 0;
      renderStageQuestionBoard();
      renderBackstageScreens();

      if (activePlayer === goodyPlayerSlot) {
        speakGoody(`It is my turn! Goody is rolling the dice!`, () => {
          setTimeout(executeGoodyTurnRoll, 1000);
        });
      } else {
        speakGoody(`It is now ${pName}'s turn! You have 10 seconds to roll your dice!`, () => {
          if (gameState === "IN_PLAY" && activePlayer === (isSoloMode ? soloPlayerId : activePlayer) && !hasPlayerRolledThisTurn && !isPawnMoving) {
            startTurnDicePrompt(activePlayer, pName);
          }
        });
      }
    }

    function evaluateFinalShowdown() {
      stopDiceCountdown();
      if (questionInterval) clearInterval(questionInterval);
      isQuestionTimerActive = false;
      questionTimer = 0;
      broadcastMicState("goody-contestant-1", false);
      broadcastMicState("goody-contestant-2", false);

      if (isSoloMode) {
        gameState = "GAME_OVER";
        const soloName = contestantNames[soloPlayerId];
        const speech = `The 20-minute timer has expired! Unfortunately, ${soloName} was unable to complete the board in time! Tonight's prize rolls over. Goodnight everyone!`;
        speakGoody(speech);
        broadcastGameOver("NOBODY", "SOLO_TIME_EXPIRED");
        return;
      }

      if (p1Index === 0 && p2Index === 0) {
        gameState = "GAME_OVER";
        const speech = "The 20-minute show timer has run out, and both contestants are still on the starting square! Nobody wins tonight. Goodnight everyone!";
        speakGoody(speech);
        broadcastGameOver("NOBODY", "ROLLOVER_START_SQUARE");
        return;
      }

      if (p1Index === p2Index) {
        triggerTieBreakerDuel();
        return;
      }

      gameState = "GAME_OVER";
      const winner = p1Index > p2Index ? contestantNames["goody-contestant-1"] : contestantNames["goody-contestant-2"];
      const loser = p1Index > p2Index ? contestantNames["goody-contestant-2"] : contestantNames["goody-contestant-1"];

      const speech = `The 20-minute timer is over! Well done to our winner ${winner}, and commiserations to ${loser}! Goodnight!`;
      speakGoody(speech);
      broadcastGameOver(winner, "TIME_EXPIRED_LEADER");
    }
   
    function triggerTieBreakerDuel() {
      isTieBreakerActive = true;
      tieBreakerAnswered = false;

      const tiePool = COUNTRY_QUESTIONS["UK"];
      const rawQ = tiePool[Math.floor(Math.random() * tiePool.length)];
      activeQuestion = {
        country: "TIE-BREAKER",
        text: rawQ.q,
        q: rawQ.q,
        options: rawQ.options,
        ans: rawQ.ans,
        recap: rawQ.recap
      };

      stageSelectedOption = null;
      stageOptionStatus = null;
      renderStageQuestionBoard();

      speakGoody("We have a dead heat draw! Both contestants finished on the exact same tile! We are going to a sudden death tie-breaker question!", () => {
        connectedDataConns.forEach(c => {
          if (c.open) c.send({
            type: "START_TIE_BREAKER",
            question: activeQuestion
          });
        });

        if (isVsGoodyMode) {
          setTimeout(() => {
            if (!tieBreakerAnswered) {
              handleTieBreakerAnswer(goodyPlayerSlot, activeQuestion.ans);
            }
          }, 8000 + Math.random() * 4000);
        }
      });
    }

    function handleTieBreakerAnswer(contestant, chosen) {
      if (tieBreakerAnswered) return;
      tieBreakerAnswered = true;
      isTieBreakerActive = false;

      const isP1 = contestant === "goody-contestant-1";
      const answeringName = isP1 ? contestantNames["goody-contestant-1"] : contestantNames["goody-contestant-2"];
      const opponentName = isP1 ? contestantNames["goody-contestant-2"] : contestantNames["goody-contestant-1"];
      const isCorrect = chosen === activeQuestion.ans;

      stageSelectedOption = chosen;
      stageOptionStatus = isCorrect ? 'correct' : 'wrong';
      renderStageQuestionBoard();

      gameState = "GAME_OVER";
      const winner = isCorrect ? answeringName : opponentName;
      const loser = isCorrect ? opponentName : answeringName;

      connectedDataConns.forEach(c => {
        if (c.open) c.send({
          type: "TIE_BREAKER_RESULT",
          winner: winner,
          loser: loser,
          isCorrect: isCorrect,
          chosenAnswer: chosen,
          ans: activeQuestion.ans
        });
      });

      const speech = isCorrect
        ? `That is correct! Well done to our winner ${winner}! Goodnight!`
        : `That is incorrect! By default, well done to our winner ${winner}! Goodnight!`;

      speakGoody(speech);
      broadcastGameOver(winner, "TIE_BREAKER_DECISION");
    }

    function triggerFinishLineVictory(winnerName, loserName) {
      gameState = "GAME_OVER";
      if (matchTimerInterval) clearInterval(matchTimerInterval);
      if (questionInterval) clearInterval(questionInterval);
      stopDiceCountdown();
      isQuestionTimerActive = false;
      questionTimer = 0;
      broadcastMicState("goody-contestant-1", false);
      broadcastMicState("goody-contestant-2", false);

      const speech = isSoloMode
        ? `Unbelievable! ${winnerName} has reached the final square and completed the solo challenge! Well done! Goodnight!`
        : `Unbelievable! ${winnerName} has reached the final square! Well done to our winner ${winnerName}, and commiserations to ${loserName}! Goodnight!`;

      speakGoody(speech);
      broadcastGameOver(winnerName, "REACHED_THE_END");
    }

    function broadcastGameOver(winnerName, reason) {
      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "GAME_OVER", winner: winnerName, reason: reason });
      });
    }

    const ambientLight = new THREE.AmbientLight(0x181026, 0.85); scene.add(ambientLight);
    const ceilingLight = new THREE.PointLight(0xffecd2, 1.0, 50); ceilingLight.position.set(0, 13.5, 0); scene.add(ceilingLight);
    const deskLampLight = new THREE.PointLight(0xffea9f, 0, 20); deskLampLight.position.set(-6.5, 7.8, -4.5); scene.add(deskLampLight);

    const hostSpotlight = new THREE.SpotLight(0xffffff, 0, 16, Math.PI / 4.5, 0.25, 1.2);
    hostSpotlight.position.set(0, 10.5, -11.6);
    const hostSpotTarget = new THREE.Object3D();
    hostSpotTarget.position.set(0, 4.5, -11.6);
    scene.add(hostSpotTarget);
    hostSpotlight.target = hostSpotTarget;
    scene.add(hostSpotlight);

    const trussGroup = new THREE.Group();
    trussGroup.position.set(0, 8.4, -9.8);
    const trussMat = new THREE.MeshBasicMaterial({ color: 0x3d3d4e });
    const trussArch = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.08, 6, 16, Math.PI), trussMat);
    trussArch.rotation.x = Math.PI / 2;
    trussGroup.add(trussArch);

    function createDownFacingSpotlight(colorHex, x, y, z) {
      const fixGroup = new THREE.Group(); fixGroup.position.set(x, y, z);
      const headPivot = new THREE.Group();
      const can = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.55, 12), new THREE.MeshBasicMaterial({ color: 0x15151e }));
      can.rotation.x = Math.PI / 2; headPivot.add(can);
      const lens = new THREE.Mesh(new THREE.CircleGeometry(0.19, 12), new THREE.MeshBasicMaterial({ color: 0x050505 }));
      lens.position.set(0, 0, 0.28); headPivot.add(lens);
      const spot = new THREE.SpotLight(colorHex, 0, 18, Math.PI / 3.4, 0.35);
      spot.position.set(0, 0, 0.28); headPivot.add(spot);
      const targetObj = new THREE.Object3D(); targetObj.position.set(x * 0.4, -4.5, -0.8);
      scene.add(targetObj); spot.target = targetObj;
      headPivot.rotation.x = Math.PI * 0.35;
      fixGroup.add(headPivot); trussGroup.add(fixGroup);
      return { spot, lens, color: colorHex, target: targetObj };
    }
    const fixtureCyan = createDownFacingSpotlight(0x00f0ff, -2.4, 0.0, 0.2);
    const fixtureGold = createDownFacingSpotlight(0xffea00, 0.0, 0.2, -0.1);
    const fixtureMagenta = createDownFacingSpotlight(0xff007f, 2.4, 0.0, 0.2);
    scene.add(trussGroup);

    function updateStudioLighting(power) {
      const val = power ? 5.0 : 0;
      deskLampLight.intensity = power ? 2.5 : 0;
      hostSpotlight.intensity = power ? 9.0 : 0;
      fixtureCyan.spot.intensity = val;
      fixtureGold.spot.intensity = val;
      fixtureMagenta.spot.intensity = val;

          ctx.fillStyle = '#FEDD00';

          ctx.fillStyle = '#012169'; ctx.beginPath(); ctx.arc(64, 64, 26, 0, Math.PI * 2); ctx.fill();

          ctx.fillStyle = '#FECC00';
          ctx.fillRect(38, 0, 18, h); ctx.fillRect(0, 55, w, 18);

          ctx.fillStyle = '#FFFFFF'; ctx.fillRect(w / 3, 0, w / 3, h);
          ctx.fillStyle = '#CE2B37'; ctx.fillRect((w / 3) * 2, 0, w / 3, h);
          break;
        case "Denmark":

          ctx.fillStyle = '#F1BF00'; ctx.fillRect(0, h * 0.25, w, h * 0.5);

          ctx.fillStyle = '#FFCE00'; ctx.fillRect(0, (h / 3) * 2, w, h / 3);

        case "UK":

    function drawStudioDie(ctx, cx, cy, size, value, glowColor = '#00f0ff', rotationAngle = 0) {
      ctx.save();
      ctx.translate(cx, cy);
      if (rotationAngle !== 0) ctx.rotate(rotationAngle);

      const half = size / 2;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-half, -half, size, size);

      ctx.strokeStyle = glowColor;
      ctx.lineWidth = 3.5;
      ctx.strokeRect(-half, -half, size, size);

      ctx.fillStyle = '#e74c3c';
      const r = size * 0.085;
      const p = size * 0.26;

      const pip = (px, py) => {
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      };

      if (value % 2 === 1) pip(0, 0);
      if (value >= 2) { pip(-p, -p); pip(p, p); }
      if (value >= 4) { pip(p, -p); pip(-p, p); }
      if (value === 6) { pip(-p, 0); pip(p, 0); }

      ctx.restore();
    }

          qBoardCtx.font = 'bold 16px monospace';
          qBoardCtx.fillText("[2] 1-PLAYER VS GOODY", 256, 195);

          qBoardCtx.fillStyle = '#9b59b6';
          qBoardCtx.fillRect(40, 221, 432, 42);
          qBoardCtx.fillStyle = '#ffffff';
          qBoardCtx.font = 'bold 16px monospace';
          qBoardCtx.fillText("[3] 2-PLAYER MODE", 256, 248);
        }
      } else if (gameState === "OPENING_DUEL") {
        qBoardCtx.fillStyle = '#ffda66';
        qBoardCtx.font = 'bold 22px sans-serif';
        qBoardCtx.textAlign = 'center';
        qBoardCtx.fillText("OPENING DICE ROLL", 256, 40);

        const valP1 = p1RollVal || 1;
        const valP2 = p2RollVal || 1;

        if (isSoloMode) {
          drawStudioDie(qBoardCtx, 208, 130, 96, valP1, '#00f0ff');
          qBoardCtx.fillStyle = '#39ff14';
          qBoardCtx.font = 'bold 18px monospace';
          qBoardCtx.textAlign = 'center';
          qBoardCtx.fillText(`LOCKED IN: ${p1RollVal || '...'}`, 256, 260);
        } else {
          drawStudioDie(qBoardCtx, 120, 130, 82, valP1, '#00d2d3');
          drawStudioDie(qBoardCtx, 310, 130, 82, valP2, '#ff3838');
          qBoardCtx.fillStyle = '#ffda66';
          qBoardCtx.font = 'bold 18px monospace';
          qBoardCtx.fillText("VS", 256, 170);
        }

        qBoardCtx.fillStyle = '#39ff14';
        qBoardCtx.font = 'bold 16px monospace';
        qBoardCtx.textAlign = 'center';
        qBoardCtx.fillText("[ TAP SCREEN TO STOP DICE ]", 256, 325);

      } else if (activeRecap) {
        qBoardCtx.fillStyle = activeRecap.isCorrect ? '#00b894' : '#ff7675';
        qBoardCtx.font = 'bold 22px sans-serif';
        qBoardCtx.textAlign = 'center';
        qBoardCtx.fillText(activeRecap.isCorrect ? " CORRECT!" : " INCORRECT!", 256, 50);

        qBoardCtx.fillStyle = '#ffffff';
        qBoardCtx.font = '16px sans-serif';
        qBoardCtx.fillText(activeRecap.text.substring(0, 75) + "...", 256, 140);
      } else if (activeQuestion) {
        qBoardCtx.fillStyle = '#ffda66';
        qBoardCtx.font = 'bold 18px monospace';
        qBoardCtx.textAlign = 'left';
        qBoardCtx.fillText(` ${activeQuestion.country.toUpperCase()} QUESTION`, 20, 36);

        qBoardCtx.fillStyle = '#ffffff';
        qBoardCtx.font = '15px sans-serif';
        qBoardCtx.fillText(activeQuestion.q.substring(0, 65) + "...", 20, 85);

        activeQuestion.options.forEach((opt, idx) => {
          const optY = 150 + (idx * 50);
          qBoardCtx.fillStyle = '#220f3d';
          qBoardCtx.fillRect(20, optY, 472, 40);
          qBoardCtx.strokeStyle = '#a29bfe';
          qBoardCtx.strokeRect(20, optY, 472, 40);

          qBoardCtx.fillStyle = '#ffffff';
          qBoardCtx.font = '14px sans-serif';
          qBoardCtx.fillText(opt.substring(0, 50), 32, optY + 25);
        });
      } else {
        qBoardCtx.fillStyle = '#ffda66';
        qBoardCtx.font = 'bold 22px sans-serif';
        qBoardCtx.textAlign = 'center';
        qBoardCtx.fillText("THE GOODY TONIGHT SHOW", 256, 110);
      }
      qBoardTex.needsUpdate = true;
    }
    renderStageQuestionBoard();

    const qBoardMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(3.6, 2.7),
      new THREE.MeshBasicMaterial({ map: qBoardTex })
    );
    qBoardMesh.position.set(-4.8, 3.4, -3.2);
    qBoardMesh.rotation.y = 0.8;
    miniDiorama.add(qBoardMesh);

    const screenClickMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(3.6, 2.7),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 })
    );
    screenClickMesh.position.copy(qBoardMesh.position);
    screenClickMesh.rotation.copy(qBoardMesh.rotation);
    miniDiorama.add(screenClickMesh);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function triggerRollAction() {
      if (gameState === "OPENING_DUEL") {
        if (isSoloMode) {
          if (p1RollVal === null) handlePlayerRoll("goody-contestant-1", contestantNames["goody-contestant-1"], Math.floor(Math.random() * 6) + 1);
        } else {
          if (p1RollVal === null) handlePlayerRoll("goody-contestant-1", contestantNames["goody-contestant-1"], Math.floor(Math.random() * 6) + 1);
          if (p2RollVal === null) handlePlayerRoll("goody-contestant-2", contestantNames["goody-contestant-2"], Math.floor(Math.random() * 6) + 1);
        }
      } else if (gameState === "IN_PLAY") {
        const isAllowedPlayer = isSoloMode ? (activePlayer === soloPlayerId) : (activePlayer !== goodyPlayerSlot);
        if (!hasPlayerRolledThisTurn && isAllowedPlayer && !isPawnMoving && !activeQuestion && !activeRecap) {
          const rollVal = Math.floor(Math.random() * 6) + 1;
          handlePlayerRoll(activePlayer, contestantNames[activePlayer], rollVal);
        }
      }
    }

    function handleScreenTap(clientX, clientY) {
      if (!isHostAuthorized) return;
      initAudio();

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(screenClickMesh, false);

      if (intersects.length > 0) {
        if (gameState === "CONTESTANT_CHOOSING") {
          triggerOnePlayerMode();
          return;
        }

        if (gameState === "MODE_PROMPT" && (isLocalOnPodium1 || isLocalOnPodium2 || isP1Connected)) {
          chooseHostGameMode("SOLO");
          return;
        }

        if (activeQuestion) {
          const hit = intersects[0];
          const uv = hit.uv;
          if (uv && uv.y < 0.6) {
            const optIdx = Math.floor((0.6 - uv.y) / 0.15);
            if (optIdx >= 0 && optIdx < activeQuestion.options.length) {
              const chosenOpt = activeQuestion.options[optIdx];
              stageSelectedOption = chosenOpt;
              stageOptionStatus = 'selected';
              renderStageQuestionBoard();

              setTimeout(() => {
                evaluateAnswer(activePlayer, chosenOpt);
              }, 800);
              return;
            }
          }
        }

        triggerRollAction();
      }
    }

    window.addEventListener('pointerup', (e) => {
      handleScreenTap(e.clientX, e.clientY);
    });

    const moveState = { forward: false, backward: false, turnLeft: false, turnRight: false };
    const plushiePosition = new THREE.Vector3(32.0, 0.44, 2.5);
    const plushieRotation = { yaw: 0 };
    const plushieVelocity = new THREE.Vector3(0, 0, 0);

    function createCutePlushie(color, initialName = "") {
      const pGroup = new THREE.Group();
      const pMat = new THREE.MeshBasicMaterial({ color: color });
      const pBody = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), pMat); pBody.position.y = 0.28; pGroup.add(pBody);
      const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), pMat); pHead.position.y = 0.58; pGroup.add(pHead);
      const ear1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), pMat); ear1.position.set(-0.14, 0.74, 0);
      const ear2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), pMat); ear2.position.set(0.14, 0.74, 0); pGroup.add(ear1, ear2);

      let badgeMesh = null;
      let bCanvas = null;
      let bTex = null;

      if (initialName) {
        bCanvas = document.createElement('canvas');
        bCanvas.width = 128; bCanvas.height = 48;
        bTex = new THREE.CanvasTexture(bCanvas);
        const badgeMat = new THREE.MeshBasicMaterial({
          map: bTex, transparent: true, side: THREE.DoubleSide, depthWrite: false
        });
        badgeMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.185), badgeMat);
        badgeMesh.position.set(0, 0.95, 0);
        miniDiorama.add(badgeMesh);
        updatePlushieNameBadge(pGroup, initialName);
      }
     
      pGroup.userData = {
        badgeCanvas: bCanvas, badgeTexture: bTex, badgeMesh: badgeMesh
      };
      return pGroup;
    }

    function setPlushieVisualMode(group, mode) {
      if (!group) return;
      if (mode === 'invisible') {
        group.visible = false;
        return;
      }
      group.visible = true;
      const isOpaque = (mode === 'opaque');
      group.traverse(child => {
        if (child.isMesh && child.material && child !== group.userData.badgeMesh) {
          child.material.transparent = !isOpaque;
          child.material.opacity = isOpaque ? 1.0 : 0.45;
          child.material.depthWrite = isOpaque;
        }
      });
    }

    let assignedTeam = 'BLUE';
    let teamColorHex = '#00f0ff';
    let plushieColorHex = 0x00f0ff;
    let localPlushie = null;

    localPlushie = createCutePlushie(plushieColorHex, localMyGuestName);
    localPlushie.userData.team = assignedTeam;
    updatePlushieNameBadge(localPlushie, localMyGuestName, teamColorHex);
   
    localPlushie.position.copy(plushiePosition);
    miniDiorama.add(localPlushie);
    setPlushieVisualMode(localPlushie, 'opaque');

    document.addEventListener('keydown', (e) => {
      if (!isHostAuthorized) return;
      if (e.code === 'KeyW') moveState.forward = true;
      if (e.code === 'KeyS') moveState.backward = true;
      if (e.code === 'KeyA') moveState.turnLeft = true;
      if (e.code === 'KeyD') moveState.turnRight = true;

      if (gameState === "MODE_PROMPT" && (isLocalOnPodium1 || isLocalOnPodium2 || isP1Connected)) {
        if (e.key === '1') chooseHostGameMode("SOLO");
        if (e.key === '2') chooseHostGameMode("GOODY");
        if (e.key === '3') chooseHostGameMode("TWOPLAYER");
      }
    });

    document.addEventListener('keyup', (e) => {
      if (!isHostAuthorized) return;
      if (e.code === 'KeyW') moveState.forward = false;
      if (e.code === 'KeyS') moveState.backward = false;
      if (e.code === 'KeyA') moveState.turnLeft = false;
      if (e.code === 'KeyD') moveState.turnRight = false;
    });

    const playerPlushie1 = createCutePlushie(0xff7675, "");
    playerPlushie1.position.set(-3.0, 0.46, 1.2);
    miniDiorama.add(playerPlushie1);

    const playerPlushie2 = createCutePlushie(0x74b9ff, "");
    playerPlushie2.position.set(3.0, 0.46, 1.2);
    miniDiorama.add(playerPlushie2);

    function handlePlushieMovement(contestant, direction) {
      const targetPlushie = contestant === "goody-contestant-2" ? playerPlushie2 : playerPlushie1;
      if (!targetPlushie) return;

      const rot = contestantRotations[contestant] ? contestantRotations[contestant].yaw : 0;
      const step = 0.35;

      const fwdX = -Math.sin(rot);
      const fwdZ = -Math.cos(rot);

      if (direction === 'FORWARD') {
        targetPlushie.position.x += fwdX * step;
        targetPlushie.position.z += fwdZ * step;
      }
      if (direction === 'BACK') {
        targetPlushie.position.x -= fwdX * step;
        targetPlushie.position.z -= fwdZ * step;
      }
    }

    const studioScreenCanvas = document.createElement('canvas'); studioScreenCanvas.width = 256; studioScreenCanvas.height = 128;
    const sScreenCtx = studioScreenCanvas.getContext('2d');
    const studioScreenTex = new THREE.CanvasTexture(studioScreenCanvas);

    function renderBackstageScreens() {
      sScreenCtx.fillStyle = '#060210'; sScreenCtx.fillRect(0, 0, 256, 128);
      if (studioPower) {
        sScreenCtx.fillStyle = '#1b2a47';
        sScreenCtx.fillRect(10, 10, 110, 108);
        sScreenCtx.fillStyle = '#39ff14';
        sScreenCtx.font = 'bold 12px monospace';
        sScreenCtx.fillText(contestantNames["goody-contestant-1"].toUpperCase(), 16, 32);

        sScreenCtx.fillStyle = '#3d1b38';
        sScreenCtx.fillRect(136, 10, 110, 108);
        sScreenCtx.fillStyle = '#ff79b0';
        sScreenCtx.fillText(contestantNames["goody-contestant-2"].toUpperCase(), 142, 32);
      }
      studioScreenTex.needsUpdate = true;
    }

    const studioBackScreenMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.8), new THREE.MeshBasicMaterial({ map: studioScreenTex }));
    studioBackScreenMesh.position.set(0, 3.4, -4.5); miniDiorama.add(studioBackScreenMesh);

    const miniGoody = new THREE.Group();
    const gPodium = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.6, 12), new THREE.MeshBasicMaterial({ color: 0x2b154a }));
    gPodium.position.y = 0.74; miniGoody.add(gPodium);

    const gBody = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.4), new THREE.MeshBasicMaterial({ color: 0xcccccc }));
    gBody.position.y = 1.34; miniGoody.add(gBody);

    miniGoody.position.set(0, 0, -2.6);
    miniDiorama.add(miniGoody);

    function createStudioRoboticCamera(x, z) {
      const camRig = new THREE.Group(); camRig.position.set(x, 0.44, z);
      const darkMat = new THREE.MeshBasicMaterial({ color: 0x1f1f26 });
      const basePlate = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 0.08, 8), darkMat); basePlate.position.y = 0.04; camRig.add(basePlate);
      const cameraBox = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.24, 0.42), darkMat); cameraBox.position.y = 1.0; camRig.add(cameraBox);
      miniDiorama.add(camRig);
      return { camRig };
    }
    createStudioRoboticCamera(-2.4, 0.3);
    createStudioRoboticCamera(2.4, 0.3);

    function updateCameraAlignment() {}
    scene.add(miniDiorama);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let prevTime = performance.now();
    let lastBallSyncTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.1);

      if (moveState.turnLeft) plushieRotation.yaw += 2.2 * delta;
      if (moveState.turnRight) plushieRotation.yaw -= 2.2 * delta;

      const moveSpeed = 4.2 * delta;
      if (moveState.forward) {
        plushieVelocity.x += -Math.sin(plushieRotation.yaw) * moveSpeed * 5.0;
        plushieVelocity.z += -Math.cos(plushieRotation.yaw) * moveSpeed * 5.0;
      }
      if (moveState.backward) {
        plushieVelocity.x -= -Math.sin(plushieRotation.yaw) * moveSpeed * 5.0;
        plushieVelocity.z -= -Math.cos(plushieRotation.yaw) * moveSpeed * 5.0;
      }

      plushieVelocity.multiplyScalar(0.90);
      plushiePosition.addScaledVector(plushieVelocity, delta);

      plushiePosition.x = Math.max(-6.5, Math.min(54.0, plushiePosition.x));
      plushiePosition.z = Math.max(-13.5, Math.min(13.5, plushiePosition.z));
     
      const inPitchArena = plushiePosition.x > 10.0;
      if (inPitchArena) {
        const ballPos = ballMesh.position;
        const plushXZ = new THREE.Vector3(plushiePosition.x, 0, plushiePosition.z);
        const ballXZ = new THREE.Vector3(ballPos.x, 0, ballPos.z);
        const distToBall = plushXZ.distanceTo(ballXZ);

        if (isBallPhysicsHost) {
          if (distToBall < 0.78) {
            const pushDir = new THREE.Vector3().subVectors(ballXZ, plushXZ).normalize();
            ballVelocity.addScaledVector(pushDir, 13.0);
            playTone(600, 'triangle', 0.08, 0.1);
          }

          ballPos.addScaledVector(ballVelocity, delta);
          ballVelocity.multiplyScalar(0.96);

          if (ballPos.z > 11.7) { ballPos.z = 11.7; ballVelocity.z *= -0.8; }
          if (ballPos.z < -11.7) { ballPos.z = -11.7; ballVelocity.z *= -0.8; }

          if (ballPos.x < 16.2 && ballPos.z > -2.5 && ballPos.z < 2.5) {
            redScore++;
            renderPitchScoreboard(blueScore, redScore);
            ballMesh.position.set(34.0, 0.82, 0.0);
            ballVelocity.set(0, 0, 0);
          } else if (ballPos.x > 51.8 && ballPos.z > -2.5 && ballPos.z < 2.5) {
            blueScore++;
            renderPitchScoreboard(blueScore, redScore);
            ballMesh.position.set(34.0, 0.82, 0.0);
            ballVelocity.set(0, 0, 0);
          }

          ballPos.x = Math.max(16.3, Math.min(51.7, ballPos.x));

          if (socket && socket.connected && (time - lastBallSyncTime > 40)) {
            lastBallSyncTime = time;
            socket.emit('ball_move', {
              x: ballPos.x, y: ballPos.y, z: ballPos.z,
              vx: ballVelocity.x, vy: ballVelocity.y, vz: ballVelocity.vz
            });
          }
        } else if (hasRemoteBallUpdate) {
          ballMesh.position.lerp(remoteBallTarget, 0.35);
        }
      } else {
        ballMesh.position.set(34.0, 0.82, 0.0);
        ballVelocity.set(0, 0, 0);
        hasRemoteBallUpdate = false;
      }

      if (socket && socket.connected) {
        socket.emit('player_move', {
          name: localMyGuestName,
          x: plushiePosition.x, y: plushiePosition.y, z: plushiePosition.z,
          yaw: plushieRotation.yaw, team: assignedTeam, teamColor: teamColorHex
        });
      }

      const dioramaWorldPos = new THREE.Vector3(0, 3.95, -9);
      const plushieWorldPos = plushiePosition.clone().add(dioramaWorldPos);

      const p1Pos = new THREE.Vector3(-1.6, 0.44, -2.2);
      const p2Pos = new THREE.Vector3(1.6, 0.44, -2.2);

      const distP1 = plushiePosition.distanceTo(p1Pos);
      const distP2 = plushiePosition.distanceTo(p2Pos);

      if (distP1 < 0.65 || distP2 < 0.65) {
        plushiePosition.y = 0.58;
      } else {
        plushiePosition.y = 0.44;
      }

      localPlushie.position.copy(plushiePosition);
      localPlushie.rotation.y = plushieRotation.yaw + Math.PI;

      const camTargetX = plushieWorldPos.x + Math.sin(plushieRotation.yaw) * 3.2;
      const camTargetZ = plushieWorldPos.z + Math.cos(plushieRotation.yaw) * 3.2;
      const camTargetY = plushieWorldPos.y + 1.6;

      const smoothFactor = 1.0 - Math.exp(-12.0 * delta);

      camera.position.x += (camTargetX - camera.position.x) * smoothFactor;
      camera.position.y += (camTargetY - camera.position.y) * smoothFactor;
      camera.position.z += (camTargetZ - camera.position.z) * smoothFactor;

      camera.lookAt(plushieWorldPos.x, plushieWorldPos.y + 0.6, plushieWorldPos.z);

      const prevPodium1 = isLocalOnPodium1;
      const prevPodium2 = isLocalOnPodium2;

      isLocalOnPodium1 = distP1 < 0.65;
      isLocalOnPodium2 = distP2 < 0.65;

      if (isLocalOnPodium1 !== prevPodium1) {
        if (isLocalOnPodium1) {
          if (!studioPower && gameState === "MODE_PROMPT") {
            triggerPodium1PriorityLaunch();
          }
        } else {
          if (!studioPower && gameState === "PODIUM_1_WAIT") {
            cancelPodium1PriorityLaunch();
          }
        }
      }

      if (isLocalOnPodium2 !== prevPodium2) {
        if (isLocalOnPodium2) {
          if (!studioPower) {
            if (gameState === "MODE_PROMPT" || gameState === "PODIUM_1_WAIT") {
              chooseHostGameMode("TWOPLAYER");
            }
          }
        }
      }

      function updatePlushieVisibility(plushieMesh, onP1, onP2) {
        if (!plushieMesh) return;
        const pos = plushieMesh.position;
        const dP1 = pos.distanceTo(p1Pos);
        const dP2 = pos.distanceTo(p2Pos);
        const onPodium1 = dP1 < 0.65;
        const onPodium2 = dP2 < 0.65;

        const inPitch = pos.x > 10.0;
        if (inPitch) {
          setPlushieVisualMode(plushieMesh, 'opaque');
          return;
        }

        const shouldBeSolid = (onPodium1 && (isP1Connected || onP1)) || (onPodium2 && (isP2Connected || onP2));
        setPlushieVisualMode(plushieMesh, shouldBeSolid ? 'opaque' : 'transparent');
      }

      updatePlushieVisibility(localPlushie, isLocalOnPodium1, isLocalOnPodium2);
      updatePlushieVisibility(playerPlushie1, false, false);
      updatePlushieVisibility(playerPlushie2, false, false);

      const camRot = camera.quaternion;
      if (localPlushie && localPlushie.userData && localPlushie.userData.badgeMesh) {
        localPlushie.userData.badgeMesh.position.copy(localPlushie.position).add(new THREE.Vector3(0, 0.95, 0));
        localPlushie.userData.badgeMesh.quaternion.copy(camRot);
      }
      if (pawn1 && pawn1.userData && pawn1.userData.badgeMesh) pawn1.userData.badgeMesh.quaternion.copy(camRot);
      if (pawn2 && pawn2.userData && pawn2.userData.badgeMesh) pawn2.userData.badgeMesh.quaternion.copy(camRot);

      prevTime = time;
      renderer.render(scene, camera);
    }

    const btnUp = document.getElementById('btn-up');
    const btnDown = document.getElementById('btn-down');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const mobileLookZone = document.getElementById('mobile-look-zone');

    function bindTouchButton(elem, stateKey, btnElement) {
      if (!elem) return;
      const activate = (e) => {
        e.preventDefault();
        moveState[stateKey] = true;
        if (btnElement) btnElement.classList.add('active');
      };
      const deactivate = (e) => {
        e.preventDefault();
        moveState[stateKey] = false;
        if (btnElement) btnElement.classList.remove('active');
      };

      elem.addEventListener('touchstart', activate, { passive: false });
      elem.addEventListener('touchend', deactivate, { passive: false });
      elem.addEventListener('touchcancel', deactivate, { passive: false });
      elem.addEventListener('mousedown', activate);
      elem.addEventListener('mouseup', deactivate);
      elem.addEventListener('mouseleave', deactivate);
    }

    bindTouchButton(btnUp, 'forward', btnUp);
    bindTouchButton(btnDown, 'backward', btnDown);
    bindTouchButton(btnLeft, 'turnLeft', btnLeft);
    bindTouchButton(btnRight, 'turnRight', btnRight);

    let lookTouchStartX = null;
    mobileLookZone.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        lookTouchStartX = e.touches[0].clientX;
      }
    }, { passive: true });

    mobileLookZone.addEventListener('touchmove', (e) => {
      if (lookTouchStartX === null || e.touches.length === 0) return;
      const currentX = e.touches[0].clientX;
      const deltaX = currentX - lookTouchStartX;
      plushieRotation.yaw -= deltaX * 0.007;
      lookTouchStartX = currentX;
    }, { passive: true });

    mobileLookZone.addEventListener('touchend', () => {
      lookTouchStartX = null;
    });

    animate();
  </script>
</body>
</html>
