<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Live Studio Host</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #05020a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas3d { width: 100%; height: 100%; display: block; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
      background: rgba(255, 255, 255, 0.85); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      box-shadow: 0 0 8px #00f0ff; transition: transform 0.15s; z-index: 10;
    }
    #crosshair.hover-active { transform: translate(-50%, -50%) scale(2.2); background: #ff69b4; }

    #hud {
      position: absolute; top: 15px; left: 15px; background: rgba(22, 9, 44, 0.9);
      border: 2px solid #ff79b0; border-radius: 12px; padding: 12px 18px; color: #fff;
      font-family: monospace; font-size: 0.85rem; pointer-events: none; z-index: 20;
      box-shadow: 0 0 20px rgba(255, 121, 176, 0.25);
    }
    #room-code-pill { margin-top: 5px; font-weight: bold; color: #39ff14; font-size: 0.95rem; }
    #countdown-pill { margin-top: 6px; font-weight: bold; color: #ffda66; font-size: 0.95rem; }
    #match-clock-hud { margin-top: 4px; font-weight: bold; color: #00f0ff; font-size: 0.95rem; }
    #audience-pill { margin-top: 4px; font-weight: bold; color: #39ff14; }

    #mode-banner {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(22, 9, 44, 0.92); border: 2px solid #00f0ff; border-radius: 10px;
      padding: 10px 20px; color: #ffda66; font-family: monospace; font-size: 0.9rem;
      z-index: 25; text-align: center; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      display: none; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
 
  <div id="hud">
    <div class="hud-title" id="mode-title" style="color: #ffda66;">BEDROOM WORKSHOP</div>
    <div class="hud-sub" id="mode-sub">WebRTC Studio Host: ONLINE • FULL GAME LOOP READY</div>
    <div id="room-code-pill">CODE: <span id="hud-code-val">----</span></div>
    <div id="countdown-pill">BROADCAST STARTS IN: <span id="timer-val" style="color:#ff7675;">10s</span></div>
    <div id="match-clock-hud">SHOW CLOCK: <span id="game-clock-val" style="color:#ffda66;">20:00</span></div>
    <div id="audience-pill">AUDIENCE WATCHING: <span id="audience-count" style="color:#39ff14;">1</span></div>
  </div>

  <div id="mode-banner">
    CURSOR MODE ACTIVE (Press <span style="color:#39ff14;">ESC</span> to re-lock view, or Click screen to interact)
  </div>

  <canvas id="canvas3d"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    // Host is automatically authorized since the PIN gate was removed
    let isHostAuthorized = true;

    const modeBanner = document.getElementById('mode-banner');
    const crosshairEl = document.getElementById('crosshair');

    function unlockHostEnvironment() {
      isHostAuthorized = true;
      initAudio();
      initStudioWebRTC();
      startAutoCountdown();
    }

    window.addEventListener('DOMContentLoaded', () => {
      unlockHostEnvironment();
    });

    const studioRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('hud-code-val').textContent = studioRoomCode;

    let currentMode = 'BEDROOM';
    let studioPower = false;
    let isGoodySpeaking = false;

    let showPlayer1 = false;
    let showPlayer2 = false;

    const videoPlayer1 = document.createElement('video');
    videoPlayer1.autoplay = true; videoPlayer1.playsInline = true; videoPlayer1.muted = false;
    const videoPlayer2 = document.createElement('video');
    videoPlayer2.autoplay = true; videoPlayer2.playsInline = true; videoPlayer2.muted = false;

    let hasLivePlayer1Stream = false;
    let hasLivePlayer2Stream = false;

    let rawPlayer1Stream = null;
    let rawPlayer2Stream = null;

    let gameState = "IDLE";
    let isSoloMode = false;
    let isVsGoodyMode = false;
    let goodyPlayerSlot = null;
    let soloPlayerId = null;

    let diceCountdown = 0;
    let diceInterval = null;
    let p1RollVal = null;
    let p2RollVal = null;
    let isDiceRollingP1 = false;
    let isDiceRollingP2 = false;

    let isPawnMoving = false;
    let hasPlayerRolledThisTurn = false;

    let matchTimerSeconds = 20 * 60;
    let matchTimerInterval = null;
    let isTimeExpired = false;
    let gameClockValEl = document.getElementById('game-clock-val');

    let activePlayer = "goody-contestant-1";
    let activeQuestion = null;
    let activeRecap = null;
    let isTieBreakerActive = false;
    let tieBreakerAnswered = false;

    let questionTimer = 0;
    let isQuestionTimerActive = false;
    let questionInterval = null;
    let stageSelectedOption = null;
    let stageOptionStatus = null;

    let audienceCount = 1;
    const audienceCountEl = document.getElementById('audience-count');
    const countdownPill = document.getElementById('countdown-pill');
    const timerValEl = document.getElementById('timer-val');

    const contestantRotations = {
      "goody-contestant-1": { yaw: 0, pitch: -0.15 },
      "goody-contestant-2": { yaw: 0, pitch: -0.15 }
    };

    const contestantNames = {
      "goody-contestant-1": "Player 1",
      "goody-contestant-2": "Player 2"
    };

    const contestantCities = {
      "goody-contestant-1": "London",
      "goody-contestant-2": "Nottingham"
    };

    const contestantTokens = {
      "goody-contestant-1": null,
      "goody-contestant-2": null
    };

    const playerStats = { asked: 0, correct: 0 };

    let isP1Connected = false;
    let isP2Connected = false;
    let p1PeerId = null;
    let p2PeerId = null;

    let timerExpired = false;
    let droppedOutContestant = null;
    let droppedOutName = "";
    let droppedOutCity = "";
    let droppedOutSessionToken = null;

    let savedTurnPlayer = null;
    let intermissionTimeout = null;
    let savedActiveCountry = null;
    let savedGameState = null;

    let autoStartSeconds = 10;
    let autoStartInterval = null;

    function startAutoCountdown() {
      if (autoStartInterval) return;
      autoStartInterval = setInterval(() => {
        autoStartSeconds--;
        if (autoStartSeconds > 0) {
          timerValEl.textContent = `${autoStartSeconds}s`;
        } else {
          clearInterval(autoStartInterval);
          timerExpired = true;
          triggerStudioModePrompt();
        }
        renderStageQuestionBoard();
      }, 1000);
    }

    function triggerStudioModePrompt() {
      if (studioPower) return;
      gameState = "MODE_PROMPT";
      countdownPill.innerHTML = ` <span style="color:#ffda66;">SELECT GAME MODE</span>`;
      renderStageQuestionBoard();
      speakGoody("The initial standby countdown has elapsed! Studio director, please choose how we begin tonight's broadcast: 1-Player Solo Race, 1-Player versus Goody, or standard 2-Player mode if both podiums are occupied!", () => {
        if (gameState === "MODE_PROMPT") {
          connectedDataConns.forEach(c => {
            if (c.open) c.send({ type: "OFFER_CONTESTANT_CHOICE" });
          });
        }
      });
    }

    function chooseHostGameMode(modeType) {
      if (studioPower) return;
      if (modeType === "SOLO") {
        isSoloMode = true;
        isVsGoodyMode = false;
        soloPlayerId = "goody-contestant-1";
        const soloName = contestantNames[soloPlayerId];
        activePlayer = soloPlayerId;
        p2RollVal = null;
        isDiceRollingP2 = false;
        pawn2.visible = false;
        p2PodiumGroup.visible = false;

        bootStudio();
        const speech = `Welcome to The Goody Tonight Show! We are starting in 1-Player Solo mode with ${soloName}! Let's begin our 20-minute race to tile 32!`;
        speakGoody(speech, () => {
          startTurnCleanly(soloPlayerId);
        });
      } else if (modeType === "GOODY") {
        isSoloMode = false;
        isVsGoodyMode = true;
        goodyPlayerSlot = "goody-contestant-2";
        contestantNames["goody-contestant-2"] = "Goody";
        pawn2.visible = true;
        p2PodiumGroup.visible = true;
        updatePawnNameBadge(pawn2, "Goody");

        bootStudio();
        const speech = `Welcome to The Goody Tonight Show! We are starting in 1-Player versus Goody mode! I am taking control of Podium 2. Let's roll our dice and start the show!`;
        speakGoody(speech, () => {
          beginTenSecondDiceDuel();
        });
      } else if (modeType === "TWOPLAYER") {
        isSoloMode = false;
        isVsGoodyMode = false;
        pawn2.visible = true;
        p2PodiumGroup.visible = true;
        bootStudio();
        const speech = `Welcome to The Goody Tonight Show! We are running full 2-Player mode with ${contestantNames["goody-contestant-1"]} and ${contestantNames["goody-contestant-2"]}! Let's determine who goes first with our opening dice roll!`;
        speakGoody(speech, () => {
          beginTenSecondDiceDuel();
        });
      }
    }

    function checkReadyOrWait() {
      if (!timerExpired) return;
      if (isP1Connected && isP2Connected) {
        countdownPill.innerHTML = ` <span style="color:#39ff14;">LIVE ON AIR!</span>`;
        if (!studioPower) bootStudio();
      } else {
        const missing = [];
        if (!isP1Connected) missing.push(contestantNames["goody-contestant-1"] || "Player 1");
        if (!isP2Connected) missing.push(contestantNames["goody-contestant-2"] || "Player 2");
        countdownPill.innerHTML = ` <span style="color:#ff7675;">WAITING FOR ${missing.join(' & ').toUpperCase()}...</span>`;
      }
      renderStageQuestionBoard();
    }

    function broadcastBoardState() {
      connectedDataConns.forEach(c => {
        if (c.open) {
          c.send({
            type: "SYNC_BOARD_STATE",
            studioPower: studioPower,
            p1Name: contestantNames["goody-contestant-1"] || "Player 1",
            p2Name: contestantNames["goody-contestant-2"] || "Player 2",
            p1Index: p1Index,
            p2Index: p2Index
          });
        }
      });
    }

    function forwardContestantStreamsToAudience(audiencePeerId) {
      if (!studioPeer) return;
      if (rawPlayer1Stream) {
        try {
          studioPeer.call(audiencePeerId, rawPlayer1Stream, {
            metadata: { contestant: "goody-contestant-1" }
          });
        } catch(e) {}
      }
      if (rawPlayer2Stream) {
        try {
          studioPeer.call(audiencePeerId, rawPlayer2Stream, {
            metadata: { contestant: "goody-contestant-2" }
          });
        } catch(e) {}
      }
    }

    function broadcastNewStreamToAllAudience(stream, contestantSlot) {
      if (!studioPeer || !stream) return;
      connectedAudiencePeers.forEach(audPeerId => {
        try {
          studioPeer.call(audPeerId, stream, {
            metadata: { contestant: contestantSlot }
          });
        } catch(e) {}
      });
    }

    function handleMidGameDropout(contestantId) {
      if (gameState === "GAME_OVER" || gameState === "INTERMISSION") return;

      if (goodyUtterance) {
        goodyUtterance.onend = null;
        goodyUtterance.onerror = null;
      }
      window.speechSynthesis.cancel();
      isGoodySpeaking = false;

      broadcastMicState("goody-contestant-1", false);
      broadcastMicState("goody-contestant-2", false);

      if (diceInterval) clearInterval(diceInterval);
      if (questionInterval) clearInterval(questionInterval);
      if (matchTimerInterval) clearInterval(matchTimerInterval);

      isPawnMoving = false;
      hasPlayerRolledThisTurn = false;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;
      isQuestionTimerActive = false;
      questionTimer = 0;

      savedGameState = gameState;
      savedTurnPlayer = activePlayer;
      savedActiveCountry = activeQuestion ? activeQuestion.country : null;

      activeQuestion = null;
      activeRecap = null;
      stageSelectedOption = null;
      stageOptionStatus = null;

      gameState = "INTERMISSION";
      droppedOutContestant = contestantId;
      droppedOutName = contestantNames[contestantId] || "";
      droppedOutCity = contestantCities[contestantId] || "";
      droppedOutSessionToken = contestantTokens[contestantId] || null;

      const droppedNum = contestantId === "goody-contestant-1" ? `Player 1 (${droppedOutName})` : `Player 2 (${droppedOutName})`;

      countdownPill.innerHTML = ` <span style="color:#ff7675;">INTERMISSION: WAITING FOR RECONNECT...</span>`;
      renderStageQuestionBoard();

      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "INTERMISSION_PAUSE", droppedContestant: contestantId });
      });

      const speech = `Ladies and gentlemen, it appears ${droppedNum} has lost connection! We are taking a short intermission while our studio crew gets them back online!`;
      speakGoody(speech);

      if (intermissionTimeout) clearTimeout(intermissionTimeout);
      intermissionTimeout = setTimeout(() => {
        if (gameState === "INTERMISSION") {
          triggerOfferChoiceMode();
        }
      }, 90000);
    }

    function triggerOnePlayerMode() {
      if (gameState !== "INTERMISSION" && gameState !== "CONTESTANT_CHOOSING" && gameState !== "MODE_PROMPT") return;

      if (intermissionTimeout) clearTimeout(intermissionTimeout);
      isSoloMode = true;
      isVsGoodyMode = false;

      soloPlayerId = "goody-contestant-1";
      const soloName = contestantNames[soloPlayerId];
      activePlayer = soloPlayerId;

      p2RollVal = null;
      isDiceRollingP2 = false;
      pawn2.visible = false;
      p2PodiumGroup.visible = false;

      countdownPill.innerHTML = ` <span style="color:#39ff14;">SOLO RACE ACTIVE!</span>`;
      gameState = "IN_PLAY";
      renderStageQuestionBoard();

      startTwentyMinuteMatchTimer();
      broadcastBoardState();

      const speech = `Welcome back to the show! ${soloName} will now race the board alone to see if they can reach the end before the 20-minute show clock expires! Let's play!`;
      speakGoody(speech, () => {
        if (savedActiveCountry && savedTurnPlayer === soloPlayerId) {
          const countryToAsk = savedActiveCountry;
          savedActiveCountry = null;
          resumeWithFreshQuestion(soloPlayerId, countryToAsk);
        } else {
          savedActiveCountry = null;
          startTurnCleanly(soloPlayerId);
        }
      });
    }

    function triggerOfferChoiceMode() {
      if (gameState !== "INTERMISSION") return;

      if (intermissionTimeout) clearTimeout(intermissionTimeout);
      gameState = "CONTESTANT_CHOOSING";

      const remainingId = isP1Connected ? "goody-contestant-1" : "goody-contestant-2";
      const remainingName = contestantNames[remainingId];

      countdownPill.innerHTML = ` <span style="color:#ffda66;">WAITING FOR ${remainingName.toUpperCase()}'S CHOICE...</span>`;
      renderStageQuestionBoard();

      const speech = `Welcome back to The Goody Tonight Show! Unfortunately, we have been unable to find a replacement. So ${remainingName}, you can choose to go solo against the 20-minute timer, or battle me, Goody, head-to-head! Make your choice now!`;
      speakGoody(speech, () => {
        connectedDataConns.forEach(c => {
          if (c.open) c.send({ type: "OFFER_CONTESTANT_CHOICE" });
        });
      });
    }

    function triggerVsGoodyMode() {
      isSoloMode = false;
      isVsGoodyMode = true;

      goodyPlayerSlot = droppedOutContestant || "goody-contestant-2";
      contestantNames[goodyPlayerSlot] = "Goody";

      if (goodyPlayerSlot === "goody-contestant-1") {
        pawn1.visible = true;
        p1PodiumGroup.visible = true;
        updatePawnNameBadge(pawn1, "Goody");
      } else {
        pawn2.visible = true;
        p2PodiumGroup.visible = true;
        updatePawnNameBadge(pawn2, "Goody");
      }

      const humanId = goodyPlayerSlot === "goody-contestant-1" ? "goody-contestant-2" : "goody-contestant-1";
      const humanName = contestantNames[humanId];

      countdownPill.innerHTML = ` <span style="color:#00f0ff;">GOODY VS ${humanName.toUpperCase()}!</span>`;

      if (gameState === "MODE_PROMPT" || savedGameState === "INTRO_SPEECH" || savedGameState === "OPENING_DUEL" || savedGameState === "IDLE") {
        gameState = "OPENING_DUEL";
        renderStageQuestionBoard();
        const speech = `A bold choice! You have chosen to battle me, Goody! I am taking over the board! Let's roll our dice to determine who goes first!`;
        speakGoody(speech, () => {
          beginTenSecondDiceDuel();
        });
        return;
      }

      gameState = "IN_PLAY";
      renderStageQuestionBoard();
      startTwentyMinuteMatchTimer();
      broadcastBoardState();

      const speech = `A bold choice! You have chosen to battle me, Goody! I am hopping into the hot seat! Let's resume!`;
      speakGoody(speech, () => {
        if (savedActiveCountry) {
          const countryToAsk = savedActiveCountry;
          savedActiveCountry = null;
          resumeWithFreshQuestion(savedTurnPlayer, countryToAsk);
        } else {
          startTurnCleanly(savedTurnPlayer);
        }
      });
    }

    function resumeWithFreshQuestion(turnPlayer, country) {
      activePlayer = turnPlayer;
      const pName = contestantNames[activePlayer];
      activeRecap = null;
      stageSelectedOption = null;
      stageOptionStatus = null;
      p1RollVal = null;
      p2RollVal = null;
      hasPlayerRolledThisTurn = false;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;

      if (questionInterval) clearInterval(questionInterval);
      isQuestionTimerActive = false;
      questionTimer = 0;

      const qPool = COUNTRY_QUESTIONS[country] || COUNTRY_QUESTIONS["UK"];
      const rawQ = qPool[Math.floor(Math.random() * qPool.length)];

      activeQuestion = {
        country: country,
        text: rawQ.q,
        q: rawQ.q,
        options: rawQ.options,
        ans: rawQ.ans,
        recap: rawQ.recap
      };

      connectedDataConns.forEach(c => {
        if (c.open) c.send({
          type: "SHOW_QUESTION_LOCKED",
          question: activeQuestion,
          activeContestantId: activePlayer,
          activeContestantName: pName
        });
      });
      renderStageQuestionBoard();

      const speech = `Resuming on ${country} for ${pName}! Here is your fresh question: ${activeQuestion.q}... You have 30 seconds to lock in!`;
      speakGoody(speech, () => {
        if (gameState === "INTERMISSION") return;

        if (activePlayer === goodyPlayerSlot) {
          executeGoodyAnswer();
        } else {
          connectedDataConns.forEach(c => {
            if (c.open) c.send({
              type: "UNLOCK_QUESTION_INPUT",
              activeContestantId: activePlayer,
              activeContestantName: pName
            });
          });
          broadcastMicState(activePlayer, true, "🎙️ Thinking out loud? Your mic is LIVE!");
          startQuestionCountdown();
        }
      });
    }

    function startTurnCleanly(turnPlayer) {
      activePlayer = turnPlayer;
      const pName = contestantNames[activePlayer];
      activeQuestion = null;
      activeRecap = null;
      stageSelectedOption = null;
      stageOptionStatus = null;
      p1RollVal = null;
      p2RollVal = null;
      hasPlayerRolledThisTurn = false;
      isPawnMoving = false;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;

      if (questionInterval) clearInterval(questionInterval);
      isQuestionTimerActive = false;
      questionTimer = 0;

      renderStageQuestionBoard();

      broadcastMicState("goody-contestant-1", false);
      broadcastMicState("goody-contestant-2", false);

      if (activePlayer === goodyPlayerSlot) {
        speakGoody(`It is my turn! Goody is rolling the dice!`, () => {
          setTimeout(executeGoodyTurnRoll, 1000);
        });
      } else {
        speakGoody(`It is now ${pName}'s turn! It's time to roll your dice!`, () => {
          startTurnDicePrompt(activePlayer, pName);
        });
      }
    }

    function startTurnDicePrompt(turnPlayer, pName) {
      hasPlayerRolledThisTurn = false;
      isPawnMoving = false;
      if (turnPlayer === "goody-contestant-2") isDiceRollingP2 = true;
      else isDiceRollingP1 = true;

      renderStageQuestionBoard();
      connectedDataConns.forEach(c => {
        if (c.open) c.send({
          type: "ENABLE_TURN_ROLL",
          activeContestantId: turnPlayer,
          activeContestantName: pName
        });
      });
    }

    function executeGoodyTurnRoll() {
      if (hasPlayerRolledThisTurn || isPawnMoving) return;

      const isGoodyP2 = goodyPlayerSlot === "goody-contestant-2";
      if (isGoodyP2) isDiceRollingP2 = true;
      else isDiceRollingP1 = true;

      renderStageQuestionBoard();
      const rollVal = Math.floor(Math.random() * 6) + 1;
      setTimeout(() => {
        handlePlayerRoll(goodyPlayerSlot, "Goody", rollVal);
      }, 1200);
    }

    function calculateGoodyAccuracy() {
      let accuracy = 0.65;
      if (playerStats.asked > 0) {
        const humanRatio = playerStats.correct / playerStats.asked;
        if (humanRatio > 0.7) accuracy += 0.15;
        if (humanRatio < 0.4) accuracy -= 0.15;
      }
      const humanIdx = goodyPlayerSlot === "goody-contestant-1" ? p2Index : p1Index;
      const goodyIdx = goodyPlayerSlot === "goody-contestant-1" ? p1Index : p2Index;
      const leadGap = goodyIdx - humanIdx;
      if (leadGap >= 4) accuracy -= 0.25;
      else if (leadGap <= -4) accuracy += 0.20;
      return Math.max(0.30, Math.min(0.90, accuracy));
    }

    function executeGoodyAnswer() {
      const willBeCorrect = Math.random() < calculateGoodyAccuracy();
      let chosen = activeQuestion.ans;

      if (!willBeCorrect) {
        const wrongOpts = activeQuestion.options.filter(o => o !== activeQuestion.ans);
        chosen = wrongOpts[Math.floor(Math.random() * wrongOpts.length)];
      }

      setTimeout(() => {
        stageSelectedOption = chosen;
        stageOptionStatus = 'selected';
        renderStageQuestionBoard();

        connectedDataConns.forEach(c => {
          if (c.open) {
            c.send({
              type: "OPPONENT_ANSWERED",
              contestant: "goody-host-bot",
              chosenAnswer: chosen
            });
          }
        });

        setTimeout(() => {
          evaluateAnswer(goodyPlayerSlot, chosen);
        }, 1400);
      }, 2500);
    }

    function broadcastMicState(targetSlot, enabled, promptText = "") {
      connectedDataConns.forEach(c => {
        if (c.open && c.metadata && c.metadata.contestant === targetSlot) {
          c.send({
            type: "SET_MIC_STATE",
            enabled: enabled,
            promptText: promptText
          });
        }
      });
    }

    let currentSubtitle = "STUDIO STANDBY - POWER OFF";

    const COUNTRY_QUESTIONS = {
      "UK": [
        { q: "In the UK, before the 2019 stake reduction, what was the maximum stake per spin on a Fixed-Odds-Betting-Terminal?", options: ["£2", "£50", "£100", "£500"], ans: "£100", recap: "In April 2019, the UK reduced the maximum FOBT stake per spin from £100 down to £2 to combat severe harms." },
        { q: "In the UK, what is the name of the land-based self-exclusion scheme that covers Betting Shops (Bookies)?", options: ["Bingo Association", "SENSE", "Bacta", "Moses"], ans: "Moses", recap: "MOSES allows people to self-exclude across high street bookmakers in their chosen localities." },
        { q: "In the UK, what is the name of the land-based self-exclusion scheme that covers Casinos?", options: ["Bacta", "SENSE", "Moses", "Bingo Association"], ans: "SENSE", recap: "SENSE allows players to enroll once to be excluded from all UK commercial casinos." }
      ],
      "Canada": [
        { q: "In Ontario, what is the name of the land-based self-exclusion scheme that covers Casinos?", options: ["SENSE", "MyPlay Break", "Bacta", "BetGuard"], ans: "MyPlay Break", recap: "MyPlay Break is Ontario's official casino self-exclusion initiative managed by OLG." },
        { q: "What is the name of Ontario's national online self-exclusion scheme?", options: ["BetGuard", "RUA", "GamStop", "Oasis"], ans: "BetGuard", recap: "BetGuard centralizes online exclusion across licensed iGaming Ontario operators." }
      ],
      "Brazil": [

    function initStudioWebRTC() {
      if (!isHostAuthorized || studioPeer) return;

      try {
        studioPeer = new Peer("goody-main-studio");

        studioPeer.on('open', (id) => console.log("Master Host Registered:", id));

        studioPeer.on('call', (call) => {
          const isAudience = call.metadata && call.metadata.role === 'AUDIENCE';

          if (isAudience) {
            call.answer();
            return;
          }

          const passcode = call.metadata ? call.metadata.passcode : "";
          if (passcode !== studioRoomCode) {
            call.close();
            return;
          }

          const cId = call.metadata ? call.metadata.contestant : null;
          if (cId === "goody-contestant-1" && isP1Connected && p1PeerId && p1PeerId !== call.peer) {
            call.close();
            return;
          }
          if (cId === "goody-contestant-2" && isP2Connected && p2PeerId && p2PeerId !== call.peer) {
            call.close();
            return;
          }

          const isPlayer2 = cId === "goody-contestant-2";
          const returnStream = isPlayer2 ? streamPlayer2 : streamPlayer1;
          call.answer(returnStream);

          call.on('stream', (remoteStream) => {
            if (isPlayer2) {
              rawPlayer2Stream = remoteStream;
              videoPlayer2.srcObject = remoteStream;
              videoPlayer2.muted = false;
              videoPlayer2.play().catch(console.error);
              hasLivePlayer2Stream = true;
              showPlayer2 = true;
              broadcastNewStreamToAllAudience(remoteStream, "goody-contestant-2");
            } else {
              rawPlayer1Stream = remoteStream;
              videoPlayer1.srcObject = remoteStream;
              videoPlayer1.muted = false;
              videoPlayer1.play().catch(console.error);
              hasLivePlayer1Stream = true;
              showPlayer1 = true;
              broadcastNewStreamToAllAudience(remoteStream, "goody-contestant-1");
            }
            broadcastBoardState();
          });
        });

        studioPeer.on('connection', (conn) => {
          const isAudience = conn.metadata && conn.metadata.role === 'AUDIENCE';

          if (!isAudience) {
            const passcode = conn.metadata ? conn.metadata.passcode : "";
            if (passcode !== studioRoomCode) {
              conn.on('open', () => {
                conn.send({ type: "AUTH_FAILED", message: "Invalid 4-digit code." });
                setTimeout(() => conn.close(), 500);
              });
              return;
            }

            const cId = conn.metadata ? conn.metadata.contestant : null;
            const isSlot1Taken = (cId === "goody-contestant-1" && isP1Connected && p1PeerId && p1PeerId !== conn.peer);
            const isSlot2Taken = (cId === "goody-contestant-2" && isP2Connected && p2PeerId && p2PeerId !== conn.peer);

            if (isSlot1Taken || isSlot2Taken) {
              conn.on('open', () => {
                conn.send({
                  type: "SLOT_TAKEN",
                  takenNum: cId === "goody-contestant-1" ? "1" : "2",
                  slotName: contestantNames[cId] || "Occupied",
                  altNum: cId === "goody-contestant-1" ? "2" : "1",

                });
                setTimeout(() => conn.close(), 600);
              });
              return;
            }
          }

          connectedDataConns.push(conn);

          conn.on('open', () => {
            if (isAudience) {
              connectedAudiencePeers.add(conn.peer);
              broadcastAudienceCount();

              const mins = Math.max(0, Math.floor(matchTimerSeconds / 60)).toString().padStart(2, '0');
              const secs = Math.max(0, (matchTimerSeconds % 60)).toString().padStart(2, '0');
              conn.send({ type: "SYNC_MATCH_TIMER", timeStr: `${mins}:${secs}`, secondsLeft: matchTimerSeconds });

              conn.send({
                type: "SYNC_BOARD_STATE",
                studioPower: studioPower,
                p1Name: contestantNames["goody-contestant-1"] || "Player 1",
                p2Name: contestantNames["goody-contestant-2"] || "Player 2",
                p1Index: p1Index,
                p2Index: p2Index
              });

              if (activeQuestion) {
                conn.send({
                  type: "SHOW_QUESTION_LOCKED",
                  question: activeQuestion,
                  activeContestantId: activePlayer,
                  activeContestantName: contestantNames[activePlayer]
                });
              }

              setTimeout(() => {
                forwardContestantStreamsToAudience(conn.peer);
              }, 400);

              return;
            }

            const clientName = (conn.metadata && conn.metadata.name) ? conn.metadata.name.trim() : (cId === "goody-contestant-2" ? "Player 2" : "Player 1");
            const clientCity = (conn.metadata && conn.metadata.city) ? conn.metadata.city.trim() : (cId === "goody-contestant-2" ? "Nottingham" : "London");
            const clientToken = conn.metadata ? conn.metadata.sessionToken : null;
            const cId = conn.metadata ? conn.metadata.contestant : null;

            if (cId === "goody-contestant-1") {
              isP1Connected = true;
              p1PeerId = conn.peer;
              if (clientToken) contestantTokens["goody-contestant-1"] = clientToken;
              if (gameState !== "INTERMISSION") {
                contestantNames["goody-contestant-1"] = clientName;
                contestantCities["goody-contestant-1"] = clientCity;
                updatePawnNameBadge(pawn1, clientName);
              }
            }
            if (cId === "goody-contestant-2") {
              isP2Connected = true;
              p2PeerId = conn.peer;
              if (clientToken) contestantTokens["goody-contestant-2"] = clientToken;
              if (gameState !== "INTERMISSION") {
                contestantNames["goody-contestant-2"] = clientName;
                contestantCities["goody-contestant-2"] = clientCity;
                updatePawnNameBadge(pawn2, clientName);
              }
            }

            conn.send({ type: "AUTH_SUCCESS" });
            broadcastAudienceCount();
            broadcastBoardState();
          });

          conn.on('data', (data) => {
            if (data.type === "SPECTATOR_MOVE") {
              connectedDataConns.forEach(c => {
                if (c.open && c.metadata && c.metadata.role === 'AUDIENCE' && c.peer !== conn.peer) {
                  c.send({
                    type: "SPECTATOR_POS_RELAY",
                    peerId: data.peerId,
                    name: data.name,
                    x: data.x,
                    y: data.y,
                    z: data.z,
                    yaw: data.yaw,
                    zone: data.zone
                  });
                }
              });
              return;
            }

            if (gameState === "INTERMISSION") return;

            if (data.type === "CONTESTANT_CHOSE_PATH") {
              if (gameState !== "CONTESTANT_CHOOSING" && gameState !== "MODE_PROMPT") return;
              if (data.choice === "SOLO") {
                triggerOnePlayerMode();
              } else if (data.choice === "GOODY") {
                triggerVsGoodyMode();
              } else if (data.choice === "TWOPLAYER") {
                chooseHostGameMode("TWOPLAYER");
              }
            } else if (data.type === "PLAYER_ROLLED_DICE") {
              handlePlayerRoll(data.contestant, data.name, data.roll);
            } else if (data.type === "PLAYER_ANSWERED") {
              broadcastMicState(data.contestant, false);

              if (isTieBreakerActive) {
                handleTieBreakerAnswer(data.contestant, data.chosenAnswer);
                return;
              }
              stageSelectedOption = data.chosenAnswer;
              stageOptionStatus = 'selected';
              renderStageQuestionBoard();

              connectedDataConns.forEach(c => {
                if (c.open) {
                  c.send({
                    type: "OPPONENT_ANSWERED",
                    contestant: data.contestant,
                    chosenAnswer: data.chosenAnswer
                  });
                }
              });

              setTimeout(() => {
                evaluateAnswer(data.contestant, data.chosenAnswer);
              }, 1200);
            } else if (data.type === "PLAYER_TIMEOUT") {
              broadcastMicState(data.contestant, false);
              if (isTieBreakerActive) return;
              handleQuestionTimeout(data.contestant);
            } else if (data.type === "PLUSHIE_MOVE") {
              handlePlushieMovement(data.contestant, data.direction);
            } else if (data.type === "PLUSHIE_LOOK") {
              if (contestantRotations[data.contestant]) {
                contestantRotations[data.contestant].yaw += data.deltaX * 0.005;
                contestantRotations[data.contestant].pitch = Math.max(
                  -0.8,
                  Math.min(0.4, contestantRotations[data.contestant].pitch + data.deltaY * 0.005)
                );
              }
            }
          });

          conn.on('close', () => {
            connectedAudiencePeers.delete(conn.peer);
            connectedDataConns = connectedDataConns.filter(c => c.peer !== conn.peer);
            broadcastAudienceCount();

            const cId = conn.metadata ? conn.metadata.contestant : null;
            if (cId === "goody-contestant-1" && p1PeerId === conn.peer) {
              isP1Connected = false;
              p1PeerId = null;
            }
            if (cId === "goody-contestant-2" && p2PeerId === conn.peer) {
              isP2Connected = false;
              p2PeerId = null;
            }
          });
        });

      } catch(e) { console.error(e); }
    }

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (videoPlayer1.srcObject) videoPlayer1.play();
      if (videoPlayer2.srcObject) videoPlayer2.play();
    }
    function playTone(freq, type, duration, gainVal = 0.05) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function speakGoody(text, onComplete) {
      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "HOST_SPEAK", text: text });
      });

      if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
      }
     
      window.speechSynthesis.cancel();
      goodyUtterance = new SpeechSynthesisUtterance(text);
      goodyUtterance.rate = 0.95;
      goodyUtterance.pitch = 1.25;

      goodyUtterance.onstart = () => { isGoodySpeaking = true; };
      goodyUtterance.onboundary = (e) => {
        isGoodySpeaking = true;
        const chunk = text.substring(e.charIndex, e.charIndex + 65);
        currentSubtitle = chunk.length > 55 ? chunk.substring(0, 55) + "..." : chunk;
        playTone(460 + Math.random() * 200, 'triangle', 0.05, 0.02);
      };

      goodyUtterance.onend = () => {
        isGoodySpeaking = false;
        if (onComplete) onComplete();
      };

      goodyUtterance.onerror = () => {
        isGoodySpeaking = false;
        if (onComplete) onComplete();
      };

      window.speechSynthesis.speak(goodyUtterance);
    }

    function handlePlayerRoll(contestant, name, roll) {
      if (gameState === "OPENING_DUEL") {
        if (contestant === "goody-contestant-2") {
          if (p2RollVal !== null) return;
          p2RollVal = roll; isDiceRollingP2 = false;
        } else {
          if (p1RollVal !== null) return;
          p1RollVal = roll; isDiceRollingP1 = false;
        }
        playTone(587, 'sine', 0.15, 0.08);
        renderStageQuestionBoard();

        if ((isSoloMode && p1RollVal !== null) || (p1RollVal !== null && p2RollVal !== null)) {
          setTimeout(finalizeDiceDuel, 600);
        }
      } else if (gameState === "IN_PLAY") {
        if (contestant !== activePlayer || hasPlayerRolledThisTurn || isPawnMoving) {
          if (contestant === "goody-contestant-2") isDiceRollingP2 = false;
          else isDiceRollingP1 = false;
          return;
        }
        hasPlayerRolledThisTurn = true;
        isPawnMoving = true;
       
        if (contestant === "goody-contestant-2") {
          p2RollVal = roll; isDiceRollingP2 = false;
        } else {
          p1RollVal = roll; isDiceRollingP1 = false;
        }
        playTone(587, 'sine', 0.15, 0.08);
        renderStageQuestionBoard();

        const speech = contestant === goodyPlayerSlot
          ? `I rolled a ${roll}! Moving forwards ${roll} spaces!`
          : `${name} rolled a ${roll}! Moving ${roll} spaces.`;

        speakGoody(speech, () => {
          advanceTurnPlayer(contestant, roll);
        });
      }
    }

      matchTimerInterval = setInterval(() => {
        if (gameState !== "IN_PLAY") return;
        matchTimerSeconds--;

        const mins = Math.max(0, Math.floor(matchTimerSeconds / 60)).toString().padStart(2, '0');
        const secs = Math.max(0, (matchTimerSeconds % 60)).toString().padStart(2, '0');

    function finalizeDiceDuel() {
      if (p1RollVal === null) p1RollVal = Math.floor(Math.random() * 6) + 1;
      if (!isSoloMode && p2RollVal === null) p2RollVal = Math.floor(Math.random() * 6) + 1;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;

      if (!isSoloMode && p1RollVal === p2RollVal) {
        const tieVal = p1RollVal;
        const speech = `Both contestants rolled a ${tieVal}! It's a dead heat tie! We must re-roll to decide who goes first! Click or press spacebar to roll again!`;
        speakGoody(speech, () => {
          p1RollVal = null;
          p2RollVal = null;
          beginTenSecondDiceDuel();
        });
        return;
      }

      const winnerNum = isSoloMode ? 1 : (p1RollVal > p2RollVal ? 1 : 2);
      activePlayer = winnerNum === 1 ? "goody-contestant-1" : "goody-contestant-2";
      const finalWinningRoll = winnerNum === 1 ? p1RollVal : p2RollVal;

      gameState = "IN_PLAY";
      hasPlayerRolledThisTurn = false;
      isPawnMoving = true;
      renderStageQuestionBoard();
      startTwentyMinuteMatchTimer();
      broadcastBoardState();

      const pName = contestantNames[activePlayer];
      speakGoody(`${pName} wins the opening roll with a ${finalWinningRoll}! The 20-minute show clock has begun! Moving ${finalWinningRoll} spaces.`, () => {
        advanceTurnPlayer(activePlayer, finalWinningRoll);
      });
    }

    function animatePawnHop(pawn, fromIdx, toIdx, offsetX, onComplete, hopDurationMs = 280) {
      if (fromIdx === toIdx) {
        if (onComplete) onComplete();
        return;
      }

      const stepDirection = toIdx > fromIdx ? 1 : -1;
      let currentHopIdx = fromIdx;

      function hopNextStep() {
        if (gameState === "INTERMISSION") {
          isPawnMoving = false;
          return;
        }

        if (currentHopIdx === toIdx) {
          if (onComplete) onComplete();
          return;
        }

        const nextHopIdx = currentHopIdx + stepDirection;
        const startPos = {
          x: boardTileCoords[currentHopIdx].x + offsetX,
          y: 0.52,
          z: boardTileCoords[currentHopIdx].z
        };
        const endPos = {
          x: boardTileCoords[nextHopIdx].x + offsetX,
          y: 0.52,
          z: boardTileCoords[nextHopIdx].z
        };

        const hopStartTime = performance.now();
        playTone(320 + Math.random() * 80, 'sine', 0.06, 0.04);

        function stepFrame(now) {
          if (gameState === "INTERMISSION") {
            isPawnMoving = false;
            return;
          }

          const elapsed = now - hopStartTime;
          const progress = Math.min(1.0, elapsed / hopDurationMs);

          const jumpArc = 4.0 * 0.35 * progress * (1.0 - progress);

          pawn.position.x = startPos.x + (endPos.x - startPos.x) * progress;
          pawn.position.y = 0.52 + jumpArc;
          pawn.position.z = startPos.z + (endPos.z - startPos.z) * progress;

          if (progress < 1.0) {
            requestAnimationFrame(stepFrame);
          } else {
            pawn.position.set(endPos.x, 0.52, endPos.z);
            playTone(220, 'triangle', 0.05, 0.03);
            currentHopIdx = nextHopIdx;
            setTimeout(hopNextStep, 50);
          }
        }

        requestAnimationFrame(stepFrame);
      }

      hopNextStep();
    }

    function advanceTurnPlayer(playerSlot, roll) {
      const isP1 = playerSlot === "goody-contestant-1";
      const oldIdx = isP1 ? p1Index : p2Index;
      const targetIdx = Math.min(boardTileCoords.length - 1, oldIdx + roll);
      const targetPawn = isP1 ? pawn1 : pawn2;
      const xOffset = isP1 ? -0.08 : 0.08;

      if (isP1) p1Index = targetIdx;
      else p2Index = targetIdx;

      animatePawnHop(targetPawn, oldIdx, targetIdx, xOffset, () => {
        isPawnMoving = false;
        broadcastBoardState();

        if (p1Index >= boardTileCoords.length - 1 || p2Index >= boardTileCoords.length - 1) {
          const winName = isP1 ? contestantNames["goody-contestant-1"] : contestantNames["goody-contestant-2"];
          const loseName = isP1 ? contestantNames["goody-contestant-2"] : contestantNames["goody-contestant-1"];
          triggerFinishLineVictory(winName, loseName);
          return;
        }

        const currentTileIdx = isP1 ? p1Index : p2Index;
        const landedCountry = boardTileCoords[currentTileIdx].country;
        const qPool = COUNTRY_QUESTIONS[landedCountry] || COUNTRY_QUESTIONS["UK"];
        const rawQ = qPool[Math.floor(Math.random() * qPool.length)];
       
        activeQuestion = {
          country: landedCountry,
          text: rawQ.q,
          q: rawQ.q,
          options: rawQ.options,
          ans: rawQ.ans,
          recap: rawQ.recap
        };
        activeRecap = null;
        stageSelectedOption = null;
        stageOptionStatus = null;

        if (questionInterval) clearInterval(questionInterval);
        isQuestionTimerActive = false;
        questionTimer = 0;

        const activeName = contestantNames[activePlayer];

        connectedDataConns.forEach(c => {
          if (c.open) c.send({
            type: "SHOW_QUESTION_LOCKED",
            question: activeQuestion,
            activeContestantId: activePlayer,
            activeContestantName: activeName
          });
        });
        renderStageQuestionBoard();

    function handlePlushieMovement(contestant, direction) {
      const targetPlushie = contestant === "goody-contestant-2" ? playerPlushie2 : playerPlushie1;
      if (!targetPlushie) return;

      const rot = contestantRotations[contestant] ? contestantRotations[contestant].yaw : 0;
      const step = 0.35;

      const fwdX = -Math.sin(rot);
      const fwdZ = -Math.cos(rot);
      const rightX = Math.cos(rot);
      const rightZ = -Math.sin(rot);

      if (direction === 'FORWARD') {
        targetPlushie.position.x += fwdX * step;
        targetPlushie.position.z += fwdZ * step;
      }
      if (direction === 'BACK') {
        targetPlushie.position.x -= fwdX * step;
        targetPlushie.position.z -= fwdZ * step;
      }
      if (direction === 'LEFT') {
        targetPlushie.position.x -= rightX * step;
        targetPlushie.position.z -= rightZ * step;
      }
      if (direction === 'RIGHT') {
        targetPlushie.position.x += rightX * step;
        targetPlushie.position.z += rightZ * step;
      }

      targetPlushie.position.x = Math.max(-6.8, Math.min(6.8, targetPlushie.position.x));
      targetPlushie.position.z = Math.max(-6.8, Math.min(6.8, targetPlushie.position.z));
      targetPlushie.position.y = 0.46;
    }

    function drawDiceFace(ctx, x, y, size, value) {
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#222222'; ctx.lineWidth = 3;
      ctx.fillRect(x, y, size, size); ctx.strokeRect(x, y, size, size);
      ctx.fillStyle = '#e74c3c';
      const dot = (dx, dy) => {
        ctx.beginPath(); ctx.arc(x + dx * size, y + dy * size, size * 0.08, 0, Math.PI * 2); ctx.fill();
      };
      if (value % 2 === 1) dot(0.5, 0.5);
      if (value > 1) { dot(0.25, 0.25); dot(0.75, 0.75); }
      if (value > 3) { dot(0.75, 0.25); dot(0.25, 0.75); }
      if (value === 6) { dot(0.25, 0.5); dot(0.75, 0.5); }
    }

    const studioScreenCanvas = document.createElement('canvas'); studioScreenCanvas.width = 512; studioScreenCanvas.height = 256;
    const sScreenCtx = studioScreenCanvas.getContext('2d');
    const studioScreenTex = new THREE.CanvasTexture(studioScreenCanvas);

    function drawScreenFeed(ctx, x, y, width, height, name, city, isLive, videoElem, isGuy, currentRoll, isRolling, isGoodyHostSlot) {
      ctx.fillStyle = '#05020a'; ctx.fillRect(x, y, width, height);
      ctx.strokeStyle = isGoodyHostSlot ? '#a29bfe' : (isLive ? '#39ff14' : '#ffb300');
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, width, height);

      if (isGoodyHostSlot) {
        ctx.fillStyle = '#16082b';
        ctx.fillRect(x + 2, y + 2, width - 4, height - 4);

        const cx = x + width / 2;
        const cy = y + height * 0.45;

        ctx.fillStyle = '#cccccc';
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(cx - 40, cy - 35, 80, 70);

        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 24, cy - 10);
        ctx.lineTo(cx - 14, cy - 22);
        ctx.lineTo(cx - 4, cy - 10);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx + 4, cy - 10);
        ctx.lineTo(cx + 14, cy - 22);
        ctx.lineTo(cx + 24, cy - 10);
        ctx.stroke();

        if (isGoodySpeaking) {
          ctx.beginPath();
          ctx.ellipse(cx, cy + 15, 16, 8, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(cx, cy + 10, 12, 0.2, Math.PI - 0.2, false);
          ctx.stroke();
        }
      } else if (isLive && videoElem.readyState >= 2) {
        ctx.save(); ctx.drawImage(videoElem, x + 2, y + 2, width - 4, height - 4); ctx.restore();
      } else {
        ctx.fillStyle = isGuy ? '#1b2a47' : '#3d1b38'; ctx.fillRect(x + 2, y + 2, width - 4, height - 4);
        const cx = x + width / 2; const cy = y + height * 0.58;
        ctx.fillStyle = isGuy ? '#4a69bd' : '#e84393'; ctx.beginPath(); ctx.ellipse(cx, cy + 25, 26, 32, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f8c291'; ctx.beginPath(); ctx.arc(cx, cy - 10, 16, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx - 5, cy - 10, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 5, cy - 10, 2, 0, Math.PI * 2); ctx.fill();
      }

      const diceSize = 42;
      const diceX = x + width - diceSize - 12;
      const diceY = y + 12;

      if (isRolling) {
        const animVal = Math.floor((performance.now() / 80) % 6) + 1;
        drawDiceFace(ctx, diceX, diceY, diceSize, animVal);
      } else if (currentRoll !== null) {
        drawDiceFace(ctx, diceX, diceY, diceSize, currentRoll);
      }

      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(x, y + height - 26, width, 26);
      ctx.fillStyle = isGoodyHostSlot ? '#00f0ff' : (isLive ? '#39ff14' : '#ffda66');
      ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
     
      const tag = isGoodyHostSlot
        ? `[AI HOST: GOODY]`
        : `${isLive ? ' LIVE ' : ' CALL'} ${name.toUpperCase()} [${city.toUpperCase()}]`;

      ctx.fillText(tag, x + width/2, y + height - 8);
    }

    function renderBackstageScreens() {
      sScreenCtx.fillStyle = '#060210'; sScreenCtx.fillRect(0, 0, 512, 256);
      if (studioPower) {
        const isP1Goody = isVsGoodyMode && goodyPlayerSlot === "goody-contestant-1";
        const isP2Goody = isVsGoodyMode && goodyPlayerSlot === "goody-contestant-2";

        if (isP1Goody || (showPlayer1 && (!isSoloMode || soloPlayerId === "goody-contestant-1"))) {
          drawScreenFeed(sScreenCtx, 15, 20, 225, 215, contestantNames["goody-contestant-1"], contestantCities["goody-contestant-1"], hasLivePlayer1Stream, videoPlayer1, true, p1RollVal, isDiceRollingP1, isP1Goody);
        } else {
          sScreenCtx.strokeStyle = '#ffb300'; sScreenCtx.lineWidth = 3; sScreenCtx.strokeRect(15, 20, 225, 215);
          sScreenCtx.fillStyle = '#ffda66'; sScreenCtx.font = 'bold 22px sans-serif'; sScreenCtx.textAlign = 'center';
          sScreenCtx.fillText(isSoloMode && soloPlayerId !== "goody-contestant-1" ? "WITHDRAWN" : `PLAYER 1`, 127, 120);
          sScreenCtx.fillStyle = '#39ff14'; sScreenCtx.font = '14px monospace'; sScreenCtx.fillText(gameState === "INTERMISSION" ? "DISCONNECTED" : (isSoloMode ? "OFF-AIR" : "STANDBY..."), 127, 150);
        }

        if (isP2Goody || (showPlayer2 && (!isSoloMode || soloPlayerId === "goody-contestant-2"))) {
          drawScreenFeed(sScreenCtx, 272, 20, 225, 215, contestantNames["goody-contestant-2"], contestantCities["goody-contestant-2"], hasLivePlayer2Stream, videoPlayer2, false, p2RollVal, isDiceRollingP2, isP2Goody);
        } else {
          sScreenCtx.strokeStyle = '#ffb300'; sScreenCtx.lineWidth = 3; sScreenCtx.strokeRect(272, 20, 225, 215);
          sScreenCtx.fillStyle = '#ffda66'; sScreenCtx.font = 'bold 22px sans-serif'; sScreenCtx.textAlign = 'center';
          sScreenCtx.fillText(isSoloMode && soloPlayerId !== "goody-contestant-2" ? "WITHDRAWN" : `PLAYER 2`, 384, 120);
          sScreenCtx.fillStyle = '#39ff14'; sScreenCtx.font = '14px monospace'; sScreenCtx.fillText(gameState === "INTERMISSION" ? "DISCONNECTED" : (isSoloMode ? "OFF-AIR" : "STANDBY..."), 384, 150);
        }
      }
      studioScreenTex.needsUpdate = true;
    }
    const studioBackScreenMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.8), new THREE.MeshBasicMaterial({ map: studioScreenTex }));
    studioBackScreenMesh.position.set(0, 3.4, -4.5); miniDiorama.add(studioBackScreenMesh);

    const miniGoody = new THREE.Group();
    const silverMetalMat = new THREE.MeshStandardMaterial({
      color: 0xcccccc, metalness: 0.95, roughness: 0.15
    });

    const gPodium = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.6, 20), new THREE.MeshStandardMaterial({ color: 0x2b154a }));
    gPodium.position.y = 0.74; miniGoody.add(gPodium);

    const podiumTrim = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.05, 20), silverMetalMat);
    podiumTrim.position.y = 1.02; miniGoody.add(podiumTrim);

    const gBody = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.4), silverMetalMat);
    gBody.position.y = 1.34; miniGoody.add(gBody);
    const gHead = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.35, 0.35), silverMetalMat);
    gHead.position.y = 1.82; miniGoody.add(gHead);
    const gAntennaStem = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.22, 8), silverMetalMat);
    gAntennaStem.position.y = 2.08; miniGoody.add(gAntennaStem);
    const gAntOrb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x111111 }));
    gAntOrb.position.y = 2.20; miniGoody.add(gAntOrb);

    const faceCanvas = document.createElement('canvas'); faceCanvas.width = 128; faceCanvas.height = 128;
    const fctx = faceCanvas.getContext('2d'); fctx.fillStyle = '#00'; fctx.fillRect(0, 0, 128, 128);
    const faceTex = new THREE.CanvasTexture(faceCanvas);
    const gFace = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.25), new THREE.MeshBasicMaterial({ map: faceTex }));
    gFace.position.set(0, 1.82, 0.19); miniGoody.add(gFace);

    miniGoody.position.set(0, 0, -2.6);
    miniDiorama.add(miniGoody);

    function renderGoodyFace(time) {
      fctx.fillStyle = '#030108';
      fctx.fillRect(0, 0, 128, 128);

      if (!studioPower) {
        gAntOrb.material.color.setHex(0x111111);
        faceTex.needsUpdate = true;
        return;
      }

      gAntOrb.material.color.setHex(isGoodySpeaking ? 0x00f0ff : 0x39ff14);

      fctx.fillStyle = '#39ff14'; fctx.strokeStyle = '#39ff14'; fctx.lineWidth = 4;
      fctx.lineCap = 'round'; fctx.lineJoin = 'round';

      fctx.beginPath();
      fctx.moveTo(28, 56); fctx.lineTo(44, 38); fctx.lineTo(60, 56); fctx.stroke();
      fctx.beginPath();
      fctx.moveTo(68, 56); fctx.lineTo(84, 38); fctx.lineTo(100, 56); fctx.stroke();

      if (isGoodySpeaking) {
        const mouthOpen = (Math.sin(time * 0.022) + 1.0) * 0.5;
        const mouthHeight = 6 + (mouthOpen * 20);
        const mouthWidth = 40 + (mouthOpen * 6);

        fctx.fillStyle = '#220033'; fctx.strokeStyle = '#39ff14'; fctx.lineWidth = 3.5;
        fctx.beginPath();
        fctx.ellipse(64, 88, mouthWidth / 2, mouthHeight / 2, 0, 0, Math.PI * 2);
        fctx.fill(); fctx.stroke();

        fctx.fillStyle = '#ffffff';
        fctx.fillRect(54, 88 - (mouthHeight / 2) + 2, 20, Math.min(5, mouthHeight / 2));
      } else {
        fctx.strokeStyle = '#39ff14'; fctx.lineWidth = 5;
        fctx.beginPath();
        fctx.arc(64, 78, 16, 0.2, Math.PI - 0.2, false);
        fctx.stroke();
      }

      faceTex.needsUpdate = true;
    }

    function createStudioRoboticCamera(x, z) {
      const camRig = new THREE.Group(); camRig.position.set(x, 0.44, z);
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1f1f26 });
      const basePlate = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 0.08, 16), darkMat); basePlate.position.y = 0.04; camRig.add(basePlate);
      const outerCol = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.55, 16), darkMat); outerCol.position.y = 0.35; camRig.add(outerCol);
      const headPivot = new THREE.Group(); headPivot.position.y = 1.0;
      const cameraBox = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.24, 0.42), darkMat); headPivot.add(cameraBox);
      const lensBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.26, 16), new THREE.MeshStandardMaterial({ color: 0x0a0a0a }));
      lensBarrel.rotation.x = Math.PI / 2; lensBarrel.position.set(0, 0, -0.24); headPivot.add(lensBarrel);
      const frontGlass = new THREE.Mesh(new THREE.CircleGeometry(0.08, 16), new THREE.MeshBasicMaterial({ color: 0x00f0ff }));
      frontGlass.position.set(0, 0, -0.431); headPivot.add(frontGlass);
      const tallyLamp = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), new THREE.MeshBasicMaterial({ color: 0x111111 }));
      tallyLamp.position.set(0, 0.15, -0.28); headPivot.add(tallyLamp);
      camRig.add(headPivot); miniDiorama.add(camRig);
      return { headPivot, tallyLamp, frontGlass };
    }
    const autoCam1 = createStudioRoboticCamera(-2.4, 0.3);
    const autoCam2 = createStudioRoboticCamera(2.4, 0.3);

    function updateCameraAlignment() {
      const hostHeadPos = new THREE.Vector3(0, 5.77, -11.6);
      if (studioPower) {
        autoCam1.headPivot.lookAt(hostHeadPos); autoCam2.headPivot.lookAt(hostHeadPos);
        autoCam1.headPivot.rotation.y += Math.PI; autoCam2.headPivot.rotation.y += Math.PI;
        autoCam1.tallyLamp.material.color.setHex(0xff0000); autoCam2.tallyLamp.material.color.setHex(0xff0000);
      } else {
        autoCam1.headPivot.rotation.set(0.6, 0.2, 0); autoCam2.headPivot.rotation.set(0.6, -0.2, 0);
        autoCam1.tallyLamp.material.color.setHex(0x111111); autoCam2.tallyLamp.material.color.setHex(0x111111);
      }
    }
    scene.add(miniDiorama);

    const move = { forward: false, backward: false, left: false, right: false };
    const velocity = new THREE.Vector3();
    document.addEventListener('keyup', (e) => {
      if (!isHostAuthorized) return;
      if (e.code === 'KeyW') move.forward = false; if (e.code === 'KeyS') move.backward = false;
      if (e.code === 'KeyA') move.left = false; if (e.code === 'KeyD') move.right = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function syncContestantCameras() {
      const dist = 1.8; const height = 1.2;

      if (playerPlushie1) {
        const rot = contestantRotations["goody-contestant-1"];
        playerPlushie1.rotation.y = rot.yaw;
        const worldX = playerPlushie1.position.x;
        const worldY = playerPlushie1.position.y + 3.95;
        const worldZ = playerPlushie1.position.z - 9.0;

        camPlayer1.position.set(
          worldX + Math.sin(rot.yaw) * dist,
          worldY + height,
          worldZ + Math.cos(rot.yaw) * dist
        );
        camPlayer1.lookAt(new THREE.Vector3(
          worldX - Math.sin(rot.yaw) * 4.0,
          worldY + 0.5 + rot.pitch * 3.0,
          worldZ - Math.cos(rot.yaw) * 4.0
        ));
      }

      if (playerPlushie2) {
        const rot = contestantRotations["goody-contestant-2"];
        playerPlushie2.rotation.y = rot.yaw;
        const worldX = playerPlushie2.position.x;
        const worldY = playerPlushie2.position.y + 3.95;
        const worldZ = playerPlushie2.position.z - 9.0;

        camPlayer2.position.set(
          worldX + Math.sin(rot.yaw) * dist,
          worldY + height,
          worldZ + Math.cos(rot.yaw) * dist
        );
        camPlayer2.lookAt(new THREE.Vector3(
          worldX - Math.sin(rot.yaw) * 4.0,
          worldY + 0.5 + rot.pitch * 3.0,
          worldZ - Math.cos(rot.yaw) * 4.0
        ));
      }
    }

    let prevTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.1);

      renderBackstageScreens();
      renderGoodyFace(time);

      if (pawn1 && pawn1.userData && pawn1.userData.badgeMesh) {
        pawn1.userData.badgeMesh.quaternion.copy(camera.quaternion);
      }
      if (pawn2 && pawn2.userData && pawn2.userData.badgeMesh) {
        pawn2.userData.badgeMesh.quaternion.copy(camera.quaternion);
      }

      if (studioPower) {
        updateCameraAlignment();
        fixtureCyan.target.position.x = -1.2 + Math.sin(time * 0.003) * 1.5;
        fixtureMagenta.target.position.x = 1.2 + Math.cos(time * 0.003) * 1.5;

        miniAudience.children.forEach((p) => {
          if (p !== playerPlushie1 && p !== playerPlushie2) {
            p.position.y = p.userData.initialY + Math.sin(time * 0.006 + p.userData.phase) * 0.04;
          }
        });
      }

      if (controls.isLocked) {
        velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;
        const speed = 45.0;
        if (move.forward || move.backward) velocity.z -= (Number(move.forward) - Number(move.backward)) * speed * delta;
        if (move.left || move.right) velocity.x -= (Number(move.right) - Number(move.left)) * speed * delta;
        controls.moveRight(-velocity.x * delta); controls.moveForward(-velocity.z * delta);
      }

      prevTime = time;
      syncContestantCameras();

      if (playerPlushie1) playerPlushie1.visible = false;
      if (playerPlushie2) playerPlushie2.visible = false;
      renderer.render(scene, camera);

      if (showPlayer1) {
        if (playerPlushie1) playerPlushie1.visible = true;
        rendererPlayer1.render(scene, camPlayer1);
        if (playerPlushie1) playerPlushie1.visible = false;
      }

      if (showPlayer2) {
        if (playerPlushie2) playerPlushie2.visible = true;
        rendererPlayer2.render(scene, camPlayer2);
        if (playerPlushie2) playerPlushie2.visible = false;
      }
    }
    animate();
  </script>
</body>
</html>
