<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Plushie Foosball & Rugby Arena</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #05020a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: manipulation;
    }
    #canvas3d { width: 100%; height: 100%; display: block; cursor: pointer; }

    #hud {
      position: absolute; top: 15px; left: 15px; background: rgba(22, 9, 44, 0.9);
      border: 2px solid #ff79b0; border-radius: 12px; padding: 12px 18px; color: #fff;
      font-family: monospace; font-size: 0.85rem; pointer-events: none; z-index: 20;
      box-shadow: 0 0 20px rgba(255, 121, 176, 0.25);
    }
    #room-code-pill { margin-top: 5px; font-weight: bold; color: #39ff14; font-size: 0.95rem; }
    #countdown-pill { margin-top: 6px; font-weight: bold; color: #ffda66; font-size: 0.95rem; }
    #match-clock-hud { margin-top: 4px; font-weight: bold; color: #00f0ff; font-size: 0.95rem; }
    #audience-pill { margin-top: 4px; font-weight: bold; color: #39ff14; }

    #mode-banner {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(22, 9, 44, 0.92); border: 2px solid #00f0ff; border-radius: 10px;
      padding: 10px 20px; color: #ffda66; font-family: monospace; font-size: 0.9rem;
      z-index: 25; text-align: center; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      pointer-events: none;
    }
    #mobile-dpad {
      position: absolute; bottom: 30px; left: 30px; display: none;
      grid-template-areas: ". up ." "left down right";
      gap: 12px; z-index: 30; pointer-events: auto; touch-action: none;
    }
    @media (pointer: coarse), (max-width: 900px) {
      #mobile-dpad { display: grid; }
    }
    .dpad-btn {
      width: 60px; height: 60px; background: rgba(22, 9, 44, 0.85);
      border: 2px solid #00f0ff; border-radius: 14px; color: #00f0ff; font-size: 22px;
      display: flex; align-items: center; justify-content: center; user-select: none;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
    }
    .dpad-btn.active, .dpad-btn:active {
      background: rgba(0, 240, 255, 0.45); border-color: #39ff14; color: #39ff14; box-shadow: 0 0 22px #39ff14;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-title" id="mode-title" style="color: #ffda66;">STUDIO FLOOR & WIDE PLUSHIE RUGBY-FOOTIE ARENA</div>
    <div class="hud-sub" id="mode-sub">Bump into the ball with your belly & bash into friends!</div>
    <div id="room-code-pill">CODE: <span id="hud-code-val">----</span></div>
    <div id="countdown-pill">STATUS: <span id="timer-val" style="color:#ffda66;">WALK WAY OUT EAST TO THE GIANT FOOTBALL PITCH!</span></div>
    <div id="match-clock-hud">SHOW CLOCK: <span id="game-clock-val" style="color:#ffda66;">20:00</span></div>
    <div id="audience-pill">AUDIENCE WATCHING: <span id="audience-count" style="color:#39ff14;">1</span></div>
  </div>

  <div id="mode-banner">
    Move with <span style="color:#39ff14;">W, A, S, D</span> • Walk far out East to the expanded <span style="color:#00f0ff;">Plushie Bumper Arena</span>!
  </div>

  <canvas id="canvas3d"></canvas>

  <div id="mobile-dpad">
    <div class="dpad-btn" id="btn-up" style="grid-area: up;">▲</div>
    <div class="dpad-btn" id="btn-left" style="grid-area: left;">◄</div>
    <div class="dpad-btn" id="btn-down" style="grid-area: down;">▼</div>
    <div class="dpad-btn" id="btn-right" style="grid-area: right;">►</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    let isHostAuthorized = true;
    let socket = null;
    const remotePlayers = new Map();
    let localMyGuestName = "Guest " + Math.floor(100 + Math.random() * 900);
    let isBallPhysicsHost = false;

    function unlockHostEnvironment() {
      isHostAuthorized = true;
      initAudio();
      initStudioWebRTC();
      initSocketConnection();
      triggerImmediateModePrompt();
    }

    window.addEventListener('DOMContentLoaded', () => { unlockHostEnvironment(); });

    const studioRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('hud-code-val').textContent = studioRoomCode;

    let studioPower = false;
    let isGoodySpeaking = false;
    let gameState = "MODE_PROMPT";
    let isSoloMode = false;
    let isVsGoodyMode = false;
    let goodyPlayerSlot = null;
    let soloPlayerId = null;

    let matchTimerSeconds = 20 * 60;
    let matchTimerInterval = null;
    let gameClockValEl = document.getElementById('game-clock-val');
    let activePlayer = "goody-contestant-1";
    let activeQuestion = null;
    let activeRecap = null;
    let questionTimer = 0;
    let isQuestionTimerActive = false;
    let questionInterval = null;

    let audienceCount = 1;
    const audienceCountEl = document.getElementById('audience-count');
    const countdownPill = document.getElementById('countdown-pill');

    let podium1PriorityTimer = 10;
    let podium1PriorityInterval = null;
    let isPodium1WaitingForP2 = false;
    let p1LockoutUntil = 0;
    let p2LockoutUntil = 0;

    const contestantNames = { "goody-contestant-1": "Player 1", "goody-contestant-2": "Player 2" };
    const contestantCities = { "goody-contestant-1": "London", "goody-contestant-2": "Nottingham" };
    const playerStats = { asked: 0, correct: 0 };

    let isP1Connected = false;
    let isP2Connected = false;
    let droppedOutContestant = null;
    let intermissionTimeout = null;

    function initSocketConnection() {
      try {
        socket = io();
        socket.on('ball_host_assignment', (data) => { isBallPhysicsHost = data.isHost; });
        socket.on('assign_team', (data) => {
          if (data.name) localMyGuestName = data.name;
        });
        socket.on('update_player', (data) => {
          let pMesh = remotePlayers.get(data.id);
          const remoteTeam = data.team || 'BLUE';
          const remotePlushieHex = remoteTeam === 'RED' ? 0xff3838 : 0x00f0ff;
          const playerName = data.name || "Guest";
          if (!pMesh) {
            pMesh = createCutePlushie(remotePlushieHex, playerName);
            miniDiorama.add(pMesh);
            remotePlayers.set(data.id, pMesh);
          }
          pMesh.position.set(data.x, data.y, data.z);
        });
        socket.on('remove_player', (id) => {
          const pMesh = remotePlayers.get(id);
          if (pMesh) { miniDiorama.remove(pMesh); remotePlayers.delete(id); }
        });
      } catch (e) { console.warn("Socket offline", e); }
    }

    function triggerImmediateModePrompt() {
      if (studioPower) return;
      gameState = "MODE_PROMPT";
      countdownPill.innerHTML = `STATUS: <span style="color:#ffda66;">SELECT GAME MODE (STEP ON PODIUM 1)</span>`;
      renderStageQuestionBoard();
    }

    function startPodium1PriorityCountdown() {
      if (isPodium1WaitingForP2) return;
      isPodium1WaitingForP2 = true;
      podium1PriorityTimer = 10;
      renderStageQuestionBoard();

      speakGoody("Podium 1 secured! Checking for Player 2 on Podium 2 for 10 seconds!", () => {
        if (podium1PriorityInterval) clearInterval(podium1PriorityInterval);
        podium1PriorityInterval = setInterval(() => {
          if (!isLocalOnPodium1) {
            stopPodium1PriorityCountdown();
            return;
          }
          if (isLocalOnPodium2) {
            stopPodium1PriorityCountdown();
            speakGoody("Player 2 detected! Launching 2-Player mode!");
            chooseHostGameMode("TWOPLAYER");
            return;
          }

          podium1PriorityTimer--;
          renderStageQuestionBoard();

          if (podium1PriorityTimer <= 0) {
            stopPodium1PriorityCountdown();
            speakGoody("Time's up for Player 2! Solo and vs Goody modes unlocked.");
            renderStageQuestionBoard();
          }
        }, 1000);
      });
    }

    function stopPodium1PriorityCountdown() {
      if (podium1PriorityInterval) { clearInterval(podium1PriorityInterval); podium1PriorityInterval = null; }
      isPodium1WaitingForP2 = false;
    }

    function chooseHostGameMode(modeType) {
      if (studioPower) return;
      if (modeType === "TWOPLAYER" && !isLocalOnPodium2) {
        speakGoody("2-Player mode requires a second player standing on Podium 2!");
        return;
      }

      if (modeType === "SOLO") {
        isSoloMode = true; isVsGoodyMode = false; soloPlayerId = "goody-contestant-1";
        activePlayer = soloPlayerId;
        bootStudio();
        speakGoody(`Starting 1-Player Solo mode! Let's race to tile 32!`, () => { startTurnCleanly(soloPlayerId); });
      } else if (modeType === "GOODY") {
        isSoloMode = false; isVsGoodyMode = true; goodyPlayerSlot = "goody-contestant-2";
        contestantNames["goody-contestant-2"] = "Goody";
        bootStudio();
        speakGoody(`Starting vs Goody mode! I am taking control of Podium 2!`, () => { beginTenSecondDiceDuel(); });
      } else if (modeType === "TWOPLAYER") {
        isSoloMode = false; isVsGoodyMode = false;
        bootStudio();
        speakGoody(`Starting 2-Player mode! Let's roll for first turn!`, () => { beginTenSecondDiceDuel(); });
      }
    }

    function beginTenSecondDiceDuel() { gameState = "OPENING_DUEL"; renderStageQuestionBoard(); }

    function handleMidGameDropout(contestantId) {
      if (gameState === "GAME_OVER" || gameState === "INTERMISSION") return;
      window.speechSynthesis.cancel();
      gameState = "INTERMISSION";
      droppedOutContestant = contestantId;
      countdownPill.innerHTML = `STATUS: <span style="color:#ff7675;">INTERMISSION: 10S PODIUM REPLACEMENT TIMER...</span>`;
      renderStageQuestionBoard();
      speakGoody(`A player stepped off their podium! 10 second replacement timer active!`);

      if (intermissionTimeout) clearTimeout(intermissionTimeout);
      intermissionTimeout = setTimeout(() => {
        if (gameState === "INTERMISSION") { gameState = "CONTESTANT_CHOOSING"; }
      }, 10000);
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040208);
    scene.fog = new THREE.FogExp2(0x040208, 0.015);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 5.8, -5.0);

    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    const ambientLight = new THREE.AmbientLight(0x181026, 0.85); scene.add(ambientLight);
    const ceilingLight = new THREE.PointLight(0xffecd2, 1.0, 50); ceilingLight.position.set(0, 13.5, 0); scene.add(ceilingLight);

    const miniDiorama = new THREE.Group(); miniDiorama.position.set(0, 3.95, -9);
    const feltCarpet = new THREE.Mesh(new THREE.CylinderGeometry(7.0, 7.0, 0.08, 48), new THREE.MeshStandardMaterial({ color: 0x271147 }));
    feltCarpet.position.y = 0.44; miniDiorama.add(feltCarpet);

    const p1PodiumGroup = new THREE.Group();
    const p1PodiumBase = new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.48, 0.55, 20), new THREE.MeshStandardMaterial({ color: 0x1b0c30 }));
    p1PodiumBase.position.y = 0.275; p1PodiumGroup.add(p1PodiumBase);
    p1PodiumGroup.position.set(-1.6, 0.44, -2.2); miniDiorama.add(p1PodiumGroup);

    const p2PodiumGroup = new THREE.Group();
    const p2PodiumBase = new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.48, 0.55, 20), new THREE.MeshStandardMaterial({ color: 0x1b0c30 }));
    p2PodiumBase.position.y = 0.275; p2PodiumGroup.add(p2PodiumBase);
    p2PodiumGroup.position.set(1.6, 0.44, -2.2); miniDiorama.add(p2PodiumGroup);

    const qBoardCanvas = document.createElement('canvas'); qBoardCanvas.width = 512; qBoardCanvas.height = 384;
    const qBoardCtx = qBoardCanvas.getContext('2d'); const qBoardTex = new THREE.CanvasTexture(qBoardCanvas);

    let isLocalOnPodium1 = false;
    let isLocalOnPodium2 = false;

    function renderStageQuestionBoard() {
      qBoardCtx.fillStyle = '#120726'; qBoardCtx.fillRect(0, 0, 512, 384);
      qBoardCtx.strokeStyle = '#00f0ff'; qBoardCtx.lineWidth = 6; qBoardCtx.strokeRect(3, 3, 506, 378);

      if (gameState === "MODE_PROMPT") {
        qBoardCtx.fillStyle = '#ffda66'; qBoardCtx.font = 'bold 24px sans-serif'; qBoardCtx.textAlign = 'center';
        qBoardCtx.fillText("CHOOSE GAME MODE", 256, 45);

        if (!isLocalOnPodium1) {
          qBoardCtx.fillStyle = '#ff7675'; qBoardCtx.font = 'bold 15px sans-serif';
          qBoardCtx.fillText("STEP ON PODIUM 1 WITH YOUR PLUSHIE TO UNLOCK!", 256, 180);
        } else if (isPodium1WaitingForP2) {
          qBoardCtx.fillStyle = '#00f0ff'; qBoardCtx.font = 'bold 18px monospace';
          qBoardCtx.fillText(`CHECKING FOR PLAYER 2... (${podium1PriorityTimer}s)`, 256, 110);
          qBoardCtx.fillStyle = '#ff7675'; qBoardCtx.font = 'bold 14px sans-serif';
          qBoardCtx.fillText("All modes locked while checking Podium 2", 256, 195);
        } else {
          qBoardCtx.fillStyle = '#ffffff'; qBoardCtx.font = '15px sans-serif';
          qBoardCtx.fillText("SELECT START MODE (TAP OR PRESS 1-3):", 256, 85);

          qBoardCtx.fillStyle = '#3498db'; qBoardCtx.fillRect(40, 110, 432, 42);
          qBoardCtx.fillStyle = '#ffffff'; qBoardCtx.font = 'bold 16px monospace';
          qBoardCtx.fillText("[1] 1-PLAYER SOLO RACE", 256, 137);

          qBoardCtx.fillStyle = '#e74c3c'; qBoardCtx.fillRect(40, 162, 432, 42);
          qBoardCtx.fillStyle = '#ffffff'; qBoardCtx.fillText("[2] 1-PLAYER VS GOODY", 256, 189);

          if (isLocalOnPodium2) {
            qBoardCtx.fillStyle = '#9b59b6'; qBoardCtx.fillRect(40, 214, 432, 42);
            qBoardCtx.fillStyle = '#ffffff'; qBoardCtx.fillText("[3] 2-PLAYER MODE (READY!)", 256, 241);
          } else {
            qBoardCtx.fillStyle = '#444444'; qBoardCtx.fillRect(40, 214, 432, 42);
            qBoardCtx.fillStyle = '#888888'; qBoardCtx.fillText("[3] 2-PLAYER MODE (LOCKED: NEEDS P2)", 256, 241);
          }
        }
      } else {
        qBoardCtx.fillStyle = '#ffda66'; qBoardCtx.font = 'bold 24px sans-serif'; qBoardCtx.textAlign = 'center';
        qBoardCtx.fillText("THE GOODY TONIGHT SHOW", 256, 180);
      }
      qBoardTex.needsUpdate = true;
    }
    renderStageQuestionBoard();

    const qBoardMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.7), new THREE.MeshBasicMaterial({ map: qBoardTex }));
    qBoardMesh.position.set(-4.8, 3.4, -3.2); qBoardMesh.rotation.y = 0.8; miniDiorama.add(qBoardMesh);

    const screenClickMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.7), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 }));
    screenClickMesh.position.copy(qBoardMesh.position); screenClickMesh.rotation.copy(qBoardMesh.rotation);
    miniDiorama.add(screenClickMesh);

    const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();

    function handleScreenTap(clientX, clientY) {
      if (!isHostAuthorized) return;
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([screenClickMesh, qBoardMesh], false);

      if (intersects.length > 0 && gameState === "MODE_PROMPT" && isLocalOnPodium1 && !isPodium1WaitingForP2) {
        const uv = intersects[0].uv;
        if (uv) {
          if (uv.y > 0.60) chooseHostGameMode("SOLO");
          else if (uv.y > 0.40) chooseHostGameMode("GOODY");
          else if (isLocalOnPodium2) chooseHostGameMode("TWOPLAYER");
        }
      }
    }

    window.addEventListener('pointerup', (e) => { handleScreenTap(e.clientX, e.clientY); });

    const moveState = { forward: false, backward: false, turnLeft: false, turnRight: false };
    const plushiePosition = new THREE.Vector3(32.0, 0.44, 2.5);
    const plushieRotation = { yaw: 0 };
    const plushieVelocity = new THREE.Vector3(0, 0, 0);

    function createCutePlushie(color, initialName = "") {
      const pGroup = new THREE.Group();
      const pMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.95 });
      const pBody = new THREE.Mesh(new THREE.SphereGeometry(0.28, 14, 14), pMat); pBody.position.y = 0.28; pGroup.add(pBody);
      const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), pMat); pHead.position.y = 0.58; pGroup.add(pHead);
      return pGroup;
    }

    let localPlushie = createCutePlushie(0x00f0ff, localMyGuestName);
    localPlushie.position.copy(plushiePosition); miniDiorama.add(localPlushie);

    document.addEventListener('keydown', (e) => {
      if (!isHostAuthorized) return;
      if (e.code === 'KeyW') moveState.forward = true;
      if (e.code === 'KeyS') moveState.backward = true;
      if (e.code === 'KeyA') moveState.turnLeft = true;
      if (e.code === 'KeyD') moveState.turnRight = true;

      if (gameState === "MODE_PROMPT" && isLocalOnPodium1 && !isPodium1WaitingForP2) {
        if (e.key === '1') chooseHostGameMode("SOLO");
        if (e.key === '2') chooseHostGameMode("GOODY");
        if (e.key === '3' && isLocalOnPodium2) chooseHostGameMode("TWOPLAYER");
      }
    });

    document.addEventListener('keyup', (e) => {
      if (!isHostAuthorized) return;
      if (e.code === 'KeyW') moveState.forward = false;
      if (e.code === 'KeyS') moveState.backward = false;
      if (e.code === 'KeyA') moveState.turnLeft = false;
      if (e.code === 'KeyD') moveState.turnRight = false;
    });

    scene.add(miniDiorama);

    let prevTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.1);

      if (moveState.turnLeft) plushieRotation.yaw += 2.2 * delta;
      if (moveState.turnRight) plushieRotation.yaw -= 2.2 * delta;

      const moveSpeed = 4.2 * delta;
      if (moveState.forward) {
        plushieVelocity.x += -Math.sin(plushieRotation.yaw) * moveSpeed * 5.0;
        plushieVelocity.z += -Math.cos(plushieRotation.yaw) * moveSpeed * 5.0;
      }
      if (moveState.backward) {
        plushieVelocity.x -= -Math.sin(plushieRotation.yaw) * moveSpeed * 5.0;
        plushieVelocity.z -= -Math.cos(plushieRotation.yaw) * moveSpeed * 5.0;
      }

      plushieVelocity.multiplyScalar(0.90);
      plushiePosition.addScaledVector(plushieVelocity, delta);
      plushiePosition.x = Math.max(-6.5, Math.min(54.0, plushiePosition.x));
      plushiePosition.z = Math.max(-13.5, Math.min(13.5, plushiePosition.z));

      localPlushie.position.copy(plushiePosition);
      localPlushie.rotation.y = plushieRotation.yaw + Math.PI;

      const dioramaWorldPos = new THREE.Vector3(0, 3.95, -9);
      const plushieWorldPos = plushiePosition.clone().add(dioramaWorldPos);

      const p1Pos = new THREE.Vector3(-1.6, 0.44, -2.2);
      const p2Pos = new THREE.Vector3(1.6, 0.44, -2.2);

      const nowSec = Date.now();
      const canUsePodium1 = nowSec > p1LockoutUntil;
      const canUsePodium2 = nowSec > p2LockoutUntil;

      const distP1 = canUsePodium1 ? plushiePosition.distanceTo(p1Pos) : 999;
      const distP2 = canUsePodium2 ? plushiePosition.distanceTo(p2Pos) : 999;

      const prevPodium1 = isLocalOnPodium1;
      const prevPodium2 = isLocalOnPodium2;

      isLocalOnPodium1 = distP1 < 0.65;
      isLocalOnPodium2 = distP2 < 0.65;

      if (prevPodium1 && !isLocalOnPodium1 && gameState === "IN_PLAY") {
        p1LockoutUntil = Date.now() + 30000;
        handleMidGameDropout("goody-contestant-1");
      }
      if (prevPodium2 && !isLocalOnPodium2 && gameState === "IN_PLAY") {
        p2LockoutUntil = Date.now() + 30000;
        handleMidGameDropout("goody-contestant-2");
      }

      if (isLocalOnPodium1 && !prevPodium1 && gameState === "MODE_PROMPT" && !studioPower) {
        startPodium1PriorityCountdown();
      } else if (!isLocalOnPodium1 && prevPodium1 && isPodium1WaitingForP2) {
        stopPodium1PriorityCountdown();
        renderStageQuestionBoard();
      }

      if ((isLocalOnPodium1 !== prevPodium1) || (isLocalOnPodium2 !== prevPodium2)) {
        if (!studioPower && gameState === "MODE_PROMPT") {
          renderStageQuestionBoard();
        }
      }

      const camTargetX = plushieWorldPos.x + Math.sin(plushieRotation.yaw) * 3.2;
      const camTargetZ = plushieWorldPos.z + Math.cos(plushieRotation.yaw) * 3.2;
      const camTargetY = plushieWorldPos.y + 1.6;

      const smoothFactor = 1.0 - Math.exp(-12.0 * delta);
      camera.position.x += (camTargetX - camera.position.x) * smoothFactor;
      camera.position.y += (camTargetY - camera.position.y) * smoothFactor;
      camera.position.z += (camTargetZ - camera.position.z) * smoothFactor;
      camera.lookAt(plushieWorldPos.x, plushieWorldPos.y + 0.6, plushieWorldPos.z);

      prevTime = time;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
